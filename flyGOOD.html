<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easylandx</title>
<style>
  :root{
    --cream: #fdf6e3;
    --ivory: #fffaf0;
    --champagne: #f7e7ce;
    --gold: #c9a24b;
    --gold-dark: #a9822f;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    min-height:100%;
    background: radial-gradient(circle at 50% 20%, var(--ivory), var(--champagne) 60%, var(--cream) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:40px 20px;
  }
  .frame{
    position:relative;
    width:min(90vw, 420px);
    aspect-ratio: 720 / 1280;
    border-radius: 28px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(169,130,47,0.25), 0 4px 14px rgba(0,0,0,0.08);
  }
  .frame img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }
  .video-mask{
    position:absolute;
    left:8.06%;
    top:14.7%;
    width:85.55%;
    height:66.9%;
    overflow:hidden;
    clip-path: polygon(32.0% 0.0%, 20.8% 2.5%, 15.3% 4.9%, 11.4% 7.5%, 8.4% 9.9%, 6.0% 12.5%, 4.2% 15.0%, 2.8% 17.4%, 1.6% 20.0%, 0.6% 22.4%, 0.0% 25.0%, 0.0% 27.5%, 0.2% 29.9%, 0.5% 32.5%, 0.8% 34.9%, 1.0% 37.5%, 1.3% 40.0%, 1.5% 42.4%, 1.6% 45.0%, 1.8% 47.4%, 1.9% 50.0%, 2.1% 52.5%, 2.3% 54.9%, 2.4% 57.5%, 2.6% 59.9%, 2.8% 62.5%, 2.9% 65.0%, 2.9% 67.4%, 3.1% 70.0%, 3.1% 72.4%, 3.1% 75.0%, 3.2% 77.5%, 3.2% 79.9%, 3.9% 82.5%, 5.2% 84.9%, 6.8% 87.5%, 9.1% 90.0%, 11.9% 92.4%, 15.9% 95.0%, 21.8% 97.4%, 38.1% 100.0%, 67.0% 100.0%, 79.2% 97.4%, 84.4% 95.0%, 88.0% 92.4%, 90.6% 90.0%, 92.5% 87.5%, 94.3% 84.9%, 95.3% 82.5%, 95.8% 79.9%, 95.9% 77.5%, 96.1% 75.0%, 96.3% 72.4%, 96.3% 70.0%, 96.4% 67.4%, 96.6% 65.0%, 96.8% 62.5%, 96.9% 59.9%, 97.1% 57.5%, 97.2% 54.9%, 97.6% 52.5%, 97.7% 50.0%, 97.9% 47.4%, 98.1% 45.0%, 98.4% 42.4%, 98.5% 40.0%, 98.9% 37.5%, 99.0% 34.9%, 99.4% 32.5%, 99.7% 29.9%, 100.0% 27.5%, 100.0% 25.0%, 99.5% 22.4%, 98.7% 20.0%, 97.4% 17.4%, 95.9% 15.0%, 94.0% 12.5%, 91.7% 9.9%, 88.8% 7.5%, 84.7% 4.9%, 79.4% 2.5%, 67.4% 0.0%);
    background:#000;
  }
  /* Sizing is computed in JS per-video (fitVideoToMask), because a
     fixed CSS aspect-ratio only covers the mask edge-to-edge for
     videos that actually match that ratio. Different source videos
     (landscape vs portrait) need different oversize amounts, or the
     player letterboxes internally and the background image peeks
     through. width/height are set inline in px by JS; this just
     anchors the centering. */
  .video-mask iframe{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    border:0;
  }
  .switcher{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .switcher button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(169,130,47,0.35);
    background: linear-gradient(135deg, var(--ivory), var(--champagne));
    color: var(--gold-dark);
    font-size:18px;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(169,130,47,0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .switcher button:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(169,130,47,0.3);
  }
  .switcher button:active{
    transform: translateY(0);
  }
  .cta{
    display:inline-block;
    padding:14px 38px;
    border-radius:999px;
    text-decoration:none;
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    color:#fffaf0;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    box-shadow: 0 8px 22px rgba(169,130,47,0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(169,130,47,0.45);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="frame">
      <img src="w2.jpg" alt="">
      <div class="video-mask">
        <div id="ytplayer"></div>
      </div>
    </div>
    <div class="switcher">
      <button id="prevBtn" aria-label="Previous video">&#8249;</button>
      <button id="nextBtn" aria-label="Next video">&#8250;</button>
    </div>
    <a class="cta" href="https://easylandx.github.io" target="_blank" rel="noopener">easylandx</a>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const VIDEOS = ['oYtU7jb9X4c', 'm7Tm51JuiY8', 'a11bGSG1mlk'];
    let currentIndex = 0;
    let player;
    let apiReady = false;

    // Cache each video's real aspect ratio (width/height) once fetched,
    // so switching back to a video already resolved is instant.
    const ratioCache = {};
    const FALLBACK_RATIO = 9 / 16; // used only if the lookup fails

    // YouTube's public oEmbed endpoint returns the source video's true
    // width/height — this is how we know whether a given video is
    // landscape, portrait, or square, without ever touching the
    // cross-origin iframe content itself.
    function getVideoRatio(videoId) {
      if (ratioCache[videoId]) return Promise.resolve(ratioCache[videoId]);
      const url = 'https://www.youtube.com/oembed?url=' +
        encodeURIComponent('https://www.youtube.com/watch?v=' + videoId) +
        '&format=json';
      return fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          const ratio = (data.width && data.height) ? (data.width / data.height) : FALLBACK_RATIO;
          ratioCache[videoId] = ratio;
          return ratio;
        })
        .catch(function () {
          return FALLBACK_RATIO;
        });
    }

    // True "cover" fit: size the iframe (in px) so it always overflows
    // the mask on at least one axis, whatever the video's real aspect
    // ratio is — the mask's overflow:hidden + clip-path crop the rest.
    // A fixed CSS aspect-ratio only achieves this for one specific
    // ratio; this recomputes it per video.
    function fitVideoToMask(ratio) {
      const mask = document.querySelector('.video-mask');
      const iframe = document.getElementById('ytplayer');
      if (!mask || !iframe) return;
      const maskW = mask.clientWidth;
      const maskH = mask.clientHeight;
      const maskRatio = maskW / maskH;
      let w, h;
      if (maskRatio > ratio) {
        // Mask is relatively wider than the video: match width, let
        // height overflow (and get cropped top/bottom).
        w = maskW;
        h = maskW / ratio;
      } else {
        // Mask is relatively taller than the video: match height, let
        // width overflow (and get cropped left/right).
        h = maskH;
        w = maskH * ratio;
      }
      iframe.style.width = w + 'px';
      iframe.style.height = h + 'px';
    }

    function applyFitForCurrentVideo() {
      getVideoRatio(VIDEOS[currentIndex]).then(fitVideoToMask);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer', {
        width: '100%',
        height: '100%',
        videoId: VIDEOS[currentIndex],
        playerVars: {
          autoplay: 1,
          mute: 0,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          showinfo: 0
        },
        events: {
          onReady: function (e) {
            apiReady = true;
            applyFitForCurrentVideo();
            // Attempt sound immediately — works in browsers that allow
            // it (e.g. if the visitor has already engaged with the site,
            // or on desktop browsers with a permissive autoplay policy).
            e.target.unMute();
            e.target.setVolume(100);
            e.target.playVideo();
          },
          onStateChange: function (e) {
            // Loop the current video manually (loadVideoById doesn't
            // support the playlist-based loop trick).
            if (e.data === YT.PlayerState.ENDED) {
              player.playVideo();
            }
          }
        }
      });
    }

    function switchVideo(newIndex) {
      currentIndex = (newIndex + VIDEOS.length) % VIDEOS.length;
      if (apiReady && player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(VIDEOS[currentIndex]);
        player.unMute();
        player.setVolume(100);
        applyFitForCurrentVideo();
      }
    }

    // Recompute on resize (the mask is sized in vw, so its pixel size
    // changes with the viewport).
    window.addEventListener('resize', function () {
      if (apiReady) applyFitForCurrentVideo();
    });

    document.getElementById('prevBtn').addEventListener('click', function () {
      switchVideo(currentIndex - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', function () {
      switchVideo(currentIndex + 1);
    });

    function activateSound() {
      if (apiReady && player && typeof player.unMute === 'function') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    // Guaranteed path: the first tap/click anywhere on the page unmutes
    // and plays. This satisfies every browser's autoplay-with-sound
    // policy, since it's tied directly to a user gesture.
    window.addEventListener('click', activateSound, { once: true });
    window.addEventListener('touchstart', activateSound, { once: true });
  </script>
</body>
</html>
