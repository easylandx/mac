<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TelePort</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Outfit',system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#1f5a56,#0e2a2b 62%);color:#fff4df;min-height:100vh;padding:28px 22px 40px;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(36px,8vw,60px);background:linear-gradient(90deg,#ffb703,#ff6b4a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.sub{opacity:.8;margin:4px 0 20px;text-align:center;max-width:520px}
.stage{position:relative;width:100%;max-width:880px;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px #ffb70077,0 18px 60px #000a,0 0 50px #ff6b4a44;background:#000}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.hint{position:absolute;inset:auto 0 14px 0;text-align:center;pointer-events:none}
.hint span{background:#000a;padding:8px 16px;border-radius:30px;font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;width:100%;max-width:880px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:40px;padding:12px 20px;color:#2a1204;cursor:pointer;background:linear-gradient(135deg,#ff6b4a,#ffb703);box-shadow:0 4px 18px #0006;text-decoration:none;display:inline-block}
button:disabled{opacity:.45;cursor:wait}
.alt{background:#143c3d;color:#fff4df;box-shadow:inset 0 0 0 2px #ffb70099}
.wa{background:#25d366;color:#04230f}
.pastehint{align-self:center;font-size:13px;opacity:.8;max-width:260px;line-height:1.25}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px;width:100%;max-width:880px}
input[type=text]{font:inherit;background:#123334;color:#fff4df;border:2px solid #2f6e68;border-radius:12px;padding:10px 14px;flex:1;min-width:200px;max-width:420px}
input[type=range]{accent-color:#ffb703;width:160px}
#st{margin-top:14px;min-height:22px;color:#ffb703;text-align:center}
.credit{margin-top:10px;font-size:12px;opacity:.55;text-align:center}
</style>
</head>
<body>
<h1>TelePort</h1>
<p class="sub" data-i="sub"></p>

<div class="stage">
  <canvas id="cv"></canvas>
  <div class="hint" id="hint"><span data-i="hint"></span></div>
</div>

<div class="bar">
  <label class="btn"><span data-i="selfie"></span><input id="fSelfie" type="file" accept="image/*" capture="user" hidden></label>
  <label class="btn alt"><span data-i="up"></span><input id="fUp" type="file" accept="image/*" hidden></label>
  <button class="alt" id="bNew" data-i="new"></button>
  <button class="alt" id="bSave" data-i="save" disabled></button>
  <button class="wa" id="bWa" disabled>WhatsApp</button>
  <small class="pastehint" id="pasteHint" data-i="paste"></small>
  <a class="btn alt" href="https://easylandx.github.io" target="_blank" rel="noopener" data-i="land"></a>
  <button class="alt" id="bLang">Español</button>
</div>

<div class="row">
  <input type="text" id="q" maxlength="80" autocomplete="off">
  <button id="bGo" data-i="go"></button>
</div>

<div class="row">
  <input type="text" id="loc" maxlength="60">
  <label><span data-i="size"></span> <input type="range" id="sz" min="20" max="95" value="55"></label>
</div>
<div id="st"></div>
<p class="credit" data-i="credit"></p>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),W=1600,H=1200;cv.width=W;cv.height=H;
const LINK='https://easylandx.github.io/mac/tele.html';
const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
const CATS=['Category:Featured_pictures_of_landscapes','Category:Featured_pictures_of_mountains','Category:Featured_pictures_of_beaches','Category:Featured_pictures_of_lakes','Category:Featured_pictures_of_deserts','Category:Featured_pictures_of_waterfalls','Category:Featured_pictures_of_coasts','Category:Featured_pictures_of_landscapes'];
const API='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=categorymembers&gcmtype=file&gcmlimit=50&gcmsort=timestamp&gcmdir=newer&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1600';
const I={
en:{sub:'Snap a selfie or a full body photo and beam yourself to a random place on Earth.',hint:'Add a photo to teleport yourself here',selfie:'📷 Take selfie',up:'🖼️ Upload photo',new:'🎲 Random',q:'Type a place or landmark (e.g. Eiffel Tower)',go:'Go',nores:'No photo found for that place. Try another name.',searching:'Searching Wikimedia Commons...',save:'⬇️ Save',land:'EasyLandX',size:'Size',loc:'Location title',credit:'Drag yourself to reposition. Landscapes come from Wikimedia Commons. Works with selfies and full body photos.',lang:'Español',finding:'Locating a faraway place...',offline:'Could not reach Wikimedia Commons. Check your connection and tap Random.',reading:'Reading your photo...',cutting:'Cutting you out...',noperson:'I could not find a person in that photo. Try another one.',err:'Something went wrong loading the cutout model. Check your connection and try again.',beam:'Teleporting...',saved:'Image saved. Attach it to the WhatsApp chat that just opened.',fallback:'Somewhere beautiful',send:'Send yours with TelePort:',paste:'On WhatsApp desktop Press Ctrl+V in the chat to paste the photo',copied:'Photo copied. Press Ctrl+V in the WhatsApp chat to paste it.'},
es:{sub:'Hazte un selfie o una foto de cuerpo entero y teletranspórtate a un lugar al azar del planeta.',hint:'Añade una foto para teletransportarte aquí',selfie:'📷 Hacer selfie',up:'🖼️ Subir foto',new:'🎲 Aleatorio',q:'Escribe un lugar o monumento (p. ej. Torre Eiffel)',go:'Ir',nores:'No encontré fotos de ese lugar. Prueba con otro nombre.',searching:'Buscando en Wikimedia Commons...',save:'⬇️ Guardar',land:'EasyLandX',size:'Tamaño',loc:'Título del lugar',credit:'Arrástrate para cambiar de posición. Los paisajes vienen de Wikimedia Commons. Funciona con selfies y fotos de cuerpo entero.',lang:'English',finding:'Buscando un lugar lejano...',offline:'No se pudo conectar con Wikimedia Commons. Revisa tu conexión y pulsa Aleatorio.',reading:'Leyendo tu foto...',cutting:'Recortándote...',noperson:'No encontré a ninguna persona en esa foto. Prueba con otra.',err:'Algo falló al cargar el modelo de recorte. Revisa tu conexión e inténtalo de nuevo.',beam:'Teletransportando...',saved:'Imagen guardada. Adjúntala en el chat de WhatsApp que se acaba de abrir.',fallback:'Un lugar precioso',send:'Envía la tuya con TelePort:',paste:'En WhatsApp de escritorio pulsa Ctrl+V en el chat para pegar la foto',copied:'Foto copiada. Pulsa Ctrl+V en el chat de WhatsApp para pegarla.'}
};
const isDesk=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)&&!matchMedia('(pointer:coarse)').matches;
let lang='en';const T=k=>I[lang][k];
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  $('loc').placeholder=T('loc');$('q').placeholder=T('q');$('q').setAttribute('aria-label',T('q'));$('loc').setAttribute('aria-label',T('loc'));$('bLang').textContent=T('lang');
}
let bg=null,bgSm=null,person=null,loc='',busy=false,st={x:.5,y:1,s:.55};

const status=t=>$('st').textContent=t||'';
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src});
function setBusy(b){busy=b;['bNew','bGo'].forEach(i=>$(i).disabled=b);$('bSave').disabled=b||!person;$('bWa').disabled=b||!bg}

function cleanTitle(t){
  return t.replace(/^File:/,'').replace(/\.[a-z]+$/i,'').replace(/_/g,' ').replace(/^[\d\s._-]+/,'')
   .replace(/\(.*?\)/g,'').replace(/\b(19|20)\d{2}\b.*$/,'').replace(/\b(panorama|hdr|dsc|img)\w*\b.*$/i,'')
   .replace(/[-,\s]+$/,'').replace(/\s+/g,' ').trim().slice(0,60)||T('fallback');
}

function setBg(img,title){
  bg=img;loc=title;$('loc').value=loc;
  bgSm=document.createElement('canvas');bgSm.width=32;bgSm.height=24;
  const r=Math.max(32/img.width,24/img.height),bw=img.width*r,bh=img.height*r;
  bgSm.getContext('2d',{willReadFrequently:true}).drawImage(img,(32-bw)/2,(24-bh)/2,bw,bh);
}
async function searchPlace(q){
  status(T('searching'));
  try{
    const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=1600';
    const j=await (await fetch(u)).json();
    const ps=Object.values((j.query&&j.query.pages)||{}).filter(p=>{const i=p.imageinfo&&p.imageinfo[0];return i&&i.mime==='image/jpeg'&&i.thumburl&&i.width>=1000&&i.width>i.height*1.15}).sort((a,b)=>a.index-b.index).slice(0,10);
    for(let n=0;n<ps.length&&n<5;n++){
      const p=ps.splice(Math.floor(Math.random()*ps.length),1)[0];
      try{
        const img=await loadImg(p.imageinfo[0].thumburl);
        const t=q===q.toLowerCase()?q.replace(/\b\w/g,c=>c.toUpperCase()):q;
        setBg(img,t);status('');return true;
      }catch(e){}
    }
    status(T('nores'));
  }catch(e){status(T('offline'))}
  return false;
}
async function loadLandscape(){
  status(T('finding'));
  for(let n=0;n<8;n++){
    try{
      const cat=CATS[Math.floor(Math.random()*CATS.length)];
      const a=Date.parse('2009-01-01'),b=Date.parse('2025-06-30');
      const start=new Date(a+Math.random()*(b-a)).toISOString();
      const j=await (await fetch(API+'&gcmtitle='+encodeURIComponent(cat)+'&gcmstart='+start)).json();
      const ps=Object.values((j.query&&j.query.pages)||{}).filter(p=>{const i=p.imageinfo&&p.imageinfo[0];return i&&i.mime==='image/jpeg'&&i.thumburl&&i.width>i.height*1.2});
      if(!ps.length)continue;
      const p=ps[Math.floor(Math.random()*ps.length)];
      const img=await loadImg(p.imageinfo[0].thumburl);
      setBg(img,cleanTitle(p.title));
      status('');return true;
    }catch(e){}
  }
  status(T('offline'));
  return false;
}

let seg=null;
function segment(canvas){
  return new Promise(async(res,rej)=>{
    try{
      if(!seg){seg=new SelfieSegmentation({locateFile:f=>CDN+f});seg.setOptions({modelSelection:1})}
      seg.onResults(r=>res(r.segmentationMask));
      await seg.send({image:canvas});
    }catch(e){rej(e)}
  });
}

function buildCut(src,mask){
  const w=src.width,h=src.height;
  const m=document.createElement('canvas');m.width=w;m.height=h;
  const mx=m.getContext('2d',{willReadFrequently:true});mx.drawImage(mask,0,0,w,h);
  const md=mx.getImageData(0,0,w,h).data;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);
  const id=x.getImageData(0,0,w,h),d=id.data;
  let useRed=true;for(let i=3;i<md.length;i+=388){if(md[i]<250){useRed=false;break}}
  let x0=w,y0=h,x1=0,y1=0;
  for(let p=0,i=0;p<w*h;p++,i+=4){
    let v=(useRed?md[i]:md[i+3])/255;v=Math.min(1,Math.max(0,(v-.42)/.3));
    d[i+3]=v*255;
    if(v>.5){const px=p%w,py=(p/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
  }
  if(x1<=x0||y1<=y0)return null;
  // selfie bust cut off by the photo edge: the mask is weak/semi-transparent there,
  // so copy solid alpha from just above and extend it down to the very bottom
  if(y1>h*.9){
    const r0=Math.max(0,Math.floor(y1-h*.03));
    for(let px=x0;px<=x1;px++){
      const a=d[(r0*w+px)*4+3];
      if(a>128){for(let py=r0;py<h;py++)d[(py*w+px)*4+3]=255;}
    }
    y1=h-1;
  }
  x.putImageData(id,0,0);
  const pad=4;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,1000/ch);
  const o=document.createElement('canvas');o.width=Math.round(cw*k);o.height=Math.round(ch*k);
  const ox=o.getContext('2d');ox.drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height);
  const touches=y1>h*.96,full=!touches||ch/cw>2.2;
  // selfie bust: no fade, the solid bottom edge sits flush with the bottom of the scene
  // average luminance of the person
  const sd=ox.getImageData(0,0,o.width,o.height).data;let s=0,n=0;
  for(let i=0;i<sd.length;i+=64){if(sd[i+3]>200){s+=.3*sd[i]+.59*sd[i+1]+.11*sd[i+2];n++}}
  return{c:o,full,lum:n?s/n:128};
}

async function handlePhoto(file){
  if(!file||busy)return;
  setBusy(true);
  try{
    status(T('reading'));
    const url=URL.createObjectURL(file);
    const img=await loadImg(url);
    const k=Math.min(1,1024/Math.max(img.width,img.height));
    const src=document.createElement('canvas');src.width=Math.round(img.width*k);src.height=Math.round(img.height*k);
    src.getContext('2d').drawImage(img,0,0,src.width,src.height);URL.revokeObjectURL(url);
    status(T('cutting'));
    const mask=await segment(src);
    const cut=buildCut(src,mask);
    if(!cut){status(T('noperson'));setBusy(false);return}
    person=cut;
    if(!bg)await loadLandscape();
    place();
    $('hint').style.display='none';
    await beam();
  }catch(e){console.error(e);status(T('err'))}
  setBusy(false);
}

function place(){
  st.s=person.full?.62:.5;st.x=.3+Math.random()*.4;st.y=person.full?.95:1.0;
  $('sz').value=Math.round(st.s*100);
}

function render(prog=1){
  if(!bg){cx.fillStyle='#0b0a24';cx.fillRect(0,0,W,H);return}
  const r=Math.max(W/bg.width,H/bg.height),bw=bg.width*r,bh=bg.height*r;
  cx.globalAlpha=1;cx.drawImage(bg,(W-bw)/2,(H-bh)/2,bw,bh);
  if(person){
    const ph=Math.round(H*st.s),pw=Math.round(ph*person.c.width/person.c.height),px=st.x*W-pw/2,py=st.y*H-ph;
    // match scene light: tint + brightness toward local background
    const t=document.createElement('canvas');t.width=pw;t.height=ph;const tx=t.getContext('2d');
    tx.drawImage(person.c,0,0,pw,ph);
    const sx=Math.min(31,Math.max(0,Math.round(st.x*32))),sy=Math.min(23,Math.max(0,Math.round((st.y-st.s/2)*24)));
    const bp=bgSm.getContext('2d').getImageData(sx,sy,1,1).data,bl=.3*bp[0]+.59*bp[1]+.11*bp[2];
    tx.globalCompositeOperation='source-atop';
    tx.fillStyle=`rgba(${bp[0]},${bp[1]},${bp[2]},.16)`;tx.fillRect(0,0,pw,ph);
    const diff=(bl-person.lum)/255*.5;
    tx.fillStyle=diff>0?`rgba(255,255,255,${Math.min(.25,diff)})`:`rgba(0,0,0,${Math.min(.3,-diff)})`;tx.fillRect(0,0,pw,ph);
    // materialize (scan reveal)
    cx.save();
    if(prog<1){
      cx.beginPath();cx.rect(0,py-10,W,ph*prog+10);cx.clip();
    }
    cx.drawImage(t,px,py);
    cx.restore();
    if(prog<1){
      const ly=py+ph*prog;
      cx.save();cx.shadowColor='#27f0ff';cx.shadowBlur=30;cx.fillStyle='#bffcff';cx.fillRect(px-40,ly-3,pw+80,6);
      cx.globalAlpha=.18*(1-prog);cx.fillStyle='#27f0ff';cx.fillRect(px-20,py,pw+40,ph);cx.restore();
    }
  }
  cx.textBaseline='top';cx.font='700 28px Outfit, sans-serif';cx.textAlign='right';cx.fillStyle='rgba(255,255,255,.85)';
  cx.shadowColor='#000';cx.shadowBlur=8;cx.fillText('✦ TelePort',W-36,H-52);cx.shadowBlur=0;cx.textAlign='left';
}

function beam(){
  return new Promise(res=>{
    const t0=performance.now(),D=1100;status(T('beam'));
    (function f(now){
      const p=Math.min(1,(now-t0)/D);render(1-Math.pow(1-p,2));
      if(p<1)requestAnimationFrame(f);else{status('');res()}
    })(t0);
  });
}

// drag to reposition
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!person)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,sx:st.x,sy:st.y};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const b=cv.getBoundingClientRect();
  st.x=Math.min(1,Math.max(0,drag.sx+(e.clientX-drag.x)/b.width));
  st.y=Math.min(1.15,Math.max(.25,drag.sy+(e.clientY-drag.y)/b.height));render();
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;cv.style.cursor='grab'}));
$('sz').addEventListener('input',e=>{st.s=e.target.value/100;render()});
$('loc').addEventListener('input',e=>{loc=e.target.value;render()});

$('fSelfie').addEventListener('change',e=>{handlePhoto(e.target.files[0]);e.target.value=''});
$('fUp').addEventListener('change',e=>{handlePhoto(e.target.files[0]);e.target.value=''});
$('bLang').addEventListener('click',()=>{lang=lang==='en'?'es':'en';applyLang()});
async function goSearch(){
  const q=$('q').value.trim();if(!q||busy)return;
  setBusy(true);
  if(await searchPlace(q)){if(person)await beam();else render()}
  setBusy(false);
}
$('bGo').addEventListener('click',goSearch);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')goSearch()});
$('bNew').addEventListener('click',async()=>{
  if(busy)return;setBusy(true);
  if(await loadLandscape()){$('q').value='';if(person)await beam();else render()}
  setBusy(false);
});

function download(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='teleport.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('bSave').addEventListener('click',()=>cv.toBlob(download,'image/jpeg',.92));
$('bWa').addEventListener('click',()=>{
  const txt=`📍 ${loc||T('fallback')}\n${T('send')} ${LINK}`;
  if(isDesk){
    // desktop: copy the photo to the clipboard and open WhatsApp Web straight away
    const png=new Promise(r=>cv.toBlob(r,'image/png'));
    let copied=false;
    try{
      if(navigator.clipboard&&window.ClipboardItem){
        navigator.clipboard.write([new ClipboardItem({'image/png':png})]).then(()=>status(T('copied'))).catch(async()=>{download(await png);status(T('saved'))});
        copied=true;
      }
    }catch(e){}
    if(!copied)png.then(b=>{download(b);status(T('saved'))});
    window.open('https://web.whatsapp.com/send?text='+encodeURIComponent(txt),'_blank');
    return;
  }
  cv.toBlob(async b=>{
    const f=new File([b],'teleport.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],text:txt});return}catch(e){if(e.name==='AbortError')return}
    }
    download(b);status(T('saved'));
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  },'image/jpeg',.92);
});

(async()=>{
  try{await document.fonts.load('700 28px Outfit')}catch(e){}
  applyLang();
  render();setBusy(true);
  if(await loadLandscape())render();
  setBusy(false);
})();
</script>
</body>
</html>
