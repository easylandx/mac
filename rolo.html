<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoloPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0b823;--ink:#2b2418;--m:clamp(8px,2.5vw,18px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Courier Prime',monospace;color:var(--ink);background:radial-gradient(circle at 50% 0,#fffdf3,#fbf0cf 55%,#f5e1a2);padding:max(22px,env(safe-area-inset-top)) clamp(16px,5vw,48px) 48px}
.wrap{max-width:720px;margin:0 auto}
h1{font:400 clamp(28px,6vw,40px) 'Special Elite',serif;text-align:left}
h1 span{color:#c8921a}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1 a{color:inherit;text-decoration:none}.logo{display:block;flex:none;line-height:0}.logo img{width:clamp(34px,9vw,44px);height:auto;border-radius:22%;display:block;box-shadow:0 2px 0 rgba(110,80,10,.25)}.logo:focus-visible,.brand h1 a:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.sub{text-align:left;font-size:13px;opacity:.7;margin:2px 0 16px}
.search{display:flex;align-items:center;gap:10px;background:#fffaf0;border:2px solid #e3c36a;border-radius:999px;padding:2px 16px;margin-bottom:38px;box-shadow:0 3px 0 #e3c36a}
.search input{flex:1;min-width:0;border:0;background:none;font:16px 'Courier Prime',monospace;padding:10px 0;outline:0;color:var(--ink)}
#count{font-size:13px;white-space:nowrap;opacity:.7}
.device{display:grid;grid-template-columns:auto 1fr auto;column-gap:clamp(6px,2vw,14px);background:linear-gradient(#2b2b2e,#19191b);padding-top:12px;border-radius:22px 22px 14px 14px;box-shadow:0 18px 30px rgba(110,80,10,.3),inset 0 1px 0 #55555a}
.rail{display:flex;flex-direction:column;gap:3px;background:#0e0e0f;padding:6px;border-radius:10px;width:clamp(32px,9vw,42px);height:340px}
.rail.lf{margin-left:var(--m)}.rail.rg{margin-right:var(--m)}
.key{flex:1;min-height:0;border:0;border-radius:3px;background:#262628;color:#fff;font:700 clamp(11px,3vw,14px) Arial,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 #444}
.key.off{color:#68686d}.key.on{background:var(--gold);color:#1d1d1f}.key:active{transform:translateY(1px)}
.key:focus-visible,.b:focus-visible,.nav:focus-visible,.ping:focus-visible,.pull:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative}
.itab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);min-width:120px;text-align:center;background:var(--gold);color:#1d1d1f;font:700 15px Arial,sans-serif;padding:5px 18px 4px;border-radius:10px 10px 0 0;z-index:1}
.stack{position:relative;height:340px;perspective:900px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.card{position:absolute;inset:0 0 36px 0;z-index:2;background:#fbf0c4;border-radius:6px 6px 3px 3px;padding:14px 16px 40px;transform-origin:top;box-shadow:0 2px 0 #d9bd5a,0 -3px 0 #ecd98c;background-image:linear-gradient(transparent 25px,#e6b72f 25px);background-size:100% 26px;background-origin:content-box;overflow:hidden;font-size:clamp(13px,3.6vw,16px);line-height:26px}
.edge{position:absolute;left:0;right:0;bottom:0;height:42px;background:repeating-linear-gradient(#f6e9ab 0 3px,#d8b94c 3px 4px);border-radius:0 0 4px 4px}
.pull{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:84px;height:28px;border:0;border-radius:8px;background:linear-gradient(#383838,#111);box-shadow:0 3px 0 #000,inset 0 1px 0 #555;cursor:pointer;z-index:3}
.pull:active{transform:translateX(-50%) translateY(2px)}
.nm{font:400 clamp(20px,5.5vw,25px)/26px 'Special Elite',serif;color:#1d5fd1;white-space:normal;overflow-wrap:anywhere}
.r{height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r i{font-style:normal;opacity:.55;margin-right:8px;font-size:.8em}
.nt{max-height:78px;overflow:hidden;white-space:pre-wrap}
.base{grid-column:1/-1;margin-top:14px;background:linear-gradient(#141415,#0b0b0c);border-radius:0 0 14px 14px;padding:14px 12px 16px;display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,12px)}
.nav{width:clamp(40px,11vw,50px);height:clamp(40px,11vw,50px);flex:none;border-radius:12px;border:0;background:linear-gradient(#4a4a4e,#2c2c2f);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #000}
.ping{flex:0 1 300px;min-height:52px;border:0;border-radius:14px;background:linear-gradient(#3fc97a,#1f9a52);color:#fff;font:700 clamp(12px,3.4vw,15px) 'Courier Prime',monospace;letter-spacing:.05em;cursor:pointer;box-shadow:0 5px 0 #0f5f31,inset 0 2px 0 #8ef0b3}
.nav{padding:0;-webkit-appearance:none;appearance:none}.call,.mail{display:grid;place-items:center;flex:none}.nav svg{display:block;width:24px;height:24px;min-width:24px;pointer-events:none}.nav svg path{fill:#fff}.call{background:linear-gradient(#3fa9f5,#1f78c8);box-shadow:0 4px 0 #0e4a80}.mail{background:linear-gradient(#f5a43f,#d9771a);box-shadow:0 4px 0 #8a4a0c}.nav,.pull{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.nav:active{transform:translateY(4px);box-shadow:0 0 0 #000}
.ping:active{transform:translateY(4px);box-shadow:0 1px 0 #0f5f31,inset 0 2px 0 #8ef0b3}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.b{font:700 14px 'Courier Prime',monospace;padding:10px 16px;border-radius:12px;border:2px solid #d9b247;background:#fff7dc;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #d9b247}
.b.p,.b[aria-pressed=true]{background:var(--gold)}.b:active{transform:translateY(3px);box-shadow:none}
.dz{display:block;margin-top:20px;border:2px dashed #d9b247;border-radius:14px;padding:18px;text-align:center;background:rgba(255,250,235,.75);cursor:pointer;font-size:14px}
.dz.hot{background:#fde9a3}.dz input{display:none}
.cc{margin-top:14px;text-align:center;font-size:13px}.cc input{width:70px;font:16px 'Courier Prime',monospace;padding:5px 8px;border:2px solid #e3c36a;border-radius:8px;background:#fff;margin-left:6px;color:var(--ink)}
dialog{margin:auto;border:3px solid #e3b94a;border-radius:16px;background:#fffaf0;color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px));font-family:'Courier Prime',monospace}
dialog::backdrop{background:rgba(150,110,20,.35);backdrop-filter:blur(2px)}
dialog h2{font:400 22px 'Special Elite',serif;margin-bottom:10px}
label.f{display:block;font-size:12px;letter-spacing:.04em;margin:9px 0 3px}
.t{width:100%;font:16px 'Courier Prime',monospace;padding:9px 10px;border:2px solid #e3c36a;border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips .b{font-size:12px;padding:6px 10px;box-shadow:0 2px 0 #d9b247}
#dk .hint{margin:4px 0}.bkl{display:grid;gap:10px;margin-top:12px}.bkl .b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}.bkl small{font:400 12px 'Courier Prime',monospace;opacity:.75}
#dh{width:min(520px,calc(100vw - 32px));max-height:86vh;overflow:auto}#dh h3{font:700 14px 'Courier Prime',monospace;margin:14px 0 4px}#dh ol{padding-left:20px;font-size:13px;line-height:1.5}#dh li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff7c9;border:2px solid #d9b247;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);font-size:14px}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hint{font-size:12px;opacity:.7;margin-top:8px;line-height:1.4}
.lang{display:flex;flex:none}
.lang .seg{display:inline-flex;gap:2px;background:#fffaf0;border:2px solid #e3c36a;border-radius:999px;padding:3px;box-shadow:0 3px 0 #e3c36a}
.lang button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:5px 10px;border-radius:999px;font:700 13px 'Courier Prime',monospace;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold)}
.lang svg{width:22px;height:15px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.card{overflow:hidden auto;scrollbar-width:thin;scrollbar-color:#d9b247 transparent;background-attachment:local,scroll}
.nt{max-height:none}
.r.x{height:auto;white-space:normal;overflow:visible;overflow-wrap:anywhere;text-overflow:clip}
</style>
</head>

/* ---------- Soft bamboo sound (synthesized) ---------- */
let AC,MG,NB,sound=st.get('rc.snd','1')==='1',lastS=0;
const ctx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
const NOTES=[196,220,247,294,330];
function bamboo(vol=1){
  if(!sound)return;const now=performance.now();if(now-lastS<30)return;lastS=now;
  try{
    const a=ctx(),t=a.currentTime+.005;
    if(!MG){MG=a.createGain();MG.gain.value=.8;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2000;MG.connect(lp).connect(a.destination);
      NB=a.createBuffer(1,Math.floor(a.sampleRate*.015),a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
    const f=NOTES[Math.floor(Math.random()*NOTES.length)];
    const part=(fr,g0,dur,glide)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(fr*glide,t);o.frequency.exponentialRampToValueAtTime(fr,t+.04);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(g0*vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MG);o.start(t);o.stop(t+dur+.02)};
    part(f,.11,.28,1.012);part(f*2.76,.022,.09,1);
    const n=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();n.buffer=NB;bp.type='bandpass';bp.frequency.value=900;bp.Q.value=1.2;ng.gain.value=.05*vol;n.connect(bp).connect(ng).connect(MG);n.start(t)
  }catch(e){}
}
const sndLabel=()=>{$('snd').textContent=t(sound?'sndOn':'sndOff');$('snd').setAttribute('aria-pressed',sound?'true':'false')};
$('snd').onclick=()=>{sound=!sound;st.set('rc.snd',sound?'1':'0');sndLabel();bamboo()};

/* ---------- Rolodex state & rendering ---------- */
let V=[],idx=0,busy=false;
function build(keep){const s=norm($('q').value);V=all.filter(c=>!s||norm([c.name,c.company,c.title,c.email,c.addr,c.phone,c.wa,c.notes,c.cat,...(c.extra||[]).map(x=>x[1])].join(' ')).includes(s)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));const i=V.findIndex(c=>c.id===keep);idx=i>=0?i:0}
[...A].forEach((ch,i)=>{const b=document.createElement('button');b.className='key';b.textContent=ch;b.dataset.l=ch;b.setAttribute('aria-label','Jump to '+ch);b.onclick=()=>jump(ch);(i<13?$('rl'):$('rr')).append(b)});
function paint(){
  const c=V[idx];
  $('count').textContent=V.length?`${idx+1} / ${V.length}`+($('q').value?` ${t('of')} ${all.length}`:''):t('zero');
  const l=c?L(c):'';const i=A.indexOf(l);
  $('itab').textContent=!c?'—':i<0?'#':A[i-i%2]+'–'+A[i-i%2+1];
  const has=new Set(V.map(L));
  document.querySelectorAll('.key').forEach(k=>{k.classList.toggle('off',!has.has(k.dataset.l));k.classList.toggle('on',k.dataset.l===l)});
  $('card').scrollTop=0;$('card').innerHTML=c?`<div class="nm">${esc(c.name)}</div><div class="r">${esc([c.company!==c.name?c.company:'',c.title].filter(Boolean).join(' · '))}</div><div class="r x"><i>${t('email')}</i>${esc(c.email)||'—'}</div><div class="r"><i>${t('tel')}</i>${esc(c.phone)||'—'}</div><div class="r"><i>WhatsApp</i>${esc(c.wa||c.phone)||'—'}</div>${c.addr?`<div class="r x"><i>${t('addr')}</i>${esc(c.addr)}</div>`:''}<div class="r"></div><div class="nt">${esc(c.notes)}</div>${(c.extra||[]).map(x=>`<div class="r x"><i>${esc(x[0])}</i>${esc(x[1])}</div>`).join('')}`:`<div class="nm">${t('noCards')}</div><div class="r">${t('noCardsHint')}</div>`;
  {const el=$('card');$('stack').style.touchAction=el.scrollHeight>el.clientHeight+2?'pan-y':'none'}
}
async function go(i,dir=1){
  if(busy||!V.length)return;const n=V.length;i=(i+n)%n;
  if(i===idx){return}
  busy=true;bamboo();const el=$('card');
  await el.animate([{transform:'rotateX(0)',opacity:1},{transform:`rotateX(${-80*dir}deg)`,opacity:.2}],{duration:150,easing:'ease-in',fill:'forwards'}).finished;
  idx=i;paint();
  await el.animate([{transform:`rotateX(${80*dir}deg)`,opacity:.2},{transform:'rotateX(0)',opacity:1}],{duration:170,easing:'ease-out'}).finished;
  el.getAnimations().forEach(a=>a.cancel());busy=false;
}
function jump(l){if(!V.length)return;let i=V.findIndex(c=>{const x=L(c);return x!=='#'&&x>=l});if(i<0)i=V.length-1;if(i!==idx){go(i,i>idx?1:-1)}else if(!V.some(c=>L(c)===l))toast(t('noUnder',l))}
let toastT;function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('s'),ms)}

/* ---------- Navigation inputs ---------- */
function hold(btn,dir){let d,r;const stop=()=>{clearTimeout(d);clearInterval(r)};
  btn.addEventListener('pointerdown',e=>{if(e.button)return;stop();go(idx+dir,dir);d=setTimeout(()=>{r=setInterval(()=>go(idx+dir,dir),120)},400)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('click',e=>{if(e.detail===0)go(idx+dir,dir)});
  btn.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('next'),1);hold($('pull'),1);hold($('prev'),-1);
let wt=0;$('stack').addEventListener('wheel',e=>{const el=$('card');if(el.scrollHeight>el.clientHeight+2){const dn=e.deltaY>0;if(dn?el.scrollTop+el.clientHeight<el.scrollHeight-1:el.scrollTop>0)return}e.preventDefault();if(Date.now()-wt<250)return;wt=Date.now();go(idx+(e.deltaY>0?1:-1),e.deltaY>0?1:-1)},{passive:false});
async function fling(dir,n){const len=V.length;if(busy||len<2)return;if(n<=1)return go(idx+dir,dir);
  busy=true;for(let k=0;k<n-1;k++){idx=((idx+dir)%len+len)%len;paint();bamboo(.6);await new Promise(r=>setTimeout(r,40))}busy=false;go(idx+dir,dir)}
(()=>{const st_=$('stack');let pts=null,pid=null;
  st_.addEventListener('pointerdown',e=>{if(e.button||e.target.closest('.pull'))return;pid=e.pointerId;pts=[{t:performance.now(),x:e.clientX,y:e.clientY}];try{st_.setPointerCapture(pid)}catch(_){}});
  st_.addEventListener('pointermove',e=>{if(!pts||e.pointerId!==pid)return;pts.push({t:performance.now(),x:e.clientX,y:e.clientY});if(pts.length>40)pts.shift()});
  const end=e=>{if(!pts||e.pointerId!==pid)return;const P=pts;pts=null;if(e.type==='pointercancel')return;
    const now=performance.now(),f=P[0],l=P[P.length-1],dx=l.x-f.x,dy=l.y-f.y,vert=Math.abs(dy)>=Math.abs(dx),d=vert?dy:dx;
    const r=P.find(q=>q.t>=now-120)||l,dt=Math.max(l.t-r.t,16),dr=vert?l.y-r.y:l.x-r.x,v=Math.abs(dr)/dt;
    if(Math.abs(d)<(v>=.3?24:40))return;
    const dir=d<0?1:-1,n=Math.min(30,Math.max(1,Math.round(v*3.5)));fling(dir,n)};
  st_.addEventListener('pointerup',end);st_.addEventListener('pointercancel',end)})();
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.querySelector('dialog[open]'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(idx+1,1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(idx-1,-1)});
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{build();paint();},120)};

  let c=all.find(a=>a.id===eid);if(c)Object.assign(c,d);else{c={id:uid(),...d};all.push(c)}

/* ---------- vCard import & Contact Picker ---------- */
function splitSC(s){const o=[];let f='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='\\'&&i+1<s.length){f+=ch+s[++i]}else if(ch===';'){o.push(f);f=''}else f+=ch}o.push(f);return o}
const unesc=s=>s.replace(/\\n/gi,' ').replace(/\\,/g,',').replace(/\;/g,';').replace(/\\"/g,'"');
function parseVCF(txt){
  txt=txt.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'');const out=[];
  txt.split(/BEGIN:VCARD/i).slice(1).forEach(b=>{
    const c={name:'',company:'',title:'',phone:'',email:'',addr:'',wa:'',notes:'',cat:'Other'};let n='';const em=[];
    b.split('\n').forEach(l=>{const i=l.indexOf(':');if(i<0)return;
      const k=l.slice(0,i).toUpperCase().split(';')[0].replace(/^ITEM\d+\./,''),raw=l.slice(i+1).trim(),v=unesc(raw).trim();
      if(k==='FN')c.name=v;else if(k==='N'&&!n)n=v.split(';').slice(0,2).reverse().join(' ').trim();
      else if(k==='TEL'&&!c.phone)c.phone=v;
      else if(k==='EMAIL'){if(v&&!em.some(x=>x.toLowerCase()===v.toLowerCase()))em.push(v)}
      else if(k==='ORG')c.company=splitSC(raw).map(x=>unesc(x).trim()).filter(Boolean).join(' / ');
      else if(k==='TITLE')c.title=v;
      else if(k==='ADR'&&!c.addr)c.addr=splitSC(raw).slice(0,7).map(x=>unesc(x).replace(/"/g,'').trim()).filter(Boolean).join(', ').replace(/\s*\/\s*,/g,',').replace(/\s*\/\s*$/,'');
      else if(k==='NOTE')c.notes=v});
    c.email=em.join(', ');
    c.name=c.name||n||c.company||em[0]||c.phone;if(c.name)out.push(c)});
  return out}

const PROMO='RoloPro easylandx.github.io/rolopro';
let shareBlob=null,shareFile=null,shareP=null;
function prepShare(){
  if(shareP)return shareP;
  shareP=fetch(SHARE_IMG).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bm=>{
    const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
    return new Promise((ok,ko)=>c.toBlob(x=>x?ok(x):ko(),'image/png'));
  }).then(png=>{shareBlob=png;try{shareFile=new File([png],'rolopro.png',{type:'image/png'})}catch(e){}return png});
  shareP.catch(()=>{});return shareP;
}
setTimeout(prepShare,600);
function sendWA(n,text){
  const msg=(text.trim()?text.trim()+'\n':'')+PROMO;
  if(isMobile){
    const canFile=shareFile&&navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]});
    if(canFile){navigator.share({files:[shareFile],text:msg}).catch(e=>{if(e&&e.name==='AbortError')return;openWA(n,msg)});return}
    prepShare();openWA(n,msg);return;
  }
  let wrote=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
      const pr=shareBlob?Promise.resolve(shareBlob):prepShare();
      navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(()=>toast(t('copied'),6000)).catch(()=>toast(t('copyFail'),6000));
      wrote=true;
    }
  }catch(e){}
  if(!wrote)toast(t('noCopy'),6000);
  openWA(n,msg);
}
$('ps').onclick=()=>{const c=V[idx];$('dp').close();sendWA(waNum(c.wa||c.phone),$('pm').value)};

let autoT=null;
function autoLabel(){$('auto').textContent=t(autoT?'autoOff':'autoOn');$('auto').setAttribute('aria-pressed',autoT?'true':'false')}
$('auto').onclick=()=>{if(autoT){clearInterval(autoT);autoT=null}else{if(!V.length)return toast(t('addFirst'));autoT=setInterval(()=>{if(document.querySelector('dialog[open]')||V.length<2)return;go(idx+1,1)},1800)}autoLabel()};

const dl=(name,mime,text)=>{const u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)};
const today=()=>new Date().toISOString().slice(0,10);
const vEsc=x=>String(x??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
const allNotes=c=>[c.notes,...(c.extra||[]).map(x=>(x[0]?x[0]+': ':'')+x[1])].filter(Boolean).join('\n');
function vcard(c,fix){const num=n=>{if(!fix)return n;const d=waNum(n);return d&&(/^\s*(\+|00)/.test(n)||st.get('rc.cc',''))?'+'+d:n};
  const L=['BEGIN:VCARD','VERSION:3.0','FN:'+vEsc(c.name),'N:;'+vEsc(c.name)+';;;'];
  if(c.company)L.push('ORG:'+vEsc(c.company));if(c.title)L.push('TITLE:'+vEsc(c.title));
  if(c.phone)L.push('TEL;TYPE=CELL:'+num(c.phone));if(c.wa&&c.wa!==c.phone)L.push('TEL;TYPE=CELL:'+num(c.wa));
  (c.email||'').split(/[,;\s]+/).filter(e=>e.includes('@')).forEach(e=>L.push('EMAIL;TYPE=INTERNET:'+e));
  if(c.addr)L.push('ADR;TYPE=HOME:;;'+vEsc(c.addr)+';;;;');
  const n=allNotes(c);if(n)L.push('NOTE:'+vEsc(n));
  L.push('CATEGORIES:'+vEsc(c.cat||'Other'),'END:VCARD');return L.join('\r\n')}
function toVCF(){return all.map(c=>vcard(c)).join('\r\n')+'\r\n'}
$('addc').onclick=()=>{const c=V[idx];if(!c)return toast(t('addFirst'));
  const f=(norm(c.name).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'contact')+'.vcf';
  dl(f,'text/vcard;charset=utf-8',vcard(c,true)+'\r\n');toast(t('addcDone'),6000)};
function toCSV(){const d=lang==='es'?';':',',cell=v=>{v=String(v??'');return v.includes(d)||/["\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Name','Company','Title','Phone','WhatsApp','Email','Address','Category','Notes'],...all.map(c=>[c.name,c.company,c.title,c.phone,c.wa,c.email,c.addr,c.cat,allNotes(c)])];
  return '\uFEFF'+rows.map(r=>r.map(cell).join(d)).join('\r\n')}
$('bk').onclick=()=>{$('bkc').textContent=t('bkCount',all.length);$('dk').showModal()};
$('bkX').onclick=()=>$('dk').close();
$('bkJ').onclick=()=>{if(!all.length)return toast(t('noneToSave'));dl('rolopro-backup-'+today()+'.json','application/json',JSON.stringify({app:'RoloPro',version:1,date:new Date().toISOString(),cards:all},null,1));toast(t('saved'))};
$('bkV').onclick=()=>{if(!all.length)return toast(t('noneToSave'));dl('rolopro-contacts-'+today()+'.vcf','text/vcard;charset=utf-8',toVCF());toast(t('saved'))};
$('bkC').onclick=()=>{if(!all.length)return toast(t('noneToSave'));dl('rolopro-contacts-'+today()+'.csv','text/csv;charset=utf-8',toCSV());toast(t('saved'))};
function buildHelp(){$('hb').innerHTML=t('helpData').map(([h,l])=>`<h3>${esc(h)}</h3><ol>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`).join('')}
$('help').onclick=()=>{bamboo();$('dh').showModal()};$('hx').onclick=()=>$('dh').close();

build();applyLang();
</script>
</body>
</html>
