<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CollagePro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffc2dc; --ink:#2a1020; --muted:#7a4560; --card:#fff3f8; --line:#f0a3c4; --accent:#c2185b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding-block:clamp(28px,5vw,56px);
  padding-inline:clamp(20px,5vw,48px);
}
.wrap{max-width:820px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.top h1{min-width:0}
.tools{display:flex;gap:8px;align-items:center;flex:none}
h1{font-size:clamp(32px,6vw,52px);margin:0;letter-spacing:-.03em;font-weight:700;line-height:1.05}
h1 span{color:var(--accent);font-style:italic}
.sub{color:var(--muted);margin:0 0 24px;font-size:17px}
button{
  font:inherit;font-weight:600;cursor:pointer;border-radius:10px;
  padding-block:13px;padding-inline:22px;
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);
}
button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:transparent;color:var(--ink)}
.brand,#lang{font-size:15px;padding-block:9px;padding-inline:16px;white-space:nowrap}
.brand{
  font:inherit;font-weight:bold;font-size:15px;text-decoration:none;border-radius:10px;
  padding-block:9px;padding-inline:18px;border:1px solid #d62828;background:#d62828;color:#fff;
}
.brand:hover{opacity:.88}
@media (max-width:520px){
  .tools{gap:6px}
  .brand,#lang{font-size:13px;padding-block:8px;padding-inline:11px}
}
#go{width:100%;font-size:20px;background:var(--accent);border-color:var(--accent);color:#fff;padding-block:16px}
button.wa{background:#1fa855;border-color:#1fa855;color:#fff;width:100%;font-size:18px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3vw,24px);margin-top:18px}
canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.msg{color:var(--muted);margin:0 0 12px;min-height:1.4em;font-size:15px}
.msg.err{color:var(--accent)}
.actions{margin-top:16px}
.hint{color:var(--muted);font-size:14px;font-style:italic;margin:10px 0 0}
details{margin-top:18px;color:var(--muted);font-size:14px}
details summary{cursor:pointer}
details ol{padding-inline-start:22px;margin:10px 0 0;line-height:1.6}
details a{color:var(--accent)}
.cats-title{margin:0 0 10px;color:var(--muted);font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.chip{
  text-align:start;font-weight:normal;padding-block:11px;padding-inline:14px;border-radius:12px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);line-height:1.3;
}
.chip b{display:block;font-size:16px}
.chip small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.chip.mix{border-style:dashed}
.custom{margin:0 0 18px}
.custom label{display:block;color:var(--muted);font-size:15px;margin-bottom:8px}
.custom input{
  font:inherit;width:100%;padding-block:13px;padding-inline:16px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;
}
.custom input::placeholder{color:var(--muted);opacity:.75}
.custom input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
footer{color:var(--muted);font-size:13px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Collage<span>Pro</span></h1>
    <div class="tools">
      <a class="brand" href="https://easylandx.github.io" target="_blank" rel="noopener">easylandx</a>
      <button id="lang" class="alt" type="button" aria-label="Cambiar a español">ESPAÑOL</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <p class="cats-title" data-i18n="catsTitle"></p>
  <div class="cats" id="cats" role="group"></div>

  <div class="custom">
    <label for="custom" data-i18n="customLabel"></label>
    <input id="custom" type="text" maxlength="60" autocomplete="off" enterkeyhint="go">
  </div>

  <button id="go" type="button" data-i18n="go"></button>

  <div class="stage">
    <p class="msg" id="msg"></p>
    <canvas id="cv" width="1500" height="1500"></canvas>
    <div class="actions">
      <button class="wa" id="wa" type="button" disabled data-i18n="wa"></button>
      <p class="hint" id="hint" data-i18n="hint"></p>
    </div>
    <details id="credits" hidden>
      <summary data-i18n="credits"></summary>
      <ol id="creditList"></ol>
    </details>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<script>
(function(){
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var $ = function(id){ return document.getElementById(id); };
  var LINK = 'https://easylandx.github.io/mac/collagepro.html';
  var state = { sel:null, cat:null, custom:'', tit:null, lastKey:'', items:[], busy:false, say:null, done:false };

  // ---- Language ----
  var LANG = 'en';
  var I18N = {
    en: {
      sub:'Eleven random cutouts from Wikimedia Commons, stuck into one collage.',
      catsTitle:'Pick a theme, or leave it empty and one is chosen at random.',
      customLabel:'Or type your own theme (optional). Use object words; commas separate several.',
      customPh:'e.g. kitchen, vintage toys, ocean shells',
      go:'Generate', wa:'Send on WhatsApp',
      hint:'On desktop the collage is copied: press Ctrl+V in the chat to paste it.',
      credits:'Image credits', footer:'Photos from Wikimedia Commons, credited above.',
      canvasIdle:'Press Generate', idle:'Press Generate to make a collage.',
      picking:function(){ return 'Theme: '+catName(state.cat)+'. Picking images from Wikimedia Commons…'; },
      cutting:function(n){ return 'Cutting out images… '+n+'/11'; },
      done:function(){ return 'Done. Theme: '+catName(state.cat)+'. Your title: “'+titleText()+'”'; },
      errFew:'Could not cut out enough images this time. Press Generate again.',
      errNone:'No images found. Press Generate again.',
      errNet:function(m){ return 'Could not reach Wikimedia Commons ('+m+'). Open the file in a normal browser tab and try again.'; },
      prep:'Preparing your collage…',
      shareChoose:'Pick WhatsApp, then a contact. The collage and message are attached.',
      waMobileSaved:'Collage saved to your device. In WhatsApp, attach it with the paperclip.',
      cancelled:'Sharing cancelled.',
      waFail:'Could not prepare the collage for WhatsApp.',
      waCopied:'Collage copied. In WhatsApp Web press Ctrl+V in the chat to paste it.',
      waSaved:'Collage downloaded. In WhatsApp Web, attach it with the paperclip.',
      made:'Made with CollagePro',
      btn:'ESPAÑOL', btnLabel:'Cambiar a español'
    },
    es: {
      sub:'Once recortes al azar de Wikimedia Commons, pegados en un solo collage.',
      catsTitle:'Elige un tema, o déjalo vacío y se elige uno al azar.',
      customLabel:'O escribe tu propio tema (opcional). Usa palabras de objetos; separa varios con comas.',
      customPh:'ej. cocina, juguetes antiguos, conchas de mar',
      go:'Generar', wa:'Enviar por WhatsApp',
      hint:'En ordenador el collage se copia: pulsa Ctrl+V en el chat para pegarlo.',
      credits:'Créditos de las imágenes', footer:'Fotos de Wikimedia Commons, con crédito arriba.',
      canvasIdle:'Pulsa Generar', idle:'Pulsa Generar para crear un collage.',
      picking:function(){ return 'Tema: '+catName(state.cat)+'. Eligiendo imágenes de Wikimedia Commons…'; },
      cutting:function(n){ return 'Recortando imágenes… '+n+'/11'; },
      done:function(){ return 'Listo. Tema: '+catName(state.cat)+'. Tu título: «'+titleText()+'»'; },
      errFew:'Esta vez no se pudieron recortar suficientes imágenes. Pulsa Generar de nuevo.',
      errNone:'No se encontraron imágenes. Pulsa Generar de nuevo.',
      errNet:function(m){ return 'No se pudo conectar con Wikimedia Commons ('+m+'). Abre el archivo en una pestaña normal del navegador e inténtalo de nuevo.'; },
      prep:'Preparando tu collage…',
      shareChoose:'Elige WhatsApp y luego un contacto. El collage y el mensaje ya van adjuntos.',
      waMobileSaved:'Collage guardado en tu dispositivo. En WhatsApp, adjúntalo con el clip.',
      cancelled:'Envío cancelado.',
      waFail:'No se pudo preparar el collage para WhatsApp.',
      waCopied:'Collage copiado. En WhatsApp Web pulsa Ctrl+V en el chat para pegarlo.',
      waSaved:'Collage descargado. En WhatsApp Web, adjúntalo con el clip.',
      made:'Hecho con CollagePro',
      btn:'ENGLISH', btnLabel:'Switch to English'
    }
  };
  function t(k){ return I18N[LANG][k]; }

  function renderSay(){
    var m = $('msg'), s = state.say;
    if(!s){ m.textContent = ''; m.className = 'msg'; return; }
    var v = t(s.k);
    m.textContent = typeof v === 'function' ? v(s.a) : v;
    m.className = 'msg' + (s.err ? ' err' : '');
  }
  function say(k, a, err){ state.say = { k:k, a:a, err:!!err }; renderSay(); }

  // ---- Random titles (stored as indices so they can be shown in either language) ----
  var ADJ_EN = ['Velvet','Golden','Curious','Forgotten','Lucky','Sleepy','Quiet','Peculiar','Mellow','Cheerful','Dusty','Wandering','Cosmic','Silver','Tangled','Electric'];
  var ADJ_ES = [['Aterciopelados','Aterciopeladas'],['Dorados','Doradas'],['Curiosos','Curiosas'],['Olvidados','Olvidadas'],['Afortunados','Afortunadas'],['Soñolientos','Soñolientas'],['Silenciosos','Silenciosas'],['Peculiares','Peculiares'],['Apacibles','Apacibles'],['Alegres','Alegres'],['Polvorientos','Polvorientas'],['Errantes','Errantes'],['Cósmicos','Cósmicas'],['Plateados','Plateadas'],['Enredados','Enredadas'],['Eléctricos','Eléctricas']];
  var NOUN_EN = ['Mornings','Treasures','Whispers','Adventures','Daydreams','Collections','Secrets','Parades','Rumours','Inventions','Memories','Stories'];
  var NOUN_ES = [['Mañanas','f'],['Tesoros','m'],['Susurros','m'],['Aventuras','f'],['Ensueños','m'],['Colecciones','f'],['Secretos','m'],['Desfiles','m'],['Rumores','m'],['Inventos','m'],['Recuerdos','m'],['Historias','f']];
  var TPL_EN = [
    function(a,n){ return 'Museum of '+a+' '+n; },
    function(a,n){ return 'Cabinet of '+a+' '+n; },
    function(a,n){ return 'Notes on '+a+' '+n; },
    function(a,n){ return 'A Heap of '+a+' '+n; },
    function(a,n){ return 'The '+a+' '+n; }
  ];
  var TPL_ES = [
    function(a,n){ return 'Museo de '+n+' '+a; },
    function(a,n){ return 'Gabinete de '+n+' '+a; },
    function(a,n){ return 'Notas sobre '+n+' '+a; },
    function(a,n){ return 'Un montón de '+n+' '+a; },
    function(a,n,g){ return (g === 'f' ? 'Las ' : 'Los ')+n+' '+a; }
  ];
  function rnd(n){ return Math.floor(Math.random()*n); }
  function pick(a){ return a[rnd(a.length)]; }
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=rnd(i+1), x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
  function newTitle(){
    var o, key;
    do { o = { tpl:rnd(TPL_EN.length), a:rnd(ADJ_EN.length), n:rnd(NOUN_EN.length) }; key = o.tpl+'-'+o.a+'-'+o.n; } while(key === state.lastKey);
    state.lastKey = key;
    return o;
  }
  function titleText(){
    var o = state.tit; if(!o) return '';
    if(LANG === 'es'){
      var nn = NOUN_ES[o.n], g = nn[1];
      return TPL_ES[o.tpl](ADJ_ES[o.a][g === 'f' ? 1 : 0], nn[0], g);
    }
    return TPL_EN[o.tpl](ADJ_EN[o.a], NOUN_EN[o.n]);
  }

  // ---- Wikimedia Commons ----
  // Only themes whose subjects can be cut out as isolated objects are offered.
  // Dropped: People, Society & Politics (no clean standalone objects; landscapes, weather and events don't cut out either).
  var CATS = [
    { id:'arts', en:['Arts & Culture','Sculptures, masks, instruments, film and design objects'], es:['Arte y cultura','Esculturas, máscaras, instrumentos, cine y objetos de diseño'],
      s:['sculpture','statue','bust sculpture','mask','theatre mask','guitar','violin','trumpet','cello','saxophone','drum','flute','harp','accordion','ballet shoes','paint palette','paintbrush','easel','film camera','film reel','clapperboard','vase','ceramic bowl','lantern','chess piece','marionette'] },
    { id:'science', en:['Science & Mathematics','Lab tools, instruments, minerals and geometric models'], es:['Ciencia y matemáticas','Material de laboratorio, instrumentos, minerales y modelos geométricos'],
      s:['microscope','telescope','compass','globe','beaker','laboratory flask','test tube','prism','magnet','atom model','crystal','geode','mineral specimen','abacus','calculator','slide rule','geometric solid','dodecahedron model','planet model','armillary sphere','thermometer','hourglass','light bulb','circuit board'] },
    { id:'nature', en:['Nature & Environment','Animals, plants, fossils, shells and minerals'], es:['Naturaleza y medio ambiente','Animales, plantas, fósiles, conchas y minerales'],
      s:['apple','banana','pear','strawberry','lemon','tomato','pineapple','pumpkin','mushroom','butterfly','beetle','seashell','feather','cactus','rose','sunflower','tulip','owl','parrot','turtle','fish','frog','cat','dog','rabbit','horse','fossil','ammonite fossil','trilobite fossil','shark tooth','pinecone','leaf','starfish','crab','snail','dragonfly','acorn'] },
    { id:'history', en:['History','Historical artifacts: amphorae, helmets, coins, tools'], es:['Historia','Objetos históricos: ánforas, cascos, monedas, herramientas'],
      s:['amphora','ancient vase','roman coin','medieval helmet','sword','shield','suit of armor','ancient pottery','quill pen','spearhead','arrowhead','ancient oil lamp','astrolabe','sextant','crown','medieval key','old telephone','old camera','typewriter','gramophone','sundial','ancient statue','bronze figurine','cannon model'] },
    { id:'health', en:['Health & Medicine','Medical tools, anatomical models and equipment'], es:['Salud y medicina','Instrumental médico, modelos anatómicos y equipamiento'],
      s:['stethoscope','syringe','pills','anatomical heart model','skull model','skeleton model','tooth model','bandage','wheelchair','crutches','first aid kit','surgical mask','reflex hammer','blood pressure monitor','hearing aid','eyeglasses','brain model','medicine bottle','inhaler','dental model','scalpel','pill bottle'] },
    { id:'business', en:['Business & Economy','Money, trade goods, transport models and farm produce'], es:['Negocios y economía','Dinero, mercancías, modelos de transporte y productos del campo'],
      s:['coin','banknote','cash register','briefcase','shopping cart','shopping bag','cardboard box','wooden crate','toy truck','toy train','toy tractor','forklift model','shipping container model','weighing scale','price tag','piggy bank','wallet','credit card','megaphone','wheat sheaf','wicker basket','toy airplane','toy ship'] },
    { id:'religion', en:['Religion & Beliefs','Sacred objects, statues, rosaries and ritual items'], es:['Religión y creencias','Objetos sagrados, estatuas, rosarios y objetos rituales'],
      s:['Buddha statue','rosary','crucifix','menorah','incense burner','prayer beads','prayer wheel','Ganesha statue','angel statue','religious icon','candle','singing bowl','church bell','hamsa','tarot cards','dreamcatcher','cross pendant','Shiva statue','mezuzah','dreidel','lotus flower','madonna statue'] },
    { id:'objects', en:['Objects & Symbols','Flags, coats of arms, everyday items and signs'], es:['Objetos y símbolos','Banderas, escudos, objetos cotidianos y señales'],
      s:['flag','coat of arms','medal','trophy','badge','postage stamp','road sign','traffic sign','teapot','coffee cup','kettle','bottle','scissors','umbrella','hat','sneaker','boot','handbag','camera','clock','wristwatch','telephone','radio','lamp','chair','key','teddy bear','toy car','toy robot','bicycle','scooter','glasses','book','candle holder'] },
    { id:'mix', mix:true, en:['Mix of everything','A bit of every theme above'], es:['Mezcla de todo','Un poco de cada tema'], s:[] }
  ];
  function catById(id){ for(var i=0;i<CATS.length;i++) if(CATS[i].id===id) return CATS[i]; return null; }
  function catName(id){ if(id === 'custom') return state.custom; var c = catById(id); return c ? c[LANG][0] : ''; }
  function subjectsFor(id){
    var c = catById(id), pool = [];
    if(c.mix){ CATS.forEach(function(k){ if(!k.mix) pool = pool.concat(k.s); }); }
    else pool = c.s;
    var seenS = {}, uniq = [];
    pool.forEach(function(x){ if(!seenS[x]){ seenS[x] = 1; uniq.push(x); } });
    return uniq;
  }
  var VARIANTS = ['', ' object', ' item', ' isolated', ' vintage', ' toy', ' model', ' close-up', ' single', ' antique', ' handmade', ' studio photo'];
  function parseCustom(txt){
    var terms = txt.split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; });
    if(terms.length === 1){
      var words = terms[0].split(/\s+/).filter(function(w){ return w.length > 2; });
      if(words.length > 1) terms = terms.concat(words);
    }
    return terms.slice(0, 8);
  }
  function customSubjects(terms){
    var out = [];
    terms.forEach(function(tm){ VARIANTS.forEach(function(v){ out.push(tm + v); }); });
    return out;
  }
  function renderCats(){
    var box = $('cats'); box.textContent = '';
    CATS.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (c.mix ? ' mix' : '');
      b.setAttribute('aria-pressed', state.sel === c.id ? 'true' : 'false');
      var n = document.createElement('b'); n.textContent = c[LANG][0];
      var d = document.createElement('small'); d.textContent = c[LANG][1];
      b.appendChild(n); b.appendChild(d);
      b.addEventListener('click', function(){
        state.sel = (state.sel === c.id) ? null : c.id;
        if(state.sel) $('custom').value = '';
        Array.prototype.forEach.call(box.children, function(el, i){
          el.setAttribute('aria-pressed', state.sel === CATS[i].id ? 'true' : 'false');
        });
      });
      box.appendChild(b);
    });
  }

  function getJSON(url){
    var tries = [url, 'https://corsproxy.io/?'+encodeURIComponent(url), 'https://api.allorigins.win/raw?url='+encodeURIComponent(url)];
    var i = 0, last = 'network';
    function next(){
      if(i >= tries.length) return Promise.reject(new Error(last));
      return fetch(tries[i++]).then(function(r){
        if(!r.ok) throw new Error('http '+r.status);
        return r.json();
      }).catch(function(e){ last = e.message || 'network'; return next(); });
    }
    return next();
  }

  function search(subject){
    var u = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+subject+' white background')+
      '&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=640&format=json&origin=*';
    return getJSON(u).then(function(d){
      var pages = (d && d.query && d.query.pages) ? Object.keys(d.query.pages).map(function(k){ return d.query.pages[k]; }) : [];
      var out = [];
      pages.forEach(function(pg){
        var ii = pg.imageinfo && pg.imageinfo[0];
        if(!ii || (ii.mime !== 'image/jpeg' && ii.mime !== 'image/png') || !ii.width || ii.width < 400 || ii.height < 400) return;
        var by = '';
        try { by = ii.extmetadata.Artist.value.replace(/<[^>]*>/g,'').trim(); } catch(e){}
        if(!by || by.length > 40) by = 'Wikimedia Commons';
        var name = (pg.title || '').replace(/^File:/,'').replace(/\.[a-z]+$/i,'');
        out.push({ src: ii.thumburl || ii.url, by: by, name: name, page: ii.descriptionurl || '', subject: subject });
      });
      return out;
    }).catch(function(){ return []; });
  }

  function loadImg(url){
    return new Promise(function(res, rej){
      var im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = function(){ res(im); };
      im.onerror = function(){ rej(new Error('img')); };
      im.src = url;
    });
  }

  // ---- Cut-out: remove a plain background by flood-filling from the edges ----
  function cutout(im){
    var sc = Math.min(1, 560/Math.max(im.width, im.height));
    var w = Math.max(1, Math.round(im.width*sc)), h = Math.max(1, Math.round(im.height*sc));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var cx = c.getContext('2d', { willReadFrequently:true });
    cx.drawImage(im, 0, 0, w, h);
    var img;
    try { img = cx.getImageData(0, 0, w, h); } catch(e){ return null; }
    var d = img.data, N = w*h, i, x, y;

    var border = [];
    for(x=0;x<w;x++){ border.push(x); border.push((h-1)*w+x); }
    for(y=1;y<h-1;y++){ border.push(y*w); border.push(y*w+w-1); }

    var mask = new Uint8Array(N);
    var transparentBorder = 0;
    border.forEach(function(p){ if(d[p*4+3] < 20) transparentBorder++; });

    if(transparentBorder > border.length*0.5){
      for(i=0;i<N;i++) mask[i] = d[i*4+3] > 40 ? 1 : 0;
    } else {
      var R=[],G=[],B=[];
      border.forEach(function(p){ R.push(d[p*4]); G.push(d[p*4+1]); B.push(d[p*4+2]); });
      var med = function(a){ a.sort(function(m,n){ return m-n; }); return a[a.length>>1]; };
      var br = med(R), bg = med(G), bb = med(B);
      var T2 = 42*42;
      var near = function(p){
        var dr = d[p*4]-br, dg = d[p*4+1]-bg, db = d[p*4+2]-bb;
        return dr*dr+dg*dg+db*db < T2;
      };
      var nearCount = 0;
      border.forEach(function(p){ if(near(p)) nearCount++; });
      if(nearCount < border.length*0.7) return null;

      var seen = new Uint8Array(N), q = new Int32Array(N), qh = 0, qt = 0;
      border.forEach(function(p){ if(!seen[p] && near(p)){ seen[p]=1; q[qt++]=p; } });
      while(qh < qt){
        var p = q[qh++], px = p % w, py = (p - px)/w, nb;
        if(px>0){ nb=p-1; if(!seen[nb] && near(nb)){ seen[nb]=1; q[qt++]=nb; } }
        if(px<w-1){ nb=p+1; if(!seen[nb] && near(nb)){ seen[nb]=1; q[qt++]=nb; } }
        if(py>0){ nb=p-w; if(!seen[nb] && near(nb)){ seen[nb]=1; q[qt++]=nb; } }
        if(py<h-1){ nb=p+w; if(!seen[nb] && near(nb)){ seen[nb]=1; q[qt++]=nb; } }
      }
      for(i=0;i<N;i++) mask[i] = seen[i] ? 0 : 1;
    }

    var lab = new Int32Array(N), best = 0, bestId = 0, id = 0, stack = new Int32Array(N);
    for(i=0;i<N;i++){
      if(!mask[i] || lab[i]) continue;
      id++; var sp = 0, cnt = 0; stack[sp++] = i; lab[i] = id;
      while(sp){
        var s = stack[--sp]; cnt++;
        var sx = s % w, sy = (s - sx)/w, tt;
        if(sx>0){ tt=s-1; if(mask[tt] && !lab[tt]){ lab[tt]=id; stack[sp++]=tt; } }
        if(sx<w-1){ tt=s+1; if(mask[tt] && !lab[tt]){ lab[tt]=id; stack[sp++]=tt; } }
        if(sy>0){ tt=s-w; if(mask[tt] && !lab[tt]){ lab[tt]=id; stack[sp++]=tt; } }
        if(sy<h-1){ tt=s+w; if(mask[tt] && !lab[tt]){ lab[tt]=id; stack[sp++]=tt; } }
      }
      if(cnt > best){ best = cnt; bestId = id; }
    }
    var ratio = best/N;
    if(ratio < 0.06 || ratio > 0.8) return null;
    var m2 = new Uint8Array(N);
    for(i=0;i<N;i++) m2[i] = lab[i] === bestId ? 1 : 0;

    var er = new Uint8Array(N);
    for(y=1;y<h-1;y++) for(x=1;x<w-1;x++){
      var k = y*w+x;
      er[k] = (m2[k] && m2[k-1] && m2[k+1] && m2[k-w] && m2[k+w]) ? 255 : 0;
    }
    var al = new Uint8Array(N);
    for(y=1;y<h-1;y++) for(x=1;x<w-1;x++){
      var kk = y*w+x, sum = 0;
      for(var oy=-1;oy<=1;oy++) for(var ox=-1;ox<=1;ox++) sum += er[kk+oy*w+ox];
      al[kk] = sum/9;
    }

    var x0=w,y0=h,x1=0,y1=0;
    for(y=0;y<h;y++) for(x=0;x<w;x++){
      if(al[y*w+x] > 30){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    var bw = x1-x0+1, bh = y1-y0+1;
    if(bw < w*0.2 || bh < h*0.2) return null;

    for(i=0;i<N;i++) d[i*4+3] = al[i];
    cx.putImageData(img, 0, 0);
    var out = document.createElement('canvas'); out.width = bw; out.height = bh;
    out.getContext('2d').drawImage(c, x0, y0, bw, bh, 0, 0, bw, bh);
    return out;
  }

  // ---- White sticker outline ----
  function sticker(co){
    var pad = 16, r = 9;
    var cw = co.width + pad*2, ch = co.height + pad*2;
    var sil = document.createElement('canvas'); sil.width = co.width; sil.height = co.height;
    var sx = sil.getContext('2d');
    sx.drawImage(co, 0, 0);
    sx.globalCompositeOperation = 'source-in';
    sx.fillStyle = '#ffffff'; sx.fillRect(0, 0, sil.width, sil.height);
    var out = document.createElement('canvas'); out.width = cw; out.height = ch;
    var ox = out.getContext('2d');
    for(var a=0;a<24;a++){
      var ang = a/24*Math.PI*2;
      ox.drawImage(sil, pad+Math.cos(ang)*r, pad+Math.sin(ang)*r);
    }
    ox.drawImage(co, pad, pad);
    return out;
  }

  // ---- Collage (no title on the image) ----
  var BGS = ['#f6e7cb','#dff1e4','#e3e8fb','#fbe0e0','#fff3c4','#e8dff5','#d9f0f3','#fde8d4'];
  function drawCollage(){
    var bg = pick(BGS);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,.05)';
    for(var gx=30; gx<W; gx+=60) for(var gy=30; gy<H; gy+=60){ ctx.beginPath(); ctx.arc(gx, gy, 3, 0, 7); ctx.fill(); }

    var cols = 3, rows = 4, x0 = 50, y0 = 50, aw = W-100, ah = H-y0-100;
    var cw = aw/cols, chh = ah/rows;
    var cells = [];
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) cells.push({ c:c, r:r });
    cells = shuffle(cells).slice(0, state.items.length);

    var placed = state.items.map(function(it, i){
      var cell = cells[i];
      var boxW = cw*1.28, boxH = chh*1.5;
      var s = Math.min(boxW/it.canvas.width, boxH/it.canvas.height, 1.05);
      return {
        cv: it.canvas, w: it.canvas.width*s, h: it.canvas.height*s,
        x: x0 + (cell.c+0.5)*cw + (Math.random()-0.5)*50 + ((cell.r % 2) ? cw*0.12 : -cw*0.12),
        y: y0 + (cell.r+0.5)*chh + (Math.random()-0.5)*40,
        rot: (Math.random()-0.5)*0.42
      };
    });
    placed.sort(function(a,b){ return b.w*b.h - a.w*a.h; });
    placed.forEach(function(p){
      var px = Math.min(W-p.w/2-20, Math.max(p.w/2+20, p.x));
      var py = Math.min(H-p.h/2-60, Math.max(p.h/2+20, p.y));
      ctx.save();
      ctx.translate(px, py); ctx.rotate(p.rot);
      ctx.shadowColor = 'rgba(0,0,0,.30)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 9;
      ctx.drawImage(p.cv, -p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });

    ctx.fillStyle = 'rgba(29,26,22,.55)'; ctx.font = '22px Poppins, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('CollagePro · Wikimedia Commons', W/2, H-26);
  }

  function drawIdle(){
    ctx.fillStyle = '#e9e1d0'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#9b8f78'; ctx.font = 'italic 52px Poppins, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t('canvasIdle'), W/2, H/2);
  }

  function showCredits(){
    var ol = $('creditList'); ol.textContent = '';
    state.items.forEach(function(it){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.textContent = it.name.length > 60 ? it.name.slice(0, 57)+'…' : it.name;
      if(it.page){ a.href = it.page; a.target = '_blank'; a.rel = 'noopener'; }
      li.appendChild(a);
      li.appendChild(document.createTextNode(' — '+it.by));
      ol.appendChild(li);
    });
    $('credits').hidden = false;
  }

  // ---- Generate ----
  function generate(){
    if(state.busy) return;
    state.busy = true;
    $('go').disabled = true; $('wa').disabled = true;
    var typed = $('custom').value.trim().replace(/\s+/g, ' ');
    var subjects;
    if(typed){
      state.custom = typed; state.cat = 'custom';
      var terms = parseCustom(typed);
      var perTerm = Math.max(4, Math.floor(16/terms.length));
      subjects = [];
      terms.forEach(function(tm){
        subjects = subjects.concat(shuffle(customSubjects([tm])).slice(0, perTerm));
      });
      subjects = shuffle(subjects).slice(0, 16);
    } else {
      state.cat = state.sel || pick(CATS).id;
      subjects = shuffle(subjectsFor(state.cat)).slice(0, 16);
    }
    say('picking');
    Promise.all(subjects.map(search)).then(function(lists){
      var queues = lists.map(function(l){ return shuffle(l).slice(0, 3); });
      var cands = [], seen = {};
      for(var round=0; round<3; round++){
        queues.forEach(function(q){
          var it = q[round];
          if(it && !seen[it.src]){ seen[it.src] = 1; cands.push(it); }
        });
      }
      if(!cands.length) throw new Error('none');
      var accepted = [], idx = 0, attempts = 0;
      function worker(){
        if(accepted.length >= 11 || idx >= cands.length || attempts >= 60) return Promise.resolve();
        var cand = cands[idx++]; attempts++;
        return loadImg(cand.src).then(function(im){
          if(accepted.length >= 11) return;
          var co = cutout(im);
          if(co){
            accepted.push({ canvas: sticker(co), by: cand.by, name: cand.name, page: cand.page });
            say('cutting', Math.min(accepted.length, 11));
          }
        }).catch(function(){}).then(worker);
      }
      return Promise.all([worker(), worker(), worker(), worker(), worker()]).then(function(){
        if(accepted.length < 4) throw new Error('few');
        state.items = accepted.slice(0, 11);
      });
    }).then(function(){
      state.tit = newTitle();
      state.done = true;
      drawCollage();
      showCredits();
      say('done', titleText());
      $('wa').disabled = false;
    }).catch(function(e){
      var m = e && e.message;
      if(m === 'few') say('errFew', null, true);
      else if(m === 'none') say('errNone', null, true);
      else say('errNet', m, true);
    }).then(function(){
      state.busy = false; $('go').disabled = false;
    });
  }
  $('go').addEventListener('click', generate);
  $('custom').addEventListener('input', function(){
    if(this.value.trim() && state.sel){
      state.sel = null;
      Array.prototype.forEach.call($('cats').children, function(el){ el.setAttribute('aria-pressed','false'); });
    }
  });
  $('custom').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); generate(); } });

  // ---- WhatsApp (title goes in the message only) ----
  function isMobile(){
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
  }
  function waText(){
    return '🧩 '+titleText()+'\n\n'+t('made')+'\n'+LINK;
  }
  function toBlob(){
    return new Promise(function(res, rej){
      try { cv.toBlob(function(b){ b ? res(b) : rej(new Error('blob')); }, 'image/png'); }
      catch(e){ rej(e); }
    });
  }
  function saveBlob(b, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }
  $('wa').addEventListener('click', function(){
    var text = waText();
    var slug = titleText().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'collage';
    var fname = 'collagepro-'+slug+'.png';
    $('wa').disabled = true; say('prep');

    if(isMobile()){
      toBlob().then(function(b){
        var f = new File([b], fname, { type:'image/png' });
        var data = { files:[f], text:text };
        if(navigator.canShare && navigator.canShare(data)){
          return navigator.share(data).then(function(){ say('shareChoose'); });
        }
        saveBlob(b, fname);
        say('waMobileSaved');
        window.location.href = 'https://wa.me/?text='+encodeURIComponent(text);
      }).catch(function(e){
        if(e && e.name === 'AbortError') say('cancelled');
        else say('waFail', null, true);
      }).then(function(){ $('wa').disabled = false; });
      return;
    }

    var url = 'https://web.whatsapp.com/send?text='+encodeURIComponent(text);
    var blobP = toBlob();
    var copyP;
    try { copyP = navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]); }
    catch(e){ copyP = Promise.reject(e); }
    var win = null;
    try { win = window.open('', '_blank'); } catch(e){}
    copyP.then(function(){ return true; }, function(){
      return blobP.then(function(b){ saveBlob(b, fname); return false; }).catch(function(){ return false; });
    }).then(function(copied){
      if(win) win.location.href = url; else window.open(url, '_blank');
      say(copied ? 'waCopied' : 'waSaved');
    }).catch(function(){
      if(win && !win.closed) win.close();
      say('waFail', null, true);
    }).then(function(){ $('wa').disabled = false; });
  });

  // ---- Language toggle ----
  function applyLang(){
    document.documentElement.lang = LANG;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    var lb = $('lang'); lb.textContent = t('btn'); lb.setAttribute('aria-label', t('btnLabel'));
    renderCats();
    $('custom').placeholder = t('customPh');
  }
  $('lang').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'es' : 'en';
    applyLang();
    if(state.say && state.say.k === 'done') state.say.a = titleText();
    renderSay();
    if(!state.done) drawIdle();
  });

  if(isMobile()) $('hint').style.display = 'none';
  applyLang();
  drawIdle();
  say('idle');
})();
</script>
