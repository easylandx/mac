<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHK WORLD-JAPAN Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 20px;
      text-align: center;
      background: linear-gradient(to bottom, #1a1a1a, #0f0f0f);
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e60012; /* NHK red-ish accent */
    }

    header p {
      margin-top: 6px;
      color: #aaa;
      font-size: 0.95rem;
    }

    .player-container {
      width: 100%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    .info a {
      color: #e60012;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: auto;
      padding: 25px;
      text-align: center;
      color: #555;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>NHK WORLD-JAPAN</h1>
    <p>Live Stream • Widening Horizons</p>
  </header>

  <div class="player-container">
    <div class="video-wrapper">
      <video id="video" controls autoplay muted playsinline></video>
    </div>

    <div class="info">
      Official site: 
      <a href="https://www3.nhk.or.jp/nhkworld/" target="_blank" rel="noopener">
        www3.nhk.or.jp/nhkworld
      </a>
    </div>
  </div>

  <footer>
    NHK WORLD-JAPAN — Japan's international broadcasting service
  </footer>

  <script>
    const video = document.getElementById('video');
    const streamUrl = "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(() => {
          // Autoplay may be blocked — user can click play
          console.log("Autoplay blocked, click play to start");
        });
      });
    } 
    // Native HLS support (Safari / iOS)
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play().catch(() => {});
      });
    } else {
      video.outerHTML = `
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#ccc;padding:20px;text-align:center;">
          Your browser does not support HLS streaming.<br>
          Please use Chrome, Firefox, Edge or Safari.
        </div>`;
    }
  </script>

</body>
</html>
