<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCARS // ISO-STANDARD COMPUTER ACCESS TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --lc-orange:#ff9c00;
    --lc-lilac:#cc99cc;
    --lc-blue:#9999ff;
    --lc-cream:#ffcc99;
    --lc-red:#cc6666;
    --lc-pale-blue:#99ccff;
    --lc-gold:#ffcc66;
    --lc-bg:#000000;
    --lc-panel-bg:#0a0a0f;
    --lc-text:#ff9c00;
    --alert-flash: var(--lc-red);
    --hdr-height: 96px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--lc-bg);
    font-family:'Antonio', sans-serif;
    color:var(--lc-cream);
    overflow:hidden;
  }

  ::selection{ background:var(--lc-orange); color:#000; }

  /* scrollbar */
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:#000; }
  ::-webkit-scrollbar-thumb{ background:var(--lc-orange); border-radius:6px; }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
    position:relative;
    transition: background-color .15s ease;
  }

  #app.alert-mode{
    animation: redAlertPulse 1.1s infinite;
  }
  @keyframes redAlertPulse{
    0%,100%{ background:#000; }
    50%{ background:#1a0000; }
  }

  /* ============ HEADER ============ */
  .lcars-header{
    display:flex;
    align-items:stretch;
    height:var(--hdr-height);
    padding:8px 12px 0 12px;
    gap:8px;
    flex-shrink:0;
  }
  .elbow-tl{
    width:180px;
    background:var(--lc-orange);
    border-top-left-radius:52px 46px;
    position:relative;
    flex-shrink:0;
  }
  .elbow-tl::after{
    content:"";
    position:absolute;
    left:0; bottom:-14px;
    width:60px; height:14px;
    background:var(--lc-orange);
  }
  .header-bar{
    flex:1;
    background:var(--lc-lilac);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    min-width:0;
  }
  .header-title{
    font-weight:700;
    font-size:clamp(18px,2.6vw,34px);
    letter-spacing:2px;
    color:#000;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header-code{
    font-family:'Share Tech Mono', monospace;
    font-size:13px;
    color:#000;
    text-align:right;
    line-height:1.3;
  }
  .header-block{
    width:64px;
    background:var(--lc-blue);
    border-top-right-radius:40px;
    flex-shrink:0;
  }

  /* ============ MAIN LAYOUT ============ */
  .lcars-main{
    flex:1;
    display:flex;
    gap:10px;
    padding:0 12px 10px 12px;
    min-height:0;
  }

  /* ---- Sidebar ---- */
  .lcars-sidebar{
    width:190px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
    padding-right:2px;
  }
  .lc-btn{
    border:none;
    cursor:pointer;
    font-family:'Antonio', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:1px;
    text-align:right;
    padding:10px 18px;
    color:#000;
    border-radius:0 22px 22px 0;
    transition: filter .12s ease, transform .08s ease;
    text-transform:uppercase;
  }
  .lc-btn:hover{ filter:brightness(1.25); }
  .lc-btn:active{ transform:scale(.97); }
  .lc-btn.bg-orange{ background:var(--lc-orange); }
  .lc-btn.bg-lilac{ background:var(--lc-lilac); }
  .lc-btn.bg-blue{ background:var(--lc-blue); }
  .lc-btn.bg-cream{ background:var(--lc-cream); }
  .lc-btn.bg-gold{ background:var(--lc-gold); }
  .lc-btn.bg-red{ background:var(--lc-red); }
  .lc-btn.bg-pale{ background:var(--lc-pale-blue); }

  .sidebar-gap{
    flex:1;
    background:repeating-linear-gradient(
      180deg,
      #1a1a1a 0px, #1a1a1a 10px,
      #000 10px, #000 16px
    );
    border-radius:0 12px 12px 0;
    min-height:20px;
  }

  .lc-btn.active-alert{
    background:var(--lc-red);
    animation: btnPulse 1s infinite;
  }
  @keyframes btnPulse{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.5); }
  }

  /* ---- Screen column ---- */
  .lcars-screen-col{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    gap:8px;
  }

  .screen-topbar{
    display:flex;
    gap:8px;
    height:22px;
    flex-shrink:0;
  }
  .tb-seg{
    height:100%;
    border-radius:11px;
  }
  .tb1{ width:26%; background:var(--lc-orange); }
  .tb2{ width:14%; background:var(--lc-blue); }
  .tb3{ flex:1; background:var(--lc-lilac); }
  .tb4{ width:10%; background:var(--lc-cream); }

  .terminal-frame{
    flex:1;
    background:var(--lc-panel-bg);
    border:2px solid #1a1a1a;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
    box-shadow: inset 0 0 60px rgba(255,156,0,0.06);
  }

  .crt-scanlines{
    pointer-events:none;
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    border-radius:14px;
  }

  .terminal-output{
    flex:1;
    overflow-y:auto;
    padding:18px 22px;
    font-family:'Share Tech Mono', monospace;
    font-size:14.5px;
    line-height:1.65;
    color:var(--lc-text);
  }
  .terminal-output .ln{ white-space:pre-wrap; word-break:break-word; }
  .ln.sys{ color:var(--lc-blue); }
  .ln.warn{ color:var(--lc-red); font-weight:bold; }
  .ln.ok{ color:#7cffb2; }
  .ln.user{ color:var(--lc-cream); }
  .ln.dim{ color:#7a5a2a; }
  .ln.title{ color:var(--lc-gold); font-weight:bold; }

  .cursor-blink{
    display:inline-block;
    width:9px; height:15px;
    background:var(--lc-orange);
    animation: blink 1s step-end infinite;
    vertical-align:middle;
    margin-left:2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .terminal-inputbar{
    display:flex;
    align-items:center;
    gap:10px;
    border-top:2px solid #1a1a1a;
    padding:10px 18px;
    flex-shrink:0;
  }
  .prompt-tag{
    font-family:'Share Tech Mono', monospace;
    color:var(--lc-orange);
    font-weight:bold;
    flex-shrink:0;
  }
  #cmdInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--lc-cream);
    font-family:'Share Tech Mono', monospace;
    font-size:15px;
    caret-color:var(--lc-orange);
  }
  #cmdInput::placeholder{ color:#555; }

  .screen-bottombar{
    display:flex;
    gap:8px;
    height:16px;
    flex-shrink:0;
  }
  .bb-seg{ height:100%; border-radius:8px; }
  .bb1{ width:18%; background:var(--lc-lilac); }
  .bb2{ flex:1; background:var(--lc-orange); }
  .bb3{ width:22%; background:var(--lc-blue); }

  /* ============ FOOTER ============ */
  .lcars-footer{
    display:flex;
    align-items:stretch;
    height:34px;
    padding:0 12px 8px 12px;
    gap:8px;
    flex-shrink:0;
  }
  .elbow-bl{
    width:180px;
    background:var(--lc-orange);
    border-bottom-left-radius:30px 26px;
    flex-shrink:0;
  }
  .footer-bar{
    flex:1;
    background:var(--lc-lilac);
    display:flex;
    align-items:center;
    padding:0 20px;
    font-family:'Share Tech Mono', monospace;
    font-size:11px;
    color:#000;
    letter-spacing:1px;
    justify-content:space-between;
  }
  .footer-block{
    width:64px;
    background:var(--lc-blue);
    border-bottom-right-radius:22px;
    flex-shrink:0;
  }

  /* ============ SOUND TOGGLE ============ */
  .sound-toggle{
    position:fixed;
    top:14px;
    right:14px;
    z-index:50;
    background:var(--lc-cream);
    border:none;
    color:#000;
    font-family:'Antonio',sans-serif;
    font-weight:700;
    letter-spacing:1px;
    padding:6px 16px;
    border-radius:16px;
    cursor:pointer;
    font-size:12px;
  }
  .sound-toggle:hover{ filter:brightness(1.15); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 820px){
    :root{ --hdr-height: 74px; }
    .elbow-tl, .elbow-bl{ width:70px; }
    .header-title{ font-size:16px; }
    .header-code{ display:none; }
    .lcars-sidebar{ width:96px; }
    .lc-btn{ font-size:11px; padding:9px 8px; text-align:center; border-radius:0 12px 12px 0;}
    .terminal-output{ font-size:12.5px; padding:12px; }
    .header-block, .footer-block{ width:30px; }
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" aria-pressed="true">🔊 AUDIO ON</button>

<div id="app">

  <!-- HEADER -->
  <div class="lcars-header">
    <div class="elbow-tl"></div>
    <div class="header-bar">
      <div class="header-title">LCARS ACCESS TERMINAL</div>
      <div class="header-code" id="stardateHeader">STARDATE --- &bull; SYS NOM-2286</div>
    </div>
    <div class="header-block"></div>
  </div>

  <!-- MAIN -->
  <div class="lcars-main">

    <!-- SIDEBAR -->
    <nav class="lcars-sidebar" id="sidebar">
      <button class="lc-btn bg-orange" data-cmd="status">STATUS</button>
      <button class="lc-btn bg-lilac" data-cmd="scan">SCAN</button>
      <button class="lc-btn bg-blue" data-cmd="comm">COMM CHANNEL</button>
      <button class="lc-btn bg-cream" data-cmd="crew">CREW LOCATOR</button>
      <button class="lc-btn bg-gold" data-cmd="stardate">STARDATE</button>
      <button class="lc-btn bg-pale" data-cmd="library">LIBRARY COMPUTER</button>
      <div class="sidebar-gap"></div>
      <button class="lc-btn bg-red" id="alertBtn" data-cmd="alert">RED ALERT</button>
      <button class="lc-btn bg-orange" data-cmd="clear">CLEAR SCREEN</button>
      <button class="lc-btn bg-lilac" data-cmd="help">HELP</button>
    </nav>

    <!-- SCREEN COLUMN -->
    <div class="lcars-screen-col">
      <div class="screen-topbar">
        <div class="tb-seg tb1"></div>
        <div class="tb-seg tb2"></div>
        <div class="tb-seg tb3"></div>
        <div class="tb-seg tb4"></div>
      </div>

      <div class="terminal-frame">
        <div class="crt-scanlines"></div>
        <div class="terminal-output" id="output" role="log" aria-live="polite"></div>
        <div class="terminal-inputbar">
          <span class="prompt-tag">&gt;</span>
          <input type="text" id="cmdInput" placeholder="ENTER COMMAND // TYPE 'HELP'" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="screen-bottombar">
        <div class="bb-seg bb1"></div>
        <div class="bb-seg bb2"></div>
        <div class="bb-seg bb3"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="lcars-footer">
    <div class="elbow-bl"></div>
    <div class="footer-bar">
      <span>NCC-COMPUTER-CORE</span>
      <span id="clockFooter">00:00:00</span>
      <span>ALL SYSTEMS NOMINAL</span>
    </div>
    <div class="footer-block"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     AUDIO ENGINE — all sounds synthesized, no external files
  ============================================================ */
  let audioCtx = null;
  let soundEnabled = true;
  let alertLoopNodes = null;

  function ensureCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur, type, startGain, opts){
    if(!soundEnabled) return;
    opts = opts || {};
    const ctx = ensureCtx();
    const t0 = ctx.currentTime + (opts.delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(opts.slideTo){
      osc.frequency.exponentialRampToValueAtTime(Math.max(opts.slideTo,1), t0 + dur);
    }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(startGain || 0.15, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  const Sound = {
    key(){
      tone(1400 + Math.random()*200, 0.02, 'square', 0.035);
    },
    confirm(){
      tone(880, 0.07, 'sine', 0.14);
      tone(1320, 0.09, 'sine', 0.12, {delay:0.07});
    },
    beepHi(){
      tone(1200, 0.09, 'triangle', 0.13, {slideTo:1800});
    },
    error(){
      tone(220, 0.28, 'sawtooth', 0.14, {slideTo:90});
    },
    button(){
      tone(660, 0.05, 'square', 0.08);
      tone(990, 0.05, 'square', 0.06, {delay:0.04});
    },
    hover(){
      tone(1800, 0.02, 'sine', 0.03);
    },
    boot(){
      tone(140, 0.5, 'sawtooth', 0.10, {slideTo:900});
      tone(1200, 0.15, 'sine', 0.08, {delay:0.45});
      tone(1600, 0.15, 'sine', 0.08, {delay:0.6});
    },
    scanPing(){
      tone(500, 0.4, 'sine', 0.09, {slideTo:2200});
    },
    alertOn(){
      startAlertLoop();
    },
    alertOff(){
      stopAlertLoop();
    },
    countdownBeep(urgent){
      tone(urgent ? 1000 : 700, 0.12, 'square', 0.13);
    },
    typewriter(){
      tone(2200 + Math.random()*300, 0.012, 'square', 0.02);
    }
  };

  function startAlertLoop(){
    if(!soundEnabled || alertLoopNodes) return;
    const ctx = ensureCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 440;
    lfo.type = 'sine';
    lfo.frequency.value = 0.9;
    lfoGain.gain.value = 220;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.value = 0.05;
    osc.connect(gain).connect(ctx.destination);
    osc.start(); lfo.start();
    alertLoopNodes = {osc, lfo, gain};
  }
  function stopAlertLoop(){
    if(!alertLoopNodes) return;
    try{
      const {osc, lfo, gain} = alertLoopNodes;
      const ctx = ensureCtx();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
      osc.stop(ctx.currentTime + 0.35);
      lfo.stop(ctx.currentTime + 0.35);
    }catch(e){}
    alertLoopNodes = null;
  }

  /* ============================================================
     TERMINAL STATE / OUTPUT
  ============================================================ */
  const output = document.getElementById('output');
  const input = document.getElementById('cmdInput');
  const app = document.getElementById('app');
  const alertBtn = document.getElementById('alertBtn');
  const stardateHeader = document.getElementById('stardateHeader');
  const clockFooter = document.getElementById('clockFooter');

  let alertActive = false;
  let history = [];
  let histIdx = -1;

  function scrollBottom(){
    output.scrollTop = output.scrollHeight;
  }

  function printLine(text, cls){
    const div = document.createElement('div');
    div.className = 'ln' + (cls ? ' '+cls : '');
    div.textContent = text;
    output.appendChild(div);
    scrollBottom();
    return div;
  }

  // typewriter-style print for flavour, returns a promise
  function typeLine(text, cls, speed){
    return new Promise(resolve=>{
      const div = document.createElement('div');
      div.className = 'ln' + (cls ? ' '+cls : '');
      output.appendChild(div);
      let i = 0;
      speed = speed || 8;
      function step(){
        if(i <= text.length){
          div.textContent = text.slice(0,i);
          if(i < text.length && text[i-1] !== ' ' && Math.random() < 0.7) Sound.typewriter();
          i++;
          scrollBottom();
          setTimeout(step, speed);
        } else {
          resolve();
        }
      }
      step();
    });
  }

  function printBlank(){
    printLine('\u00A0');
  }

  /* ============================================================
     STARDATE / CLOCK
  ============================================================ */
  function computeStardate(){
    const now = new Date();
    const year = now.getFullYear();
    const start = new Date(year,0,1);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const frac = ((now.getHours()*3600+now.getMinutes()*60+now.getSeconds())/86400*10).toFixed(1);
    const base = (year - 2323) * 1000; // arbitrary fictional epoch offset
    const sd = (Math.abs(base) + dayOfYear*2.74).toFixed(1);
    return `${sd}`;
  }

  function updateClock(){
    const now = new Date();
    clockFooter.textContent = now.toLocaleTimeString('en-GB');
    stardateHeader.textContent = `STARDATE ${computeStardate()} \u2022 SYS NOM-2286`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* ============================================================
     COMMAND DATA
  ============================================================ */
  const crewNames = ["COMMANDING OFFICER","CHIEF ENGINEER","SCIENCE OFFICER","MEDICAL OFFICER","HELM OFFICER","SECURITY CHIEF","COMMUNICATIONS OFFICER","OPERATIONS OFFICER"];
  const crewLocations = ["BRIDGE","MAIN ENGINEERING","SCIENCE LAB 2","SICKBAY","TRANSPORTER ROOM 3","OBSERVATION DECK","STELLAR CARTOGRAPHY","CREW QUARTERS DECK 7","ASTROMETRICS","SHUTTLEBAY 2"];
  const scanResults = [
    "NO ANOMALIES DETECTED WITHIN SCAN RADIUS.",
    "TRACE ION TRAIL DETECTED, BEARING 221 MARK 4.",
    "SUBSPACE FLUCTUATION LOGGED. AMPLITUDE WITHIN NORMAL PARAMETERS.",
    "UNIDENTIFIED DEBRIS FIELD, 0.3 LIGHT-YEARS DISTANT.",
    "WEAK ENERGY SIGNATURE, ORIGIN UNKNOWN. LOGGING TO SCIENCE DATABASE.",
    "STELLAR RADIATION AT NOMINAL LEVELS.",
    "GRAVIMETRIC DISTORTION, MINOR, SELF-CORRECTING."
  ];
  const libraryFacts = [
    "LCARS: LIBRARY COMPUTER ACCESS AND RETRIEVAL SYSTEM. THE STANDARD INTERFACE ARCHITECTURE ACROSS ALL SHIPBOARD AND STATION SYSTEMS.",
    "DEFLECTOR SHIELD HARMONICS ARE RECALIBRATED EVERY 6 HOURS TO PREVENT SUBSPACE RESONANCE CASCADE.",
    "REPLICATOR SYSTEMS PATTERN-BUFFER ORGANIC COMPOUNDS AT THE MOLECULAR LEVEL FOR RAPID SYNTHESIS.",
    "WARP FIELD GEOMETRY DEPENDS ON PRECISE ANTIMATTER INJECTOR TIMING WITHIN THE WARP CORE.",
    "TURBOLIFT NETWORKS ROUTE THROUGH PRIMARY AND SECONDARY STRUCTURAL HULL CONDUITS.",
    "TRANSPORTER PATTERN BUFFERS CAN RETAIN A CONFIGURATION FOR APPROXIMATELY 7 MINUTES BEFORE DEGRADATION."
  ];

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ============================================================
     COMMAND HANDLERS
  ============================================================ */
  async function cmdHelp(){
    printLine('AVAILABLE COMMANDS', 'title');
    const rows = [
      ['STATUS','DISPLAY SHIP SYSTEMS STATUS REPORT'],
      ['SCAN','INITIATE SHORT-RANGE SENSOR SWEEP'],
      ['COMM <MSG>','OPEN SUBSPACE CHANNEL AND TRANSMIT'],
      ['CREW','LOCATE ACTIVE CREW MEMBER'],
      ['STARDATE','DISPLAY CURRENT STARDATE'],
      ['LIBRARY','QUERY LIBRARY COMPUTER DATABASE'],
      ['ALERT / RED ALERT','TOGGLE RED ALERT CONDITION'],
      ['SELF-DESTRUCT','INITIATE AUTO-DESTRUCT SEQUENCE (SIMULATED)'],
      ['CLEAR','CLEAR TERMINAL DISPLAY'],
      ['ABOUT','ABOUT THIS TERMINAL']
    ];
    rows.forEach(r=>{
      printLine(`  ${r[0].padEnd(20,' ')} ${r[1]}`, 'dim');
    });
    printBlank();
  }

  async function cmdStatus(){
    printLine('COMPUTER: RUNNING DIAGNOSTIC...', 'sys');
    await wait(400);
    Sound.beepHi();
    const systems = [
      ['LIFE SUPPORT','98%','OK'],
      ['WARP CORE','100%','OK'],
      ['DEFLECTOR SHIELDS', alertActive ? '100%' : '61%', alertActive ? 'RAISED' : 'STANDBY'],
      ['STRUCTURAL INTEGRITY','100%','OK'],
      ['SENSOR ARRAY','94%','OK'],
      ['COMMUNICATIONS','100%','OK'],
      ['TRANSPORTER SYSTEMS','89%','OK'],
      ['AUXILIARY POWER','100%','OK']
    ];
    systems.forEach(s=>{
      const cls = s[2]==='OK' || s[2]==='RAISED' ? 'ok' : 'warn';
      printLine(`  ${s[0].padEnd(22,'.')} ${s[1].padEnd(6,' ')} [${s[2]}]`, cls);
    });
    printLine(alertActive ? 'CONDITION: RED ALERT' : 'CONDITION: GREEN', alertActive ? 'warn' : 'ok');
    printBlank();
  }

  async function cmdScan(){
    printLine('COMPUTER: INITIATING SENSOR SWEEP...', 'sys');
    Sound.scanPing();
    await animateProgress('SCANNING', 18);
    printLine(rand(scanResults), 'ok');
    printBlank();
  }

  async function cmdComm(msg){
    if(!msg){
      printLine('SYNTAX: COMM <MESSAGE>', 'warn');
      return;
    }
    printLine('COMPUTER: OPENING SUBSPACE CHANNEL...', 'sys');
    await wait(350);
    Sound.confirm();
    printLine(`CHANNEL OPEN. TRANSMITTING...`, 'sys');
    await wait(300);
    printLine(`> "${msg.toUpperCase()}"`, 'user');
    await wait(500);
    printLine('MESSAGE TRANSMITTED. AWAITING RESPONSE...', 'dim');
    await wait(700);
    printLine('NO RESPONSE RECEIVED ON THIS FREQUENCY.', 'dim');
    printBlank();
  }

  async function cmdCrew(){
    printLine('COMPUTER: LOCATING CREW MEMBER...', 'sys');
    await wait(400);
    Sound.beepHi();
    const who = rand(crewNames);
    const where = rand(crewLocations);
    printLine(`${who} — CURRENT LOCATION: ${where}.`, 'ok');
    printBlank();
  }

  async function cmdStardate(){
    printLine(`CURRENT STARDATE: ${computeStardate()}`, 'ok');
    printLine(`LOCAL TIME: ${new Date().toLocaleString()}`, 'dim');
    printBlank();
  }

  async function cmdLibrary(){
    printLine('COMPUTER: ACCESSING LIBRARY COMPUTER...', 'sys');
    await wait(350);
    Sound.beepHi();
    await typeLine(rand(libraryFacts), 'ok', 6);
    printBlank();
  }

  function setAlert(on){
    alertActive = on;
    app.classList.toggle('alert-mode', on);
    alertBtn.classList.toggle('active-alert', on);
    alertBtn.textContent = on ? 'STAND DOWN' : 'RED ALERT';
    if(on){
      Sound.alertOn();
    } else {
      Sound.alertOff();
    }
  }

  async function cmdAlert(){
    if(!alertActive){
      printLine('*** RED ALERT ***', 'warn');
      printLine('ALL HANDS TO BATTLE STATIONS. SHIELDS UP.', 'warn');
      setAlert(true);
    } else {
      printLine('STANDING DOWN FROM RED ALERT.', 'sys');
      printLine('CONDITION GREEN RESTORED.', 'ok');
      setAlert(false);
    }
    printBlank();
  }

  async function cmdClear(){
    output.innerHTML = '';
  }

  async function cmdAbout(){
    printLine('LCARS ACCESS TERMINAL — INTERACTIVE SIMULATOR', 'title');
    printLine('A FAN-INSPIRED, SINGLE-FILE COMPUTER INTERFACE SIMULATION.', 'dim');
    printLine('BUILT WITH HTML, CSS AND THE WEB AUDIO API. NO EXTERNAL AUDIO FILES.', 'dim');
    printLine('THIS IS AN UNOFFICIAL FAN PROJECT AND IS NOT AFFILIATED WITH ANY STUDIO OR RIGHTS HOLDER.', 'dim');
    printBlank();
  }

  async function cmdSelfDestruct(){
    printLine('COMPUTER: AUTO-DESTRUCT SYSTEM ARMED.', 'warn');
    await wait(300);
    printLine('THIS IS A SIMULATION. NO SYSTEMS WILL BE HARMED.', 'dim');
    await wait(400);
    printLine('VOICEPRINT VERIFICATION: ACCEPTED.', 'sys');
    await wait(300);
    printLine('ENTER AUTO-DESTRUCT SEQUENCE COUNTDOWN: 10 SECONDS.', 'warn');
    await wait(300);
    for(let i=10;i>0;i--){
      printLine(`  T-MINUS ${i}...`, i<=3 ? 'warn':'sys');
      Sound.countdownBeep(i<=3);
      await wait(500);
    }
    printLine('SEQUENCE CANCELLED. THIS TERMINAL DOES NOT CONTROL LIVE SYSTEMS.', 'ok');
    printLine('...THE SHIP IS SAFE. GOOD ONE, THOUGH.', 'dim');
    printBlank();
  }

  function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function animateProgress(label, steps){
    const div = printLine('', 'sys');
    for(let i=0;i<=steps;i++){
      const pct = Math.round((i/steps)*100);
      const bars = '\u2588'.repeat(i) + '\u2591'.repeat(steps-i);
      div.textContent = `${label}: [${bars}] ${pct}%`;
      scrollBottom();
      await wait(35);
    }
  }

  /* ============================================================
     COMMAND ROUTER
  ============================================================ */
  async function runCommand(raw){
    const trimmed = raw.trim();
    if(!trimmed) return;
    printLine('> ' + trimmed, 'user');
    history.push(trimmed);
    histIdx = history.length;

    const lower = trimmed.toLowerCase();
    const [cmd, ...rest] = lower.split(' ');
    const arg = rest.join(' ');

    try{
      if(cmd === 'help' || cmd === '?'){ Sound.confirm(); await cmdHelp(); }
      else if(cmd === 'status'){ Sound.confirm(); await cmdStatus(); }
      else if(cmd === 'scan'){ Sound.confirm(); await cmdScan(); }
      else if(cmd === 'comm'){ Sound.confirm(); await cmdComm(arg); }
      else if(cmd === 'crew'){ Sound.confirm(); await cmdCrew(); }
      else if(cmd === 'stardate'){ Sound.confirm(); await cmdStardate(); }
      else if(cmd === 'library'){ Sound.confirm(); await cmdLibrary(); }
      else if(cmd === 'alert' || lower === 'red alert'){ Sound.confirm(); await cmdAlert(); }
      else if(cmd === 'clear' || cmd === 'cls'){ await cmdClear(); }
      else if(cmd === 'about'){ Sound.confirm(); await cmdAbout(); }
      else if(lower === 'self-destruct' || lower === 'self destruct' || lower === 'autodestruct'){
        Sound.error(); await cmdSelfDestruct();
      }
      else {
        Sound.error();
        printLine(`ERROR: COMMAND "${trimmed.toUpperCase()}" NOT RECOGNIZED.`, 'warn');
        printLine(`TYPE "HELP" FOR A LIST OF AVAILABLE COMMANDS.`, 'dim');
        printBlank();
      }
    }catch(e){
      Sound.error();
      printLine('ERROR: COMPUTER SUBROUTINE FAILURE.', 'warn');
    }
  }

  /* ============================================================
     SIDEBAR BUTTON WIRING
  ============================================================ */
  document.getElementById('sidebar').addEventListener('click', (e)=>{
    const btn = e.target.closest('.lc-btn');
    if(!btn) return;
    Sound.button();
    const cmd = btn.dataset.cmd;
    if(cmd === 'comm'){
      input.value = 'comm ';
      input.focus();
      return;
    }
    if(cmd === 'crew'){ runCommand('crew'); return; }
    if(cmd === 'alert'){ runCommand('alert'); return; }
    runCommand(cmd);
  });

  document.getElementById('sidebar').addEventListener('mouseover', (e)=>{
    if(e.target.closest('.lc-btn')) Sound.hover();
  });

  /* ============================================================
     INPUT WIRING
  ============================================================ */
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      if(history.length){
        histIdx = Math.max(0, histIdx-1);
        input.value = history[histIdx] || '';
        e.preventDefault();
      }
    } else if(e.key === 'ArrowDown'){
      if(history.length){
        histIdx = Math.min(history.length, histIdx+1);
        input.value = history[histIdx] || '';
        e.preventDefault();
      }
    } else if(e.key.length === 1){
      Sound.key();
    }
  });

  document.body.addEventListener('click', ()=>{ input.focus(); });

  /* ============================================================
     SOUND TOGGLE
  ============================================================ */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', ()=>{
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊 AUDIO ON' : '🔈 AUDIO OFF';
    soundToggle.setAttribute('aria-pressed', String(soundEnabled));
    if(!soundEnabled) stopAlertLoop();
    else if(alertActive) startAlertLoop();
    ensureCtx();
  });

  /* ============================================================
     BOOT SEQUENCE
  ============================================================ */
  async function boot(){
    printLine('LCARS OPERATING SYSTEM v2.7 — INITIALIZING...', 'sys');
    await wait(300);
    Sound.boot();
    await wait(500);
    printLine('LOADING SHIP SYSTEMS INTERFACE...', 'dim');
    await wait(350);
    printLine('LOADING SENSOR ARRAY...', 'dim');
    await wait(300);
    printLine('LOADING COMMUNICATIONS SUBSYSTEM...', 'dim');
    await wait(300);
    printLine('ALL SYSTEMS NOMINAL.', 'ok');
    printBlank();
    await typeLine('WELCOME. COMPUTER ACCESS TERMINAL READY.', 'title', 12);
    printLine('TYPE "HELP" TO VIEW AVAILABLE COMMANDS, OR SELECT A FUNCTION FROM THE PANEL.', 'dim');
    printBlank();
    input.focus();
  }

  // Unlock audio context on first user gesture (autoplay policies)
  function unlockAudio(){
    ensureCtx();
    window.removeEventListener('click', unlockAudio);
    window.removeEventListener('keydown', unlockAudio);
  }
  window.addEventListener('click', unlockAudio, {once:true});
  window.addEventListener('keydown', unlockAudio, {once:true});

  boot();

})();
</script>
</body>
</html>
