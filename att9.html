<script>
(function() {
  const stage = document.getElementById('stage');
  const img1 = document.getElementById('img1');
  const img2 = document.getElementById('img2');
  let busy = false;
  let audioCtx = null;

function getCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Prefer media playback route on iOS (ignores Silent switch)
    if (navigator.audioSession) {
      navigator.audioSession.type = 'playback';
    }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

  // iOS Safari will silently suspend a running AudioContext (e.g. on a
  // silent-switch flip, a notification, or just after a few seconds of
  // scheduling). Once suspended, ctx.currentTime stops advancing, so any
  // sounds scheduled relative to it get scheduled "in the past" and never
  // play. Call this before every leg of the sequence to make sure the
  // context is actually running before we schedule more audio.
  async function ensureRunning(ctx) {
    if (ctx.state !== 'running') {
      try { await ctx.resume(); } catch (e) {}
    }
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function crossfadeTo(showSecond) {
    img1.style.opacity = showSecond ? 0 : 1;
    img2.style.opacity = showSecond ? 1 : 0;
    img1.style.zIndex = showSecond ? 1 : 2;
    img2.style.zIndex = showSecond ? 2 : 1;
  }

  // ---------- low-level tone helpers ----------
  function tone(freq, start, dur, type, gainPeak, ctx) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(gainPeak, start + 0.008);
    gain.gain.setValueAtTime(gainPeak, start + dur - 0.02);
    gain.gain.linearRampToValueAtTime(0, start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
    return osc;
  }

  function noiseBurst(start, dur, gainPeak, bp, ctx) {
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(gainPeak, start + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    let node = src;
    if (bp) {
      const filter = ctx.createBiquadFilter();
      filter.type = bp.type || 'bandpass';
      filter.frequency.setValueAtTime(bp.freq, start);
      if (bp.endFreq) filter.frequency.linearRampToValueAtTime(bp.endFreq, start + dur);
      filter.Q.value = bp.Q || 1;
      src.connect(filter);
      filter.connect(gain);
    } else {
      src.connect(gain);
    }
    gain.connect(ctx.destination);
    src.start(start);
    src.stop(start + dur + 0.02);
  }

  // ---------- sound sequences ----------

  function playKeyClicks(ctx, startTime) {
    // rigid tactile plastic key clacks
    const count = 9;
    let t = startTime;
    for (let i = 0; i < count; i++) {
      const jitter = 0.03 + Math.random() * 0.09;
      noiseBurst(t, 0.02, 0.5, { type: 'bandpass', freq: 2200 + Math.random() * 800, Q: 3 }, ctx);
      tone(1400 + Math.random() * 300, t, 0.015, 'square', 0.15, ctx);
      t += jitter;
    }
    return t - startTime + 0.15;
  }

  function playCoinReturn(ctx, startTime) {
    // spring-loaded clink then clunk
    noiseBurst(startTime, 0.06, 0.5, { type: 'bandpass', freq: 3500, Q: 6 }, ctx);
    tone(2600, startTime, 0.08, 'triangle', 0.35, ctx);
    tone(1900, startTime + 0.04, 0.09, 'triangle', 0.25, ctx);
    const clunkT = startTime + 0.22;
    noiseBurst(clunkT, 0.12, 0.6, { type: 'lowpass', freq: 300 }, ctx);
    tone(120, clunkT, 0.18, 'sine', 0.5, ctx);
    tone(90, clunkT + 0.02, 0.2, 'sine', 0.4, ctx);
    return 0.55;
  }

  function playDialTone(ctx, startTime, dur) {
    tone(350, startTime, dur, 'sine', 0.12, ctx);
    tone(440, startTime, dur, 'sine', 0.12, ctx);
    return dur;
  }

  function playDTMF(ctx, startTime) {
    const pairs = [
      [697,1209],[770,1336],[852,1477],[697,1336],
      [941,1209],[770,1477],[852,1336],[697,1477]
    ];
    let t = startTime;
    pairs.forEach(([f1, f2]) => {
      tone(f1, t, 0.09, 'sine', 0.18, ctx);
      tone(f2, t, 0.09, 'sine', 0.18, ctx);
      t += 0.12;
    });
    return t - startTime;
  }

  function playRings(ctx, startTime) {
    const ringDur = 0.75;
    const gap = 0.35;
    let t = startTime;
    for (let i = 0; i < 2; i++) {
      tone(440, t, ringDur, 'sine', 0.2, ctx);
      tone(480, t, ringDur, 'sine', 0.2, ctx);
      t += ringDur + gap;
    }
    return t - startTime;
  }

  function playHandshake(ctx, startTime) {
    let t = startTime;
    // harsh electronic scream
    noiseBurst(t, 0.9, 0.35, { type: 'bandpass', freq: 1800, endFreq: 3200, Q: 8 }, ctx);
    tone(2200, t, 0.9, 'sawtooth', 0.06, ctx);
    t += 0.95;
    // alternating static / ding negotiation
    for (let i = 0; i < 5; i++) {
      noiseBurst(t, 0.09, 0.3, { type: 'bandpass', freq: 1200 + Math.random() * 1500, Q: 4 }, ctx);
      t += 0.11;
      tone(1800 + Math.random() * 900, t, 0.06, 'square', 0.15, ctx);
      t += 0.09;
    }
    // rushing waterfall
    noiseBurst(t, 0.8, 0.25, { type: 'lowpass', freq: 4000, endFreq: 1200 }, ctx);
    t += 0.85;
    return t - startTime;
  }

  let cachedVoices = [];
  function loadVoices() {
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) { resolve([]); return; }
      let voices = window.speechSynthesis.getVoices();
      if (voices.length) { resolve(voices); return; }
      window.speechSynthesis.onvoiceschanged = () => {
        resolve(window.speechSynthesis.getVoices());
      };
      // fallback in case the event never fires
      setTimeout(() => resolve(window.speechSynthesis.getVoices()), 500);
    });
  }

  function pickFemaleVoice(voices) {
    const nameHints = ['female', 'woman', 'samantha', 'victoria', 'zira', 'susan',
      'karen', 'moira', 'tessa', 'fiona', 'allison', 'ava', 'serena', 'kate',
      'google us english', 'microsoft zira'];
    const englishVoices = voices.filter(v => /^en/i.test(v.lang));
    const pool = englishVoices.length ? englishVoices : voices;
    let match = pool.find(v => nameHints.some(h => v.name.toLowerCase().includes(h)));
    if (match) return match;
    match = pool.find(v => /female/i.test(v.name));
    if (match) return match;
    return pool[0] || voices[0] || null;
  }

  // WebKit/iOS Safari has two well-known SpeechSynthesis bugs that both
  // look like "the speech cuts off partway through":
  //  1. If the SpeechSynthesisUtterance object isn't referenced from
  //     outside the executor function, it can get garbage-collected mid-
  //     utterance, silently stopping playback.
  //  2. Long-running or queued utterances can get auto-paused by the OS
  //     and never resume on their own.
  // Keeping a live reference and periodically nudging pause/resume works
  // around both.
  const liveUtterances = [];

  async function speak(text, opts) {
    if (!('speechSynthesis' in window)) return;
    if (!cachedVoices.length) cachedVoices = await loadVoices();
    // Clear any stuck queue from a previous run before starting a new one.
    window.speechSynthesis.cancel();
    return new Promise(resolve => {
      const utter = new SpeechSynthesisUtterance(text);
      const voice = pickFemaleVoice(cachedVoices);
      if (voice) utter.voice = voice;
      utter.rate = (opts && opts.rate) || 0.95;
      utter.pitch = (opts && opts.pitch) || 1.15;
      utter.volume = 1;
      liveUtterances.push(utter);

      const keepAlive = setInterval(() => {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }
      }, 4000);

      function cleanup(fn) {
        clearInterval(keepAlive);
        const idx = liveUtterances.indexOf(utter);
        if (idx !== -1) liveUtterances.splice(idx, 1);
        fn();
      }

      utter.onend = () => cleanup(resolve);
      utter.onerror = () => cleanup(resolve);
      window.speechSynthesis.speak(utter);
    });
  }

  function playErrorChirp(ctx, startTime) {
    let t = startTime;
    for (let rep = 0; rep < 2; rep++) {
      tone(950, t, 0.09, 'square', 0.25, ctx); t += 0.11;
      tone(700, t, 0.09, 'square', 0.25, ctx); t += 0.11;
      tone(500, t, 0.12, 'square', 0.25, ctx); t += 0.2;
    }
    return t - startTime;
  }

  async function playSequence() {
    const ctx = getCtx();

    // 1. Mechanical sounds: key clicks then coin return
    await ensureRunning(ctx);
    let t = ctx.currentTime + 0.05;
    const clicksDur = playKeyClicks(ctx, t);
    await wait(clicksDur * 1000);

    await ensureRunning(ctx);
    t = ctx.currentTime + 0.05;
    const coinDur = playCoinReturn(ctx, t);
    await wait(coinDur * 1000);

    // 2. Dial-up handshake
    await ensureRunning(ctx);
    t = ctx.currentTime + 0.05;
    const dialDur = playDialTone(ctx, t, 1.3);
    await wait(dialDur * 1000 + 150);

    await ensureRunning(ctx);
    t = ctx.currentTime + 0.02;
    const dtmfDur = playDTMF(ctx, t);
    await wait(dtmfDur * 1000 + 150);

    await ensureRunning(ctx);
    t = ctx.currentTime + 0.02;
    const ringDur = playRings(ctx, t);
    await wait(ringDur * 1000 + 150);

    await ensureRunning(ctx);
    t = ctx.currentTime + 0.02;
    const shakeDur = playHandshake(ctx, t);
    await wait(shakeDur * 1000);

    // sudden silence
    await wait(900);

    // 3. Digital audio prompts
    await speak("Please swipe your card now.");
    await wait(300);
    await speak("Thank you for using AT&T.");
    await wait(400);

    await ensureRunning(ctx);
    t = ctx.currentTime + 0.02;
    const errDur = playErrorChirp(ctx, t);
    await wait(errDur * 1000 + 300);
  }

stage.addEventListener('click', async () => {
  if (busy) return;
  busy = true;

  if (navigator.audioSession) {
    navigator.audioSession.type = 'playback';
  }

  crossfadeTo(true);
  await wait(700);
  try {
    await playSequence();
  } catch (e) {
    // fail silently
  }
  crossfadeTo(false);
  await wait(700);
  busy = false;
});
})();
</script>
</body>
</html>
