<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: an airmail-striped postcard preview with one control panel beside it (stacked on phones). The postcard itself is drawn on a canvas. */
:root{
  --bg:#e8edf2; --surface:#f7f9fb; --fg:#13202d; --muted:#4f5f6e; --line:#c7d1db;
  --red:#d6283e; --blue:#1d4fa0; --paper:#ffffff;
  --go:#0e7a3f; --go-fg:#ffffff; --focus:#1d4fa0;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d141c; --surface:#16202b; --fg:#e8eef4; --muted:#9db0c1; --line:#2a3846;
    --red:#ee4a5f; --blue:#6b97e8; --paper:#dfe6ed;
    --go:#32c274; --go-fg:#04210f; --focus:#8fb2f2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d141c; --surface:#16202b; --fg:#e8eef4; --muted:#9db0c1; --line:#2a3846;
  --red:#ee4a5f; --blue:#6b97e8; --paper:#dfe6ed;
  --go:#32c274; --go-fg:#04210f; --focus:#8fb2f2; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;
  background:var(--bg); color:var(--fg); font:16px/1.5 var(--body);
  padding-block:28px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1140px;margin:0 auto;display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.word{margin:0;font:400 2.1rem/1 var(--display);letter-spacing:.01em}
.tag{margin:0;color:var(--muted);min-width:0}
.frame{
  border:12px solid transparent;
  border-image:repeating-linear-gradient(135deg,var(--red) 0 16px,var(--paper) 16px 32px,var(--blue) 32px 48px,var(--paper) 48px 64px) 12;
  background:var(--paper);min-width:0;
}
canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:3/2}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px;display:grid;gap:16px;min-width:0;align-content:start;
}
.field{display:grid;gap:6px}
label{font:500 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select{
  appearance:none;-webkit-appearance:none;width:100%;min-height:50px;padding:0 44px 0 14px;
  font:500 1.05rem var(--body);color:var(--fg);background-color:var(--bg);
  border:1.5px solid var(--line);border-radius:10px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  font:600 1rem var(--body);min-height:50px;padding:0 16px;border-radius:10px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--fg);transition:background-color .15s,border-color .15s;
}
button:hover{border-color:var(--fg)}
.go{grid-column:1/-1;background:var(--go);color:var(--go-fg);border-color:var(--go);font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px}
.go:hover{border-color:var(--go);filter:brightness(1.08)}
.go svg{width:20px;height:20px;flex:none}
select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.status{margin:0;min-height:2.6em;font:400 .8rem/1.45 var(--mono);color:var(--muted)}
.hint{margin:0;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.72);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;width:min(560px,100%);max-height:100%;overflow:auto}
.sheet-in img{width:100%;height:auto;display:block;border:1px solid var(--line)}
.sheet-in p{margin:0;font-size:.95rem}
.sheet-row{display:flex;flex-wrap:wrap;gap:10px}
.sheet-row a,.sheet-row button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:10px;font:600 .95rem var(--body);text-decoration:none}
.sheet-row a{background:var(--go);color:var(--go-fg)}
@media (min-width:920px){
  .app{grid-template-columns:minmax(0,1fr) 300px;align-items:start;column-gap:28px}
  .top{grid-column:1/-1}
  .word{font-size:2.5rem}
}
@media (max-width:420px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="app">
  <header class="top">
    <h1 class="word">Postapp</h1>
    <p class="tag">Choose an animal, get a postcard, send it on WhatsApp.</p>
  </header>

  <div class="frame"><canvas id="card" width="1200" height="800" role="img" aria-label="Postcard"></canvas></div>

  <section class="panel" aria-label="Postcard controls">
    <div class="field">
      <label for="animal">Animal</label>
      <select id="animal"></select>
    </div>
    <div class="row">
      <button id="fact" type="button">Another fact</button>
      <button id="rand" type="button">Surprise me</button>
      <button id="send" type="button" class="go">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        Send on WhatsApp
      </button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="hint">Send opens your phone's share sheet with the postcard image attached. Choose WhatsApp, then pick the person you want from your WhatsApp contacts.</p>
  </section>
</main>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-msg">
  <div class="sheet-in">
    <img id="sheet-img" alt="Your finished postcard">
    <p id="sheet-msg"></p>
    <div class="sheet-row">
      <a id="sheet-wa" href="https://wa.me/?text=Postcard%20from%20Postapp" target="_blank" rel="noopener">Open WhatsApp</a>
      <button id="sheet-close" type="button">Close</button>
    </div>
  </div>
</div>

/* ---------- helpers ---------- */
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function lum(h){var n=parseInt(h.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;}
function rng(seed){return function(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};}
function paintArt(key,ctx,x,y,size){var prev=X;X=ctx;ctx.save();ctx.translate(x,y);ctx.scale(size/400,size/400);ART[key]();ctx.restore();X=prev;}
function silhouette(key,color){var c=mk(400,400),g=c.getContext('2d');paintArt(key,g,0,0,400);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,400,400);return c;}
function wrap(c,text,maxW){var words=text.split(' '),lines=[],line='',t,i;for(i=0;i<words.length;i++){t=line?line+' '+words[i]:words[i];if(c.measureText(t).width>maxW&&line){lines.push(line);line=words[i];}else line=t;}if(line)lines.push(line);return lines;}
function spacing(c,v){if('letterSpacing' in c)c.letterSpacing=v;}

  var ink=lum(a.bg)>0.55?'#1a1410':'#fff3d6';
  g.fillStyle=a.bg;g.fillRect(14,14,w-28,h-28);
  g.strokeStyle=ink;g.globalAlpha=.55;g.lineWidth=2;g.strokeRect(20,20,w-40,h-40);g.globalAlpha=1;
  g.drawImage(silhouette(a.k,ink),26,40,124,124);
  g.fillStyle=ink;g.textAlign='center';
  g.font='400 15px '+F_DISPLAY;g.fillText('POSTAPP',w/2,h-50);
  g.font='500 11px '+F_MONO;spacing(g,'2px');g.fillText('AIR MAIL',w/2,h-32);spacing(g,'0px');
  g.textAlign='left';g.font='400 22px '+F_DISPLAY;g.fillText('1',30,52);
  return s;
}

function badge(c,a,x,y,r){
  c.save();c.translate(x,y);
  c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;c.shadowOffsetY=6;
  c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fillStyle='#fffef9';c.fill();
  c.shadowColor='transparent';
  c.beginPath();c.arc(0,0,r-7,0,Math.PI*2);c.fillStyle=a.bg;c.fill();
  c.save();c.beginPath();c.arc(0,0,r-8,0,Math.PI*2);c.clip();
  c.beginPath();c.arc(0,0,r-8,0,Math.PI*2);c.fillStyle=a.sun;c.globalAlpha=.35;c.fill();c.globalAlpha=1;
  paintArt(a.k,c,-(r-7)*1.02,-(r-7)*1.02,(r-7)*2.04);
  c.restore();
  c.setLineDash([3,5]);c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.arc(0,0,r-12,0,Math.PI*2);c.stroke();c.setLineDash([]);
  c.restore();
}

/* ---------- compose one postcard ---------- */
var cv=document.getElementById('card'),ctx=cv.getContext('2d');
function draw(a,fi){
  var c=ctx,i,fact=a.f[fi%a.f.length];
  c.save();c.clearRect(0,0,W,H);
  c.fillStyle='#fbf9f4';rr(c,0,0,W,H,26);c.fill();
  c.save();rr(c,36,36,1128,728,14);c.clip();
  c.fillStyle=a.bg;c.fillRect(0,0,W,H);
  /* sun, rings and sparkles */
  c.fillStyle=a.sun;c.globalAlpha=.9;c.beginPath();c.arc(390,470,262,0,7);c.fill();c.globalAlpha=1;
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=3;
  c.beginPath();c.arc(390,470,300,0,7);c.stroke();c.beginPath();c.arc(390,470,336,0,7);c.stroke();
  var r=rng(a.k.charCodeAt(0)*131+a.k.length*17);
  for(i=0;i<16;i++){c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.arc(70+r()*620,250+r()*330,2+r()*4,0,7);c.fill();}
  for(i=0;i<7;i++){c.save();c.translate(80+r()*600,240+r()*330);var sc=.7+r()*.9;c.scale(sc,sc);c.fillStyle='rgba(255,255,255,.55)';c.fill(new Path2D('M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z'));c.restore();}
  /* ground */
  c.fillStyle=a.ground;c.fill(new Path2D('M36 660 Q200 624 380 654 T700 650 T1030 656 T1164 640 L1164 764 L36 764 Z'));
  c.fillStyle='rgba(255,255,255,.12)';c.fill(new Path2D('M36 700 Q300 676 560 700 T1164 690 L1164 764 L36 764 Z'));
  /* eyebrow + title (behind the animal) */
  var dark=lum(a.bg)>0.55,tc=dark?'#1a1410':'#fffaf0';
  c.fillStyle=tc;c.textBaseline='alphabetic';c.textAlign='left';
  c.font='500 25px '+F_MONO;spacing(c,'4px');c.fillText(('GREETINGS FROM '+a.h).toUpperCase(),84,112);spacing(c,'0px');
  var name=a.n.toUpperCase(),size=118;c.font='400 '+size+'px '+F_DISPLAY;
  var tw=c.measureText(name).width;if(tw>800){size=Math.floor(size*800/tw);c.font='400 '+size+'px '+F_DISPLAY;}
  c.fillStyle='rgba(0,0,0,.26)';c.fillText(name,88,222);
  c.fillStyle=tc;c.fillText(name,84,217);
  /* the animal */
  paintArt(a.k,c,140,224,500);
  c.restore();
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=3;rr(c,50,50,1100,700,8);c.stroke();
  c.fillStyle='rgba(255,255,255,.85)';c.font='500 17px '+F_MONO;spacing(c,'5px');c.textAlign='left';c.fillText('PAR AVION  ·  AIR MAIL',84,732);spacing(c,'0px');

  /* stamp */
  var st=stampCanvas(a);
  c.save();c.translate(1042,172);c.rotate(.06);c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=12;c.shadowOffsetY=5;c.drawImage(st,-88,-108);c.restore();
  /* postmark */
  var ds=dateStamp();
  c.save();c.strokeStyle='rgba(22,26,44,.62)';c.fillStyle='rgba(22,26,44,.62)';c.lineWidth=3.5;
  c.beginPath();c.arc(962,268,56,0,7);c.stroke();c.lineWidth=2;c.beginPath();c.arc(962,268,46,0,7);c.stroke();
  c.textAlign='center';c.font='500 14px '+F_MONO;c.fillText('POSTAPP',962,255);c.fillText(ds.day,962,274);c.fillText(ds.year,962,293);
  c.lineWidth=3.5;
  for(i=0;i<4;i++){var yy=240+i*17;c.beginPath();c.moveTo(1018,yy);c.bezierCurveTo(1044,yy-10,1062,yy+10,1088,yy);c.bezierCurveTo(1108,yy-8,1126,yy+8,1148,yy);c.stroke();}
  c.restore();

  /* fact card */
  var cw=440,fsz=40,lines,lh;
  do{c.font='700 '+fsz+'px '+F_HAND;lines=wrap(c,fact,cw-92);fsz-=2;}while(lines.length>5&&fsz>28);
  lh=Math.round((fsz+2)*1.2);
  var ch=74+lines.length*lh+78,cx=700,cy=708-ch;
  c.save();c.translate(cx+cw/2,cy+ch/2);c.rotate(-.022);
  c.shadowColor='rgba(0,0,0,.32)';c.shadowBlur=22;c.shadowOffsetY=10;
  c.fillStyle='#fffef9';c.fillRect(-cw/2,-ch/2,cw,ch);
  c.shadowColor='transparent';
  c.strokeStyle='rgba(60,100,170,.22)';c.lineWidth=2;
  for(i=0;i<lines.length;i++){var ly=-ch/2+74+i*lh+10;c.beginPath();c.moveTo(-cw/2+26,ly);c.lineTo(cw/2-26,ly);c.stroke();}
  c.fillStyle='#6a7685';c.font='500 15px '+F_MONO;spacing(c,'3px');c.textAlign='left';c.fillText('DID YOU KNOW?',-cw/2+52,-ch/2+44);spacing(c,'0px');
  c.fillStyle='#21408f';c.font='700 '+(fsz+2)+'px '+F_HAND;
  for(i=0;i<lines.length;i++)c.fillText(lines[i],-cw/2+52,-ch/2+74+i*lh);
  c.fillStyle='#c4283f';c.font='700 36px '+F_HAND;c.textAlign='right';c.fillText('Wish you were here!',cw/2-30,ch/2-26);
  c.fillStyle='rgba(236,214,140,.82)';
  c.save();c.translate(-cw/2+60,-ch/2+2);c.rotate(-.18);c.fillRect(-46,-14,92,28);c.restore();
  c.save();c.translate(cw/2-60,-ch/2+2);c.rotate(.16);c.fillRect(-46,-14,92,28);c.restore();
  c.restore();
  /* badge pinned to the card corner */
  badge(c,a,cx-28,cy+20,58);
  c.restore();
}

/* ---------- app state and UI ---------- */
var sel=document.getElementById('animal'),statusEl=document.getElementById('status');
var cur=null,fi=0,blobP=null,i0;
for(i0=0;i0<ANIMALS.length;i0++){var o=document.createElement('option');o.value=ANIMALS[i0].k;o.textContent=ANIMALS[i0].n;sel.appendChild(o);}
function byKey(k){return ANIMALS.filter(function(a){return a.k===k;})[0];}
function setStatus(t){statusEl.textContent=t||'';}
function render(){
  draw(cur,fi);
  cv.setAttribute('aria-label','Postcard of a '+cur.n.toLowerCase()+'. '+cur.f[fi%cur.f.length]);
  blobP=new Promise(function(res){cv.toBlob(res,'image/png');});
}
function pick(k,keepFact){
  cur=byKey(k);sel.value=k;
  if(!keepFact)fi=Math.floor(Math.random()*cur.f.length);
  render();
}
sel.addEventListener('change',function(){setStatus('');pick(sel.value);});
document.getElementById('fact').addEventListener('click',function(){setStatus('');fi=(fi+1)%cur.f.length;render();});
document.getElementById('rand').addEventListener('click',function(){
  var k;do{k=ANIMALS[Math.floor(Math.random()*ANIMALS.length)].k;}while(k===cur.k);
  setStatus('');pick(k);
});

/* ---------- send ---------- */
var sheet=document.getElementById('sheet'),sheetImg=document.getElementById('sheet-img'),sheetMsg=document.getElementById('sheet-msg'),sheetClose=document.getElementById('sheet-close'),lastFocus=null,sheetUrl=null;
function showSheet(blob,copied,opened){
  if(sheetUrl)URL.revokeObjectURL(sheetUrl);
  sheetUrl=URL.createObjectURL(blob);sheetImg.src=sheetUrl;
  if(copied&&opened)sheetMsg.textContent='The postcard is copied. In WhatsApp, choose a contact, then paste with Ctrl+V or ⌘V.';
  else if(copied)sheetMsg.textContent='The postcard is copied. Open WhatsApp, choose a contact, then paste with Ctrl+V or ⌘V.';
  else sheetMsg.textContent='Save the postcard (press and hold the image, or right-click it), then open WhatsApp, choose a contact and attach it.';
  lastFocus=document.activeElement;sheet.hidden=false;sheetClose.focus();
}
function hideSheet(){sheet.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
sheetClose.addEventListener('click',hideSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)hideSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)hideSheet();});

document.getElementById('send').addEventListener('click',async function(){
  var blob=await blobP;
  if(!blob){setStatus('The image could not be created. Try again.');return;}
  var file=new File([blob],'postapp-'+cur.k+'.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Postcard from Postapp',text:'Greetings from '+cur.h+'!'});
      setStatus('Postcard shared.');
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError'){setStatus('Share cancelled. Nothing was sent.');return;}
  }
  var copied=false,opened=false;
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copied=true;}catch(e){}
  try{opened=!!window.open('https://wa.me/?text='+encodeURIComponent('Postcard from Postapp'),'_blank','noopener');}catch(e){}
  setStatus('This browser cannot attach the image for you. Follow the steps shown on screen.');
  showSheet(blob,copied,opened);
});

/* first paint, then repaint once the web fonts are ready */
var fonts=[ '118px "Bowlby One"','500 25px "DM Mono"','700 40px Caveat' ];
pick('fox');
if(document.fonts&&document.fonts.load){Promise.all(fonts.map(function(f){return document.fonts.load(f);})).then(function(){render();},function(){});}
window.Postapp={animals:ANIMALS,pick:pick,render:render,canvas:cv};
})();
</script>
