<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yacht View — A Porthole to the Sea</title>
<style>
  :root{
    --brass: #c9a15a;
    --brass-light: #ecd49b;
    --wood: #3a1f14;
    --cream: #f6ecd9;
    --gold-deep: #b9822f;
    --sky-top: #0b3d78;
    --sky-mid: #2f77c2;
    --sky-horizon: #bcd9ee;
    --sea-top: #0f6fa8;
    --sea-mid: #0a4a7a;
    --sea-deep: #041f38;
    --seabed: #0a2e1c;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    min-height:100%;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:
      radial-gradient(1200px 800px at 50% -10%, #fff6e4 0%, transparent 60%),
      linear-gradient(180deg, #fdf3df 0%, #f3e2bc 45%, #e8cd94 100%);
    color:#3a2a17;
  }

  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 16px 24px;
    min-height:100vh;
  }

  .masthead{
    text-align:center;
    margin-bottom:18px;
  }
  .masthead .eyebrow{
    letter-spacing:.32em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold-deep);
    font-family: Georgia, serif;
    margin:0 0 6px;
  }
  .masthead h1{
    margin:0;
    font-size: clamp(28px, 6vw, 44px);
    font-weight:400;
    letter-spacing:.02em;
    color:#3a2213;
  }
  .masthead h1 em{
    font-style:italic;
    color:var(--gold-deep);
  }
  .masthead p{
    margin:8px 0 0;
    font-size:14px;
    color:#7a5c34;
    max-width:420px;
  }

  .cabin{
    position:relative;
    width:min(92vw, 430px);
    aspect-ratio: 720 / 1280;
    border-radius: 18px;
    overflow:hidden;
    box-shadow:
      0 30px 60px -20px rgba(50,30,10,.45),
      0 4px 18px rgba(50,30,10,.25);
  }

  .cabin-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* ---- The porthole "screen": positioned & sized to sit exactly inside the
         black glass of the photographed porthole, then clipped to an ellipse ---- */
  .porthole-view{
    position:absolute;
    left:23.5%;
    top:27.3%;
    width:56%;
    height:35%;
    border-radius:50%;
    overflow:hidden;
    box-shadow: inset 0 0 22px 6px rgba(0,0,0,.65);
  }

  .sky, .sea{
    position:absolute;
    left:0; width:100%;
  }
  .sky{
    top:0; height:52%;
    background:
      radial-gradient(circle at 78% 28%, rgba(255,244,214,.95) 0%, rgba(255,229,163,.55) 8%, rgba(255,229,163,0) 22%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-horizon) 100%);
  }
  .sun{
    position:absolute;
    left:78%; top:26%;
    width:13%; height:13%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle, #fff9e6 0%, #ffe28a 55%, rgba(255,226,138,0) 75%);
    filter: blur(.4px);
  }
  .sea{
    bottom:0; top:auto; height:52%;
    background: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-mid) 45%, var(--sea-deep) 88%, var(--seabed) 100%);
  }
  .horizon-glint{
    position:absolute;
    left:0; top:47%;
    width:100%; height:6%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    mix-blend-mode: screen;
    animation: shimmer 5s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%,100%{ opacity:.55; }
    50%{ opacity:.9; }
  }
  .waves{
    position:absolute;
    left:-10%; top:49.5%;
    width:120%; height:8%;
    background-repeat: repeat-x;
    background-size: 60px 100%;
    background-image: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%);
    opacity:.5;
    animation: waveScroll 6s linear infinite;
  }
  @keyframes waveScroll{
    from{ background-position-x:0; }
    to{ background-position-x:-240px; }
  }
  .seabed-floor{
    position:absolute;
    left:0; bottom:0;
    width:100%; height:9%;
    background: linear-gradient(180deg, rgba(10,25,15,0) 0%, rgba(6,18,10,.85) 100%);
  }

  .creatures{ position:absolute; inset:0; }
  .swim-outer{
    position:absolute;
    animation-name: swimAcross;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: left;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  @keyframes swimAcross{
    from{ left:-14%; }
    to{ left:114%; }
  }
  .swim-outer.reverse{
    animation-name: swimAcrossReverse;
  }
  @keyframes swimAcrossReverse{
    from{ left:114%; }
    to{ left:-14%; }
  }
  .swim-inner{
    display:inline-block;
    animation-name: bobY;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  @keyframes bobY{
    from{ margin-top:-3px; }
    to{ margin-top:3px; }
  }
  .flip{ transform: scaleX(-1); }

  /* rain overlay */
  .rain-layer{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity .6s ease;
    background: linear-gradient(180deg, rgba(150,170,190,.12), rgba(90,110,130,.22));
  }
  .rain-layer.active{ opacity:1; }
  .drop{
    position:absolute;
    top:-10%;
    width:1.5px;
    height:14%;
    background: linear-gradient(180deg, rgba(220,235,250,0), rgba(220,235,250,.75));
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes fall{
    from{ transform: translateY(-20%); }
    to{ transform: translateY(650%); }
  }
  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .rain-layer.active .flash{
    animation: lightning 8s ease-in-out infinite;
  }
  @keyframes lightning{
    0%, 92%, 100%{ opacity:0; }
    93%{ opacity:.5; }
    94%{ opacity:0; }
    95%{ opacity:.35; }
    96%{ opacity:0; }
  }

  .glass-sheen{
    position:absolute; inset:0;
    background: linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 22%, rgba(255,255,255,0) 78%, rgba(255,255,255,.08) 100%);
    pointer-events:none;
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    gap:14px;
    margin-top:22px;
  }
  .ctrl-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:999px;
    border:1px solid var(--brass);
    background: linear-gradient(180deg, #fffaf0, #f0ddb2);
    color:#4a350f;
    font-family: Georgia, serif;
    font-size:13px;
    letter-spacing:.04em;
    cursor:pointer;
    box-shadow: 0 2px 6px rgba(90,60,10,.18), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .15s ease, box-shadow .15s ease, background .3s ease;
  }
  .ctrl-btn:hover{ transform: translateY(-1px); }
  .ctrl-btn:active{ transform: translateY(0); }
  .ctrl-btn .icon{ font-size:16px; }
  .ctrl-btn[aria-pressed="true"]{
    background: linear-gradient(180deg, #2f77c2, #0b3d78);
    color:#fff8ea;
    border-color:#0b3d78;
    box-shadow: 0 2px 10px rgba(11,61,120,.4), inset 0 1px 0 rgba(255,255,255,.2);
  }
  #rainBtn[aria-pressed="true"]{
    background: linear-gradient(180deg, #5a6b78, #2c3944);
    border-color:#2c3944;
  }

  .brand-link{
    margin-top:20px;
    font-size:13px;
    letter-spacing:.03em;
    color: var(--gold-deep);
    text-decoration:none;
    border-bottom:1px solid rgba(185,130,47,.4);
    padding-bottom:2px;
    transition: color .2s ease, border-color .2s ease;
  }
  .brand-link:hover{
    color:#8a5c17;
    border-color:#8a5c17;
  }

  footer{
    margin-top:10px;
    font-size:11px;
    color:#a4885d;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .swim-outer, .swim-inner, .waves, .horizon-glint, .drop{ animation: none !important; }
  }
</style>
</head>

    <div class="porthole-view" id="portholeView">
      <div class="sky">
        <div class="sun"></div>
      </div>
      <div class="sea"></div>
      <div class="horizon-glint"></div>
      <div class="waves"></div>
      <div class="seabed-floor"></div>
      <div class="creatures" id="creatures"></div>
      <div class="rain-layer" id="rainLayer">
        <div class="flash"></div>
        <div class="drops" id="drops"></div>
      </div>
      <div class="glass-sheen"></div>
    </div>
  </div>

  <div class="controls">
    <button id="soundBtn" class="ctrl-btn" aria-pressed="false">
      <span class="icon">🔈</span><span class="label">Sea sound</span>
    </button>
    <button id="rainBtn" class="ctrl-btn" aria-pressed="false">
      <span class="icon">🌦️</span><span class="label">Rain</span>
    </button>
  </div>

</div>

<script>
(function(){
  // ---------- Emoji scene population ----------
  // Underwater creatures now swim right-to-left, so no flip is needed
  // (the emoji artwork already faces left, which now matches travel direction).
  var seaCreatures = [
    ["🐠", false], ["🐟", false], ["🐡", false], ["🪼", false], ["🐙", false],
    ["🐬", false], ["🐋", false], ["🐢", false], ["🦈", false], ["🪸", false],
    ["🌿", false], ["🏺", false], ["🪙", false], ["⚓", false], ["🐚", false],
    ["🦪", false], ["🦀", false], ["🦞", false], ["🧜‍♀️", false], ["🧜‍♂️", false],
    ["🦑", false], ["🏴‍☠️", false]
  ];
  // High sky: still drifts left-to-right, well above the waterline.
  var highSky = [
    ["☀️", false], ["☁️", false], ["🦅", true], ["⭐", false]
  ];
  // Surface-level traffic: boats, island, volcano, duck, swimmer — kept right
  // at the horizon band rather than up in the sky, moving left-to-right.
  var horizonLevel = [
    ["🛥️", true], ["🏝️", false], ["🦆", true], ["⛵", true], ["🛳️", true],
    ["⛴️", true], ["🚤", true], ["🛶", true], ["🚣", true], ["🏊‍♀️", true],
    ["🌋", false]
  ];

  var container = document.getElementById('creatures');

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function spawnOne(item, top, duration, sizeMin, sizeMax, reverse){
    var emoji = item[0], flip = item[1];
    var outer = document.createElement('span');
    outer.className = 'swim-outer' + (reverse ? ' reverse' : '');
    outer.style.top = top + '%';
    var size = sizeMin + Math.random() * (sizeMax - sizeMin);
    outer.style.fontSize = size + 'px';
    outer.style.animationDuration = duration + 's';
    outer.style.animationIterationCount = '1';
    outer.style.animationFillMode = 'forwards';

    var inner = document.createElement('span');
    inner.className = 'swim-inner' + (flip ? ' flip' : '');
    var bobDur = 2.2 + Math.random() * 2;
    inner.style.animationDuration = bobDur + 's';
    inner.style.animationDelay = (-Math.random() * bobDur) + 's';
    inner.textContent = emoji;

    outer.appendChild(inner);
    container.appendChild(outer);
    outer.addEventListener('animationend', function(){ outer.remove(); });
  }

  // Sends emoji across the porthole one at a time, then waits before the
  // next one so the scene reads as a calm, uncluttered procession.
  function makeScheduler(list, zoneRows, sizeMin, sizeMax, durMin, durMax, gapMin, gapMax, startDelay, reverse){
    var queue = shuffle(list.slice());
    function nextOne(){
      if (queue.length === 0) queue = shuffle(list.slice());
      var item = queue.shift();
      var top = zoneRows[Math.floor(Math.random() * zoneRows.length)];
      var duration = durMin + Math.random() * (durMax - durMin);
      spawnOne(item, top, duration, sizeMin, sizeMax, reverse);
      var gap = gapMin + Math.random() * (gapMax - gapMin);
      setTimeout(nextOne, (duration + gap) * 1000);
    }
    setTimeout(nextOne, startDelay);
  }

  makeScheduler(highSky, [8, 18, 28], 28, 40, 10, 15, 1, 2.4, 300, false);
  makeScheduler(horizonLevel, [39, 43, 47], 26, 38, 10, 15, 1, 2.4, 900, false);
  makeScheduler(seaCreatures, [56, 68, 80, 90], 30, 44, 10, 16, 1, 2.4, 1600, true);

  // ---------- Rain drops (visual) ----------
  var dropsEl = document.getElementById('drops');
  var dropFrag = document.createDocumentFragment();
  for (var i = 0; i < 46; i++){
    var d = document.createElement('span');
    d.className = 'drop';
    d.style.left = (Math.random() * 100) + '%';
    var dur = 0.6 + Math.random() * 0.7;
    d.style.animationDuration = dur + 's';
    d.style.animationDelay = (-Math.random() * dur) + 's';
    d.style.opacity = (0.4 + Math.random() * 0.5).toFixed(2);
    dropFrag.appendChild(d);
  }
  dropsEl.appendChild(dropFrag);

  // ---------- Audio: synthesized wave & rain sound ----------
  var audioCtx = null, waveMaster, rainMaster, waveFilter, lfo, started = false;

  function makeNoiseBuffer(ctx, seconds, brown){
    var bufferSize = Math.floor(ctx.sampleRate * seconds);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var lastOut = 0;
    for (var i = 0; i < bufferSize; i++){
      var white = Math.random() * 2 - 1;
      if (brown){
        lastOut = (lastOut + 0.02 * white) / 1.02;
        data[i] = lastOut * 3.2;
      } else {
        data[i] = white;
      }
    }
    return buffer;
  }

  function initAudio(){
    if (started) return;
    started = true;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- waves: filtered brown noise with a slow-sweeping cutoff for swell ---
    var waveSource = audioCtx.createBufferSource();
    waveSource.buffer = makeNoiseBuffer(audioCtx, 4, true);
    waveSource.loop = true;

    waveFilter = audioCtx.createBiquadFilter();
    waveFilter.type = 'lowpass';
    waveFilter.frequency.value = 500;
    waveFilter.Q.value = 0.6;

    lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.12;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 260;
    lfo.connect(lfoGain);
    lfoGain.connect(waveFilter.frequency);
    lfo.start();

    waveMaster = audioCtx.createGain();
    waveMaster.gain.value = 0;

    waveSource.connect(waveFilter);
    waveFilter.connect(waveMaster);
    waveMaster.connect(audioCtx.destination);
    waveSource.start();

    // --- rain: bandpass white noise for a soft hiss ---
    var rainSource = audioCtx.createBufferSource();
    rainSource.buffer = makeNoiseBuffer(audioCtx, 3, false);
    rainSource.loop = true;

    var rainFilter = audioCtx.createBiquadFilter();
    rainFilter.type = 'bandpass';
    rainFilter.frequency.value = 3200;
    rainFilter.Q.value = 0.5;

    rainMaster = audioCtx.createGain();
    rainMaster.gain.value = 0;

    rainSource.connect(rainFilter);
    rainFilter.connect(rainMaster);
    rainMaster.connect(audioCtx.destination);
    rainSource.start();
  }

  function rampGain(node, target, time){
    if (!node) return;
    var now = audioCtx.currentTime;
    node.gain.cancelScheduledValues(now);
    node.gain.setTargetAtTime(target, now, time || 0.8);
  }

  // ---------- Toggle buttons ----------
  var soundBtn = document.getElementById('soundBtn');
  var rainBtn = document.getElementById('rainBtn');
  var rainLayer = document.getElementById('rainLayer');
  var soundOn = false, rainOn = false;

  soundBtn.addEventListener('click', function(){
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.querySelector('.icon').textContent = soundOn ? '🔊' : '🔈';
    rampGain(waveMaster, soundOn ? (rainOn ? 0.5 : 0.38) : 0, 1.2);
  });

  rainBtn.addEventListener('click', function(){
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    rainOn = !rainOn;
    rainBtn.setAttribute('aria-pressed', rainOn);
    rainBtn.querySelector('.icon').textContent = rainOn ? '🌧️' : '🌦️';
    rainLayer.classList.toggle('active', rainOn);
    rampGain(rainMaster, rainOn ? 0.16 : 0, 1.0);
    if (soundOn){
      rampGain(waveMaster, rainOn ? 0.5 : 0.38, 1.2);
    }
  });
})();
</script>
