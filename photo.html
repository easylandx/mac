<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Booth — Insert Coin & Smile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fdf6e6;
    --cream-2: #f7ecd0;
    --curtain: #b23b3b;
    --curtain-dark: #8f2c2c;
    --gold: #d4a017;
    --gold-light: #f0c75e;
    --ink: #2b2118;
    --brown: #6b4a2b;
    --film: #221a14;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #fffaf0 0%, var(--cream) 45%, var(--cream-2) 100%);
    font-family:'DM Sans', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  /* ---------- Bulb border marquee ---------- */
  .marquee{
    text-align:center;
    padding:34px 20px 10px;
    position:relative;
  }
  .marquee h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.6rem, 7vw, 4.6rem);
    letter-spacing:0.08em;
    margin:0;
    color:var(--curtain);
    text-shadow: 3px 3px 0 var(--gold-light), 5px 5px 0 rgba(43,33,24,0.15);
  }
  .marquee p{
    font-family:'Special Elite', monospace;
    font-size:0.95rem;
    color:var(--brown);
    margin:6px 0 0;
    letter-spacing:0.04em;
  }
  .bulbs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:14px auto 0;
    max-width:520px;
    flex-wrap:wrap;
  }
  .bulb{
    width:10px;height:10px;border-radius:50%;
    background: var(--gold-light);
    box-shadow: 0 0 8px 2px rgba(240,199,94,0.9);
    animation: twinkle 1.6s infinite ease-in-out;
  }
  .bulb:nth-child(odd){ animation-delay:0.4s; background:#ffdb8a;}
  .bulb:nth-child(3n){ animation-delay:0.8s; }
  @keyframes twinkle{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  /* ---------- Stage ---------- */
  .stage-wrap{
    display:flex;
    justify-content:center;
    padding: 20px 16px 60px;
  }

  .booth{
    position:relative;
    width:min(560px, 94vw);
    background: linear-gradient(180deg, var(--curtain) 0%, var(--curtain-dark) 100%);
    border-radius: 18px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(43,33,24,0.45),
      inset 0 0 0 3px rgba(212,160,23,0.6);
  }

  .booth::before{
    /* curtain fold texture */
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    background-image: repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.08) 0px,
      rgba(0,0,0,0.08) 2px,
      transparent 2px,
      transparent 26px
    );
    pointer-events:none;
  }

  .screen{
    position:relative;
    background: var(--film);
    border-radius:10px;
    padding: 14px;
    box-shadow: inset 0 0 0 6px var(--gold), inset 0 0 0 9px #3a2c1c;
  }

  .viewfinder{
    position:relative;
    width:100%;
    max-width:340px;
    margin:0 auto;
    aspect-ratio: 3/4;
    background:#111;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .viewfinder video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1); /* mirror like a real booth */
    filter: grayscale(1) contrast(1.08) brightness(1.02);
    display:block;
  }

  .viewfinder .placeholder{
    color:#cbb98a;
    font-family:'Special Elite', monospace;
    font-size:0.95rem;
    text-align:center;
    padding: 0 24px;
    line-height:1.5;
  }

  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .flash.on{
    animation: flashPop 0.35s ease-out;
  }
  @keyframes flashPop{
    0%{ opacity:0.95; }
    100%{ opacity:0; }
  }

  .countdown{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size:6rem;
    color:#fff;
    text-shadow: 0 0 20px rgba(0,0,0,0.6);
    pointer-events:none;
    opacity:0;
  }
  .countdown.show{
    animation: countPulse 0.9s ease-out;
  }
  @keyframes countPulse{
    0%{ opacity:0; transform:scale(1.6); }
    30%{ opacity:1; transform:scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }

  .shot-dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
  }
  .shot-dots span{
    width:12px; height:12px; border-radius:50%;
    background: #5a4632;
    border: 2px solid var(--gold);
    transition: background 0.25s ease;
  }
  .shot-dots span.filled{ background: var(--gold-light); }

  .status-line{
    text-align:center;
    color: var(--gold-light);
    font-family:'Special Elite', monospace;
    font-size:0.85rem;
    margin-top:10px;
    min-height:1.2em;
    letter-spacing:0.03em;
  }

  /* ---------- Coin mechanism ---------- */
  .coin-panel{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:18px;
    flex-wrap:wrap;
  }

  .coin-slot-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .slot{
    width:64px;
    height:20px;
    background:#1c140c;
    border-radius:4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.7), 0 1px 0 rgba(255,255,255,0.15);
    position:relative;
    overflow:visible;
  }

  .coin{
    position:absolute;
    left:50%;
    top:-40px;
    width:28px; height:28px;
    margin-left:-14px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff2b8, var(--gold) 60%, #a3760f 100%);
    box-shadow: 0 0 0 2px #7a560b inset;
    opacity:0;
  }
  .coin.dropping{
    animation: coinDrop 0.55s cubic-bezier(.55,0,1,.45) forwards;
  }
  @keyframes coinDrop{
    0%{ opacity:1; top:-40px; transform: rotate(0deg); }
    85%{ opacity:1; top:6px; transform: rotate(200deg); }
    100%{ opacity:0; top:10px; transform: rotate(220deg); }
  }

  .slot-label{
    font-family:'Special Elite', monospace;
    color: var(--gold-light);
    font-size:0.7rem;
    letter-spacing:0.06em;
  }

  button{
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    border-radius: 999px;
    padding: 13px 28px;
    font-size:0.95rem;
    letter-spacing:0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  button:not(:disabled):hover{
    transform: translateY(-2px);
  }
  button:not(:disabled):active{
    transform: translateY(0px) scale(0.98);
  }

  .btn-coin{
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#3a2c1c;
    box-shadow: 0 6px 0 #8a660f, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn-coin:not(:disabled):active{ box-shadow: 0 3px 0 #8a660f; }

  .btn-start{
    background: linear-gradient(180deg, #fff, var(--cream));
    color: var(--curtain-dark);
    box-shadow: 0 6px 0 #b8a165, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn-start:not(:disabled):active{ box-shadow: 0 3px 0 #b8a165; }

  .btn-save{
    background: linear-gradient(180deg, var(--curtain), var(--curtain-dark));
    color: #fff8e7;
    box-shadow: 0 6px 0 #6e2020, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn-save:not(:disabled):active{ box-shadow: 0 3px 0 #6e2020; }

  .btn-again{
    background:transparent;
    color: var(--gold-light);
    border: 2px solid var(--gold-light);
    box-shadow:none;
    padding: 11px 24px;
  }

  /* ---------- Strip output ---------- */
  .strip-outlet{
    display:flex;
    justify-content:center;
    margin-top:26px;
  }

  .strip-slot{
    width: 90%;
    max-width:220px;
    height:14px;
    background:#140d08;
    border-radius:3px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
    margin: 0 auto;
  }

  .strip-wrap{
    display:flex;
    justify-content:center;
    margin-top: -6px;
    perspective: 800px;
  }

  #stripCanvas{
    max-width: 240px;
    width:100%;
    height:auto;
    border-radius: 2px;
    box-shadow: 0 18px 30px -10px rgba(0,0,0,0.5);
    transform-origin: top center;
    opacity:0;
    transform: translateY(-30px) rotate(0deg);
  }
  #stripCanvas.printed{
    animation: printOut 1.1s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes printOut{
    0%{ opacity:0; transform: translateY(-40px) rotate(-1deg); }
    60%{ opacity:1; }
    100%{ opacity:1; transform: translateY(0) rotate(1.2deg); }
  }

  .actions-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:20px;
    flex-wrap:wrap;
  }

  footer{
    text-align:center;
    padding: 10px 20px 40px;
    font-family:'Special Elite', monospace;
    font-size:0.78rem;
    color: var(--brown);
    letter-spacing:0.03em;
  }
  footer a{ color:var(--curtain); text-decoration:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="marquee">
    <h1>★ PHOTO BOOTH ★</h1>
    <p>insert coin — strike a pose — take it home</p>
    <div class="bulbs">
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
      <div class="bulb"></div><div class="bulb"></div>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="booth">
      <div class="screen">
        <div class="viewfinder" id="viewfinder">
          <div class="placeholder" id="placeholder">Insert a coin to wake up the camera…</div>
          <video id="video" autoplay playsinline muted></video>
          <div class="flash" id="flash"></div>
          <div class="countdown" id="countdown"></div>
        </div>
        <div class="shot-dots" id="shotDots">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="status-line" id="statusLine">insert coin to begin</div>
      </div>

      <div class="coin-panel">
        <div class="coin-slot-unit">
          <div class="slot">
            <div class="coin" id="coin"></div>
          </div>
          <div class="slot-label">COIN</div>
        </div>
        <button class="btn-coin" id="insertBtn">🪙 Insert Coin</button>
        <button class="btn-start" id="startBtn" disabled>▶ Take Photos</button>
      </div>
    </div>
  </div>

  <div class="strip-outlet" id="stripOutlet" style="display:none; flex-direction:column;">
    <div class="strip-slot"></div>
    <div class="strip-wrap">
      <canvas id="stripCanvas"></canvas>
    </div>
    <div class="actions-row">
      <button class="btn-save" id="saveBtn">⬇ Save Strip</button>
      <button class="btn-again" id="againBtn">↻ New Strip</button>
    </div>
  </div>

  <footer>
    © 2026 · Photo Booth Experience · Built by <a href="https://easypagex.github.io" target="_blank" rel="noopener">EasyLandX</a>
  </footer>

<script>
(function(){
  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const flashEl = document.getElementById('flash');
  const countdownEl = document.getElementById('countdown');
  const insertBtn = document.getElementById('insertBtn');
  const startBtn = document.getElementById('startBtn');
  const coin = document.getElementById('coin');
  const statusLine = document.getElementById('statusLine');
  const shotDots = document.querySelectorAll('#shotDots span');
  const stripOutlet = document.getElementById('stripOutlet');
  const stripCanvas = document.getElementById('stripCanvas');
  const saveBtn = document.getElementById('saveBtn');
  const againBtn = document.getElementById('againBtn');

  let stream = null;
  let coinInserted = false;
  let capturing = false;
  const shots = []; // holds ImageData-ready canvases

  // ---------- Sound synthesis (no external files) ----------
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playCoinSound(){
    const ctx = getCtx();
    const now = ctx.currentTime;
    // two quick metallic pings
    [1200, 1800].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i*0.08);
      gain.gain.setValueAtTime(0.0001, now + i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.18, now + i*0.08 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.08 + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i*0.08);
      osc.stop(now + i*0.08 + 0.3);
    });
  }

  function playShutterSound(){
    const ctx = getCtx();
    const now = ctx.currentTime;

    // click 1: sharp high click
    const clickOsc = ctx.createOscillator();
    const clickGain = ctx.createGain();
    clickOsc.type = 'square';
    clickOsc.frequency.setValueAtTime(2200, now);
    clickGain.gain.setValueAtTime(0.25, now);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    clickOsc.connect(clickGain).connect(ctx.destination);
    clickOsc.start(now);
    clickOsc.stop(now + 0.05);

    // mechanical thunk: filtered noise burst
    const bufferSize = ctx.sampleRate * 0.12;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 900;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.3, now + 0.03);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
    noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noise.start(now + 0.03);
  }

  function playCountBeep(){
    const ctx = getCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  }

  // ---------- Coin insert & camera start ----------
  insertBtn.addEventListener('click', async () => {
    getCtx(); // unlock audio context on user gesture
    coin.classList.remove('dropping');
    void coin.offsetWidth; // restart animation
    coin.classList.add('dropping');
    playCoinSound();

    if(coinInserted) return;
    coinInserted = true;
    insertBtn.textContent = '🪙 Coin Accepted';
    statusLine.textContent = 'warming up the camera…';

    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 540 } },
        audio: false
      });
      video.srcObject = stream;
      placeholder.style.display = 'none';
      startBtn.disabled = false;
      statusLine.textContent = 'ready — press "Take Photos" when you are!';
    } catch(err){
      statusLine.textContent = 'camera access denied — check your browser permissions';
      placeholder.textContent = 'Could not access the camera. Please allow camera permission and try again.';
      insertBtn.textContent = '🪙 Insert Coin';
      coinInserted = false;
    }
  });

  // ---------- Capture sequence ----------
  startBtn.addEventListener('click', () => {
    if(capturing || !coinInserted) return;
    runSequence();
  });

  async function countdownStep(n){
    countdownEl.textContent = n;
    countdownEl.classList.remove('show');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('show');
    playCountBeep();
    await wait(650);
  }

  function wait(ms){ return new Promise(res => setTimeout(res, ms)); }

  // Target portrait aspect ratio for every captured photo (width:height)
  const PORTRAIT_RATIO = 3 / 4;

  function captureFrame(){
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;

    // Work out a center-cropped source rectangle in portrait proportions
    let srcW, srcH;
    if (vw / vh > PORTRAIT_RATIO){
      // video is wider than target -> crop the sides
      srcH = vh;
      srcW = vh * PORTRAIT_RATIO;
    } else {
      // video is taller/narrower than target -> crop top/bottom
      srcW = vw;
      srcH = vw / PORTRAIT_RATIO;
    }
    const srcX = (vw - srcW) / 2;
    const srcY = (vh - srcH) / 2;

    // Fixed output size, always proportional
    const outW = 480;
    const outH = Math.round(outW / PORTRAIT_RATIO);

    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');

    // mirror to match the mirrored preview
    ctx.translate(outW, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
    ctx.setTransform(1, 0, 0, 1, 0, 0); // reset mirror transform before pixel ops

    // convert to true black & white at the pixel level (reliable across browsers)
    const imgData = ctx.getImageData(0, 0, outW, outH);
    const d = imgData.data;
    for(let p = 0; p < d.length; p += 4){
      const gray = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
      d[p] = d[p+1] = d[p+2] = gray;
    }
    ctx.putImageData(imgData, 0, 0);

    return c;
  }

  function flashOnce(){
    flashEl.classList.remove('on');
    void flashEl.offsetWidth;
    flashEl.classList.add('on');
  }

  async function runSequence(){
    capturing = true;
    startBtn.disabled = true;
    insertBtn.disabled = true;
    shots.length = 0;
    shotDots.forEach(d => d.classList.remove('filled'));
    stripOutlet.style.display = 'none';
    stripCanvas.classList.remove('printed');

    for(let i=0; i<4; i++){
      statusLine.textContent = `photo ${i+1} of 4 — get ready…`;
      await countdownStep(3);
      await countdownStep(2);
      await countdownStep(1);

      flashOnce();
      playShutterSound();
      shots.push(captureFrame());
      shotDots[i].classList.add('filled');
      statusLine.textContent = `photo ${i+1} captured!`;

      if(i < 3){
        await wait(900); // brief pause before next countdown begins
      }
    }

    statusLine.textContent = 'developing your strip…';
    await wait(600);
    buildStrip();
    capturing = false;
    startBtn.disabled = false;
    insertBtn.disabled = false;
    statusLine.textContent = 'all done! insert another coin for a new strip';
  }

  // ---------- Build the photo strip ----------
  function buildStrip(){
    const photoW = 300;
    const photoH = Math.round(photoW / PORTRAIT_RATIO); // 3:4 portrait, matches captureFrame
    const pad = 24;
    const gap = 18;
    const footerH = 90;
    const stripW = photoW + pad*2;
    const stripH = pad + (photoH+gap)*4 + footerH;

    stripCanvas.width = stripW;
    stripCanvas.height = stripH;
    const ctx = stripCanvas.getContext('2d');

    // cream paper background
    ctx.fillStyle = '#fdf6e6';
    ctx.fillRect(0, 0, stripW, stripH);

    // subtle border
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, stripW-6, stripH-6);

    shots.forEach((shotCanvas, i) => {
      const y = pad + i*(photoH+gap);
      // photo frame (black mat like real booth photos)
      ctx.fillStyle = '#221a14';
      ctx.fillRect(pad-6, y-6, photoW+12, photoH+12);
      ctx.drawImage(shotCanvas, pad, y, photoW, photoH);

      // enforce true black & white on the pixels just drawn,
      // regardless of whether ctx.filter was honored during capture
      const imgData = ctx.getImageData(pad, y, photoW, photoH);
      const d = imgData.data;
      for(let p = 0; p < d.length; p += 4){
        const gray = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
        d[p] = d[p+1] = d[p+2] = gray;
      }
      ctx.putImageData(imgData, pad, y);
    });

    // footer branding
    const footerY = stripH - footerH;
    ctx.fillStyle = '#b23b3b';
    ctx.font = "bold 26px 'DM Sans', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText('★ PHOTO BOOTH ★', stripW/2, footerY + 34);

    ctx.fillStyle = '#6b4a2b';
    ctx.font = "16px 'DM Sans', sans-serif";
    ctx.fillText('© 2026 · Built by EasyLandX', stripW/2, footerY + 62);

    stripOutlet.style.display = 'flex';
    stripCanvas.classList.add('printed');
  }

  // ---------- Save & reset ----------
  saveBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'photo-booth-strip.png';
    link.href = stripCanvas.toDataURL('image/png');
    link.click();
  });

  againBtn.addEventListener('click', () => {
    stripOutlet.style.display = 'none';
    stripCanvas.classList.remove('printed');
    shotDots.forEach(d => d.classList.remove('filled'));
    statusLine.textContent = 'ready — press "Take Photos" when you are!';
  });

})();
</script>
</body>
