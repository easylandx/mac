<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EasyLandX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4ff1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#f4ff1f;overscroll-behavior:none}
  #bg{position:fixed;inset:0;z-index:0;background:#f4ff1f}
  #world{position:relative;z-index:1;height:520vh;overflow:hidden}
  .g{position:absolute;font-size:32px;line-height:1.1;will-change:transform;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
  .g span{display:inline-block}
  .g span.p{animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

  .bar{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px}
  .bar.end{padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 100px)}
  .lx{display:block;text-align:center;text-decoration:none;font-family:'Poppins',system-ui,-apple-system,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px;color:#fff;background:#151515;border:3px solid #151515;border-radius:18px;padding:16px 20px;box-shadow:5px 5px 0 #d63c2b}
  .lx:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #d63c2b}
  #rain{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  .btn{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:56px;height:56px;border-radius:50%;border:2px solid #fff;background:rgba(21,21,21,.6);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:0;opacity:.8}
  .btn.on{opacity:1;background:#d63c2b;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
  #bRain{left:calc(env(safe-area-inset-left,0px) + 18px)}
  #bSnd{right:calc(env(safe-area-inset-right,0px) + 18px)}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="bar"><a class="lx" href="https://easylandx.github.io" target="_blank" rel="noopener">EasyLandX</a></div>
<div id="world"></div>
<div class="bar end"><a class="lx" href="https://easylandx.github.io" target="_blank" rel="noopener">EasyLandX</a></div>
<canvas id="rain"></canvas>
<button class="btn" id="bRain" aria-label="Rain">🌧️</button>
<button class="btn" id="bSnd" aria-label="Sound">🔊</button>

<script>
(function(){
  var raw = "🧑‍🌾 👨‍🌾 👩‍🌾 🧑‍🍳 👨‍🍳 👩‍🍳 🧑‍🎓 👨‍🎓 👩‍🎓 🧑‍🎤 👨‍🎤 👩‍🎤 🧑‍🎨 👨‍🎨 👩‍🎨 🧑‍🏫 👨‍🏫 👩‍🏫 🧑‍🏭 👨‍🏭 👩‍🏭 🧑‍💻 👨‍💻 👩‍💻 🧑‍💼 👨‍💼 👩‍💼 🧑‍🔧 👨‍🔧 👩‍🔧 🧑‍🔬 👨‍🔬 👩‍🔬 🧑‍🚀 👨‍🚀 👩‍🚀 🧑‍🚒 👨‍🚒 👩‍🚒 👮 👮‍♂️ 👮‍♀️ 🕵️ 🕵️‍♂️ 🕵️‍♀️ 💂 💂‍♂️ 💂‍♀️ 🥷 🧑‍🏗️ 👨‍🏗️ 👩‍🏗️ 🤴 👸 👳 👳‍♂️ 👳‍♀️ 👲 🧕 🤵 🤵‍♂️ 🤵‍♀️ 👰 👰‍♂️ 👰‍♀️ 🤰 🤱 🧑‍🍼 👨‍🍼 👩‍🍼 👼 🎅 🤶 🧑‍🎄 🦸 🦸‍♂️ 🦸‍♀️ 🦹 🦹‍♂️ 🦹‍♀️ 🧑‍🦽 👨‍🦽 👩‍🦽 🧑‍🦼 👨‍🦼 👩‍🦼 🧑‍🦯 👨‍🦯 👩‍🦯 🏃 🏃‍♂️ 🏃‍♀️ 🚶 🚶‍♂️ 🚶‍♀️ 🧍 🧍‍♂️ 🧍‍♀️ 🧎 🧎‍♂️ 🧎‍♀️ 🏋️ 🏋️‍♂️ 🏋️‍♀️ 🤸 🤸‍♂️ 🤸‍♀️ 🧗 🧗‍♂️ 🧗‍♀️ 🧘 🧘‍♂️ 🧘‍♀️ 🏌️ 🏌️‍♂️ 🏌️‍♀️ 🏄 🏄‍♂️ 🏄‍♀️ 🏊 🏊‍♂️ 🏊‍♀️ ⛹️ ⛹️‍♂️ ⛹️‍♀️ 🚴 🚴‍♂️ 🚴‍♀️ 🚵 🚵‍♂️ 🚵‍♀️ 🏇 🤺 ⛷️ 🏂 🧜 🧜‍♂️ 🧜‍♀️ 🧚 🧚‍♂️ 🧚‍♀️ 🧛 🧛‍♂️ 🧛‍♀️ 🧟 🧟‍♂️ 🧟‍♀️ 🧞 🧞‍♂️ 🧞‍♀️ 🧙 🧙‍♂️ 🧙‍♀️ 🧝 🧝‍♂️ 🧝‍♀️ 🙅 🙅‍♂️ 🙅‍♀️ 🙆 🙆‍♂️ 🙆‍♀️ 💁 💁‍♂️ 💁‍♀️ 🙋 🙋‍♂️ 🙋‍♀️ 🧏 🧏‍♂️ 🧏‍♀️ 🙇 🙇‍♂️ 🙇‍♀️ 🤦 🤦‍♂️ 🤦‍♀️ 🤷 🤷‍♂️ 🤷‍♀️ 💇 💇‍♂️ 💇‍♀️ 💆 💆‍♂️ 💆‍♀️ 🧖 🧖‍♂️ 🧖‍♀️ 💃 🕺 🕴️ 👥 👤 🗣️ 🧑‍🤝‍🧑 👭 👬 👫 " +
  "🧑‍⚖️ 👨‍⚖️ 👩‍⚖️ 👔 💼 📁 📂 📅 📆 📈 📉 📊 📋 📌 📍 📎 🖇️ 📏 📐 ✂️ 🗃️ 🗄️ 🗑️ 🔒 🔓 🔏 🔐 🔑 🗝️ 🔨 🪓 ⛏️ ⚒️ 🛠️ 🔩 ⚙️ 🗜️ ⚖️ 🔗 ⛓️ 🧱 🪙 💵 💴 💶 💷 💰 💳 💎 🧾 ✉️ 📩 📨 📧 🤝 ✍️ 🖊️ 🖋️ ✒️ 📝 🖨️ 🖥️ 💻 🖲️ ⌨️ 📱 ☎️ 📞 📟 📠 🏢 🏭 🏪 🏛️";
  var ALL = raw.split(/\s+/).filter(function(e,i,a){return e && a.indexOf(e)===i});

  var world = document.getElementById("world"), groups = [];
  function build(){
    world.innerHTML = ""; groups = [];
    var W = innerWidth, H = world.offsetHeight, m = 18;
    for(var i=0;i<ALL.length;i++){
      var e = document.createElement("div"); e.className = "g";
      var s = document.createElement("span"); s.textContent = ALL[i]; e.appendChild(s);
      e.style.left = (m + Math.random()*Math.max(10, W-48-m*2))+"px";
      e.style.top = (30 + Math.random()*(H-110))+"px";
      world.appendChild(e);
      groups.push({el:e, s:s, d:0.35+Math.random()*0.95, cx:0, cy:0});
    }
  }
  build();
  var rt; addEventListener("resize", function(){clearTimeout(rt); rt=setTimeout(build,250)});

  var tx=0, ty=0, oriOn=false, lx=0, ly=0, lastWhoosh=0;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function onOri(e){
    if(e.gamma==null) return; oriOn=true;
    tx=clamp(e.gamma/35,-1,1); ty=clamp(((e.beta||0)-40)/35,-1,1);
  }
  addEventListener("deviceorientation", onOri);
  addEventListener("mousemove", function(e){ if(oriOn) return; tx=(e.clientX/innerWidth-.5)*2; ty=(e.clientY/innerHeight-.5)*2 });
  var asked=false;
  function askOri(){
    if(asked) return; asked=true;
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(function(r){ if(r==="granted") addEventListener("deviceorientation", onOri) }).catch(function(){asked=false});
    }
  }
  addEventListener("touchend", askOri, {passive:true}); addEventListener("click", askOri);

  function frame(t){
    var W=innerWidth;
    for(var i=0;i<groups.length;i++){
      var g=groups[i], gx=tx*W*0.55*g.d, gy=ty*W*0.35*g.d, dx=gx-g.cx, dy=gy-g.cy;
      if(Math.abs(dx)>.05||Math.abs(dy)>.05){
        g.cx+=dx*0.07; g.cy+=dy*0.07;
        g.el.style.transform="translate3d("+g.cx.toFixed(1)+"px,"+g.cy.toFixed(1)+"px,0)";
      }
    }
    if(sndOn && Math.abs(tx-lx)+Math.abs(ty-ly)>.45 && t-lastWhoosh>2200){ lastWhoosh=t; whoosh(.7, .035); lx=tx; ly=ty }
    else if(Math.abs(tx-lx)+Math.abs(ty-ly)>.45){ lx=tx; ly=ty }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* Rain */
  var cv=document.getElementById("rain"), cx=cv.getContext("2d"), drops=[], rainOn=false, raf=0;
  function size(){var r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0)}
  size(); addEventListener("resize", size);
  for(var i=0;i<170;i++) drops.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:10+Math.random()*16,v:12+Math.random()*10});
  function rainLoop(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    cx.fillStyle="rgba(60,80,100,.16)"; cx.fillRect(0,0,innerWidth,innerHeight);
    cx.strokeStyle="rgba(230,240,255,.7)"; cx.lineWidth=1.4; cx.beginPath();
    for(var i=0;i<drops.length;i++){
      var d=drops[i]; cx.moveTo(d.x,d.y); cx.lineTo(d.x-d.l*.25,d.y+d.l);
      d.y+=d.v; d.x-=d.v*.25; if(d.y>innerHeight||d.x<0){d.y=-20; d.x=Math.random()*(innerWidth+80)}
    }
    cx.stroke(); raf=requestAnimationFrame(rainLoop);
  }

  /* Soft UI sounds */
  var ac, master, nbuf, sndOn=false, ambTimer;
  function audio(){
    if(!ac){
      var AC=window.AudioContext||window.webkitAudioContext;
      ac=new AC(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      nbuf=ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
      var d=nbuf.getChannelData(0), last=0;
      for(var i=0;i<d.length;i++){ var w=Math.random()*2-1; last=(last+.04*w)/1.04; d[i]=last*3 }
    }
    if(ac.state==="suspended") ac.resume();
  }
  function tone(type,f0,f1,t0,dur,vol,lp,atk){
    var o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
    f.type="lowpass"; f.frequency.value=lp||3500; o.type=type;
    o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+(atk||.01)); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(f); f.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.05);
  }
  function now(){return ac.currentTime+.01}
  function whoosh(dur, vol){
    var t0=now(), s=ac.createBufferSource(), bp=ac.createBiquadFilter(), g=ac.createGain();
    s.buffer=nbuf; bp.type="bandpass"; bp.Q.value=.6;
    bp.frequency.setValueAtTime(260,t0); bp.frequency.exponentialRampToValueAtTime(1300,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+dur*.5); g.gain.linearRampToValueAtTime(0.0001,t0+dur);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t0, Math.random(), dur+.1);
  }
  var FX = {
    rise:function(){var t=now(); tone("sine",392,587,t,.7,.07,2500,.25)},
    pop:function(){var t=now(); tone("sine",520,170,t,.09,.12,2000)},
    tick:function(){var t=now(); tone("sine",1900,1500,t,.035,.05,3200)},
    chime:function(){var t=now(); tone("sine",880,880,t,.7,.05,4000,.02); tone("sine",1318,1318,t+.05,.6,.03,4000,.02)},
    click:function(){var t=now(); tone("sine",1500,1000,t,.04,.06,3000); tone("sine",660,660,t+.09,.25,.05,2500,.02); tone("sine",880,880,t+.17,.4,.05,2500,.02)},
    tap:function(){var t=now(); tone("sine",320,190,t,.06,.1,1800)},
    dtick:function(){var t=now(); tone("triangle",1200,1700,t,.05,.04,3000)},
    sent:function(){var t=now(); tone("triangle",392,523,t,.28,.07,1300,.04); tone("sine",784,784,t+.14,.4,.04,2200,.03)},
    sparkle:function(){var t=now(); [1760,2093,2637,3136].forEach(function(f,i){tone("sine",f,f,t+i*.07,.35,.025,4200,.01)})},
    swoosh:function(){whoosh(.6,.04)}
  };
  var KEYS = ["pop","chime","tick","click","sparkle","sent","tap","dtick","rise","swoosh"];
  function play(k){ if(!sndOn) return; try{ FX[k]() }catch(e){} }

  world.addEventListener("pointerdown", function(e){
    var g=e.target.closest(".g"); if(!g) return;
    var s=g.firstChild; s.classList.remove("p"); void s.offsetWidth; s.classList.add("p");
    play(KEYS[Math.floor(Math.random()*KEYS.length)]);
  });
  var lastY=0;
  addEventListener("scroll", function(){
    var y=scrollY; if(Math.abs(y-lastY)>160){ lastY=y; play("dtick") }
  }, {passive:true});

  function ambient(){ whoosh(2.8,.03); ambTimer=setTimeout(ambient, 5000+Math.random()*4000) }

  var bRain=document.getElementById("bRain"), bSnd=document.getElementById("bSnd");
  bRain.addEventListener("click", function(){
    rainOn=!rainOn; bRain.classList.toggle("on", rainOn);
    cancelAnimationFrame(raf);
    if(rainOn) rainLoop(); else cx.clearRect(0,0,innerWidth,innerHeight);
    play(rainOn?"click":"sent");
  });
  bSnd.addEventListener("click", function(){
    sndOn=!sndOn; bSnd.classList.toggle("on", sndOn);
    clearTimeout(ambTimer);
    if(sndOn){ try{ audio(); FX.rise(); setTimeout(ambient,900) }catch(e){} }
  });
})();
</script>
</body>
</html>
