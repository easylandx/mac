<script>
(function () {
  const stage = document.getElementById('stage');
  const imgIdle = document.getElementById('imgIdle');
  const imgPaid = document.getElementById('imgPaid');

  let audioCtx = null;
  let paid = false;
  let busy = false;

  function ctx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function now() { return ctx().currentTime; }

  function tone(freq, start, dur, opts) {
    opts = opts || {};
    const ac = ctx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, start);
    if (opts.slideTo) {
      osc.frequency.linearRampToValueAtTime(opts.slideTo, start + dur);
    }
    const peak = opts.peak !== undefined ? opts.peak : 0.18;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(peak, start + Math.min(0.015, dur * 0.2));
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function click(start, dur) {
    const ac = ctx();
    const bufferSize = Math.floor(ac.sampleRate * dur);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const decay = 1 - (i / bufferSize);
      data[i] = (Math.random() * 2 - 1) * decay * decay;
    }
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const filt = ac.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 2200;
    filt.Q.value = 1.1;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.35, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(ac.destination);
    src.start(start);
  }

  function whir(start, dur) {
    const ac = ctx();
    const bufferSize = Math.floor(ac.sampleRate * dur);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.5;
    }
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const filt = ac.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(500, start);
    filt.frequency.linearRampToValueAtTime(900, start + dur * 0.6);
    filt.frequency.linearRampToValueAtTime(400, start + dur);
    filt.Q.value = 4;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(0.12, start + 0.04);
    gain.gain.setValueAtTime(0.12, start + dur - 0.06);
    gain.gain.linearRampToValueAtTime(0.0001, start + dur);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(ac.destination);
    src.start(start);

    // sprinkle a few little clicks through the whir
    const clicks = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < clicks; i++) {
      click(start + (dur / clicks) * i + Math.random() * 0.02, 0.03);
    }
  }

  function coinClunk(start) {
    tone(180, start, 0.12, { type: 'triangle', peak: 0.3, slideTo: 90 });
    tone(2600, start + 0.01, 0.05, { type: 'square', peak: 0.05 });
    click(start + 0.09, 0.08);
  }

  function confirmChime(start) {
    tone(880, start, 0.14, { type: 'sine', peak: 0.2 });
    tone(1318.5, start + 0.13, 0.22, { type: 'sine', peak: 0.2 });
  }

  function keypadBeep(start, freq) {
    tone(freq || 1200, start, 0.09, { type: 'square', peak: 0.12 });
  }

  function errorBuzz(start) {
    tone(160, start, 0.28, { type: 'sawtooth', peak: 0.22, slideTo: 110 });
    tone(155, start + 0.02, 0.28, { type: 'square', peak: 0.1, slideTo: 105 });
  }

  function playPaySequence() {
    const t0 = now();
    keypadBeep(t0, 1046);
    keypadBeep(t0 + 0.13, 1318);
    whir(t0 + 0.32, 0.9);
    coinClunk(t0 + 1.05);
    coinClunk(t0 + 1.22);
    confirmChime(t0 + 1.5);
    return 1900;
  }

  function playResetSequence() {
    const t0 = now();
    const isError = Math.random() < 0.18;
    keypadBeep(t0, 700);
    whir(t0 + 0.1, 0.5);
    if (isError) {
      errorBuzz(t0 + 0.65);
      return 1050;
    }
    keypadBeep(t0 + 0.62, 950);
    return 850;
  }

  function swap(toPaid) {
    if (toPaid) {
      imgIdle.classList.remove('visible');
      imgIdle.classList.add('hidden');
      imgPaid.classList.remove('hidden');
      imgPaid.classList.add('visible');
    } else {
      imgPaid.classList.remove('visible');
      imgPaid.classList.add('hidden');
      imgIdle.classList.remove('hidden');
      imgIdle.classList.add('visible');
    }
  }

  stage.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    stage.classList.add('pressed');
    setTimeout(function () { stage.classList.remove('pressed'); }, 120);

    let waitMs;
    if (!paid) {
      waitMs = playPaySequence();
      setTimeout(function () { swap(true); }, 380);
    } else {
      waitMs = playResetSequence();
      setTimeout(function () { swap(false); }, 200);
    }
    paid = !paid;

    setTimeout(function () { busy = false; }, waitMs);
  });
})();
</script>
</body>
</html>
