<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFD93D">
<title>360° Gallery View</title>
<style>
:root{
  --yellow:#FFD93D; --orange:#FF9F1C; --pink:#FF6B9D; --blue:#4D96FF; --violet:#8B5CF6; --ink:#1F1B3A;
  --gap:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:linear-gradient(135deg,#FFE27A,#FFB5D0 50%,#A9CBFF);min-height:100%}
body{overflow-x:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
/* Tall invisible spacer: lets the page scroll so iPhone Safari collapses the address bar */
#spacer{height:300vh;width:1px}
#viewer{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#FFE27A}
#viewer.drag{cursor:grabbing}
#viewer canvas{display:block;width:100%;height:100%}

.ui{position:fixed;z-index:5}
#rotateBtn{
  left:calc(var(--gap) + env(safe-area-inset-left,0px));
  bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));
  width:64px;height:64px;border-radius:50%;border:3px solid #fff;cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--ink);
  display:grid;place-items:center;padding:0;
  box-shadow:0 8px 22px rgba(31,27,58,.28);transition:transform .2s,background .3s,color .3s;
  touch-action:manipulation;
}
#rotateBtn:active{transform:scale(.92)}
#rotateBtn svg{width:36px;height:36px}
#rotateBtn.on{background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff}
#rotateBtn.on .spin{animation:spin 3s linear infinite;transform-origin:20px 20px}
@keyframes spin{to{transform:rotate(360deg)}}

#brandBtn{
  right:calc(var(--gap) + env(safe-area-inset-right,0px));
  bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));
  height:64px;padding:0 26px;border-radius:32px;border:3px solid #fff;text-decoration:none;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.2px;color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--pink) 55%,var(--violet));
  box-shadow:0 8px 22px rgba(31,27,58,.28);transition:transform .2s;touch-action:manipulation;
}
#brandBtn:active{transform:scale(.95)}
#brandBtn span{font-size:20px;line-height:1}

#hint{
  left:50%;top:calc(var(--gap) + env(safe-area-inset-top,0px));transform:translateX(-50%);
  max-width:calc(100% - 2*var(--gap));text-align:center;
  background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:14px;
  padding:10px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(31,27,58,.2);
  transition:opacity .6s;pointer-events:none;
}
#hint.hide{opacity:0}

#loader{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;
  background:linear-gradient(135deg,#FFE27A,#FFB5D0 50%,#A9CBFF);transition:opacity .6s;
}
#loader.done{opacity:0;pointer-events:none}
#loader .ring{width:56px;height:56px;border-radius:50%;border:6px solid #fff;border-top-color:var(--violet);margin:0 auto 16px;animation:spin 1s linear infinite}
#loader p{margin:0;font-weight:800;font-size:18px}
</style>
</head>
<body>
<div id="spacer"></div>
<div id="viewer"></div>

    <text x="20" y="24" text-anchor="middle" font-size="10" font-weight="800" fill="currentColor" stroke="none" font-family="system-ui,sans-serif">360</text>
  </svg>
</button>

  var stage = document.getElementById('viewer');
  var rotateBtn = document.getElementById('rotateBtn');
  var hint = document.getElementById('hint');
  var loader = document.getElementById('loader');

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200);
  var vLimit = 90, lon = -90, lat = 0, vLon = 0, vLat = 0;
  var dragging = false, auto = false, lastX = 0, lastY = 0, lastT = performance.now();

  function resize(){
    var w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  resize();

  var img = new Image();
  img.onload = function(){
    var tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    var vspan = Math.min(180, 360 * img.height / img.width);
    vLimit = vspan / 2;
    var tl = vspan * Math.PI / 180;
    var geo = new THREE.SphereGeometry(50, 96, 64, 0, Math.PI * 2, (Math.PI - tl) / 2, tl);
    geo.scale(-1, 1, 1);
    var mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: tex}));
    scene.add(mesh);

    loader.classList.add('done');
    setTimeout(function(){ hint.classList.add('hide'); }, 5000);
  };
  img.src = IMG;

  // Pointer rotation (mouse drag / touch swipe)
  var ptrs = {}, pinch0 = 0, fov0 = 48;
  function dist(){ var k = Object.keys(ptrs); if (k.length < 2) return 0; var a = ptrs[k[0]], b = ptrs[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }
  stage.addEventListener('pointerdown', function(e){
    ptrs[e.pointerId] = {x: e.clientX, y: e.clientY};
    dragging = true; lastX = e.clientX; lastY = e.clientY; vLon = vLat = 0;
    if (Object.keys(ptrs).length === 2){ pinch0 = dist(); fov0 = camera.fov; }
    stage.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch(_){}
  });
  stage.addEventListener('pointermove', function(e){
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = {x: e.clientX, y: e.clientY};
    if (Object.keys(ptrs).length >= 2){
      if (pinch0){ camera.fov = Math.min(80, Math.max(22, fov0 * pinch0 / dist())); camera.updateProjectionMatrix(); }
      return;
    }
    var k = camera.fov / stage.clientHeight;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    vLon = -dx * k; vLat = dy * k;
    lon += vLon; lat += vLat;
    hint.classList.add('hide');
  });
  function end(e){
    delete ptrs[e.pointerId];
    var left = Object.keys(ptrs);
    if (left.length){ lastX = ptrs[left[0]].x; lastY = ptrs[left[0]].y; vLon = vLat = 0; return; }
    dragging = false; stage.classList.remove('drag');
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    camera.fov = Math.min(80, Math.max(22, camera.fov + e.deltaY * 0.04));
    camera.updateProjectionMatrix();
  }, {passive:false});

  // Auto rotate button
  rotateBtn.addEventListener('click', function(){
    auto = !auto;
    rotateBtn.classList.toggle('on', auto);
    rotateBtn.setAttribute('aria-pressed', auto);
    hint.classList.add('hide');
  });

  // Hide the scroll hint once the page has scrolled (address bar collapsed)
  window.addEventListener('scroll', function(){ hint.classList.add('hide'); }, {passive:true});

  function frame(now){
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (!dragging){
      if (auto){ lon += 14 * dt; vLon = 0; }
      else { lon += vLon; vLon *= 0.94; }
      lat += vLat; vLat *= 0.94;
    }
    var maxLat = Math.max(0, vLimit - camera.fov / 2);
    lat = Math.max(-maxLat, Math.min(maxLat, lat));
    var phi = THREE.MathUtils.degToRad(lat), th = THREE.MathUtils.degToRad(lon);
    camera.lookAt(Math.cos(phi) * Math.sin(th), Math.sin(phi), -Math.cos(phi) * Math.cos(th));
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
