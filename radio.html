<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Radio</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a120b;--wood:#3b2414;--wood2:#5a3820;--panel:#e8d9b5;--ink:#2a1a0e;--amber:#ffb347;--glass:#17110a;--red:#e0442b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,#2c1d12,var(--bg));color:var(--panel);font-family:'Share Tech Mono',monospace;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 18px}
h1{font-family:'Playfair Display',serif;font-size:clamp(24px,6vw,36px);margin:0;color:var(--amber);letter-spacing:1px}
.lang{background:none;border:1px solid var(--wood2);color:var(--panel);padding:6px 12px;border-radius:20px;font:inherit;cursor:pointer}
.radio{background:linear-gradient(160deg,var(--wood2),var(--wood));border:2px solid #7a5230;border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 20px 50px #000a,inset 0 2px 0 #ffffff22}
.glass{background:var(--glass);border:3px solid #0008;border-radius:12px;padding:16px 18px;box-shadow:inset 0 0 30px #000}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.freq{font-size:clamp(34px,10vw,56px);color:var(--amber);text-shadow:0 0 14px #ffb34788;line-height:1}
.freq small{font-size:.4em;opacity:.8;margin-left:6px}
.led{width:12px;height:12px;border-radius:50%;background:#400;box-shadow:0 0 0 2px #0006;display:inline-block;margin-right:6px}
.led.on{background:var(--red);box-shadow:0 0 10px var(--red)}
.name{margin-top:10px;font-size:clamp(16px,4.5vw,22px);color:#fff3d6;min-height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:#c9b48a;min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;gap:3px;align-items:flex-end;height:30px}
.bars i{width:5px;background:var(--amber);height:4px;border-radius:1px;opacity:.9}
.playing .bars i{animation:b 0.9s ease-in-out infinite alternate}
.bars i:nth-child(2n){animation-duration:.6s}.bars i:nth-child(3n){animation-duration:1.2s}.bars i:nth-child(5n){animation-duration:.75s}
@keyframes b{from{height:4px}to{height:28px}}
.dial{position:relative;margin:18px 0 6px;height:54px;border-top:1px solid #ffb34744}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffb347aa 0 1px,transparent 1px 5%);opacity:.5;mask:linear-gradient(transparent 0,#000 0)}
.labels{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:space-between;font-size:12px;color:#c9a96a}
.needle{position:absolute;top:0;bottom:14px;width:2px;background:var(--red);box-shadow:0 0 8px var(--red);left:0;transition:left .08s}
.dots{position:absolute;inset:0 0 14px 0}
.dots b{position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.7;transform:translateX(-50%)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0007;border-radius:5px}
input[type=range]::-moz-range-track{height:8px;background:#0007;border-radius:5px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e4bb,#a67c3c);border:2px solid #3b2414;box-shadow:0 3px 8px #0009}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#c9a15a;border:2px solid #3b2414}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
button.b{background:linear-gradient(#f0e2bf,#cdb785);color:var(--ink);border:0;border-radius:10px;padding:12px 16px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #7a5a2e}
button.b:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a2e}
button.b.on{background:linear-gradient(#ffcf7a,var(--amber))}
.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:150px}
.vol input{margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px}
.chip{background:#0004;border:1px solid #7a5230;color:var(--panel);border-radius:20px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
select,input[type=search]{background:#0005;border:1px solid #7a5230;color:var(--panel);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input[type=search]{flex:1;min-width:140px}
.list{margin-top:14px;max-height:330px;overflow:auto;border-radius:12px;background:#0004;padding:6px}
.st{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.st:hover{background:#ffffff12}
.st.cur{background:#ffb34730;color:#fff}
.st span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st span:last-child{color:var(--amber);flex:none}
.status{margin-top:10px;font-size:13px;color:#c9b48a;min-height:1.2em}
footer{text-align:center;font-size:12px;color:#8d7650;padding:22px 10px 0}
#power{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;padding:30px;text-align:center}
#power h2{font-family:'Playfair Display',serif;color:var(--amber);font-size:clamp(28px,8vw,44px);margin:0}
#power button{background:var(--amber);color:var(--ink);border:0;border-radius:50px;padding:18px 40px;font:inherit;font-size:20px;cursor:pointer;box-shadow:0 0 30px #ffb34766}
</style>
</head>
<body>
<div id="power">
  <h2>Virtual Radio</h2>
  <p id="pTxt">Tap to switch on and start listening</p>
  <button id="pBtn">ON</button>
</div>

<div class="wrap">
  <header>
    <h1>Virtual Radio</h1>
    <button class="lang" id="langBtn">ES</button>
  </header>

  <div class="radio" id="radio">
    <div class="glass">
      <div class="top">
        <div>
          <div class="freq"><span id="freq">88.0</span><small>FM</small></div>
        </div>
        <div style="text-align:right">
          <div><span class="led" id="led"></span><span id="onair">ON AIR</span></div>
          <div class="bars" style="margin-top:8px;justify-content:flex-end"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="name" id="name">...</div>
      <div class="meta" id="meta"></div>
      <div class="dial">
        <div class="ticks"></div>
        <div class="dots" id="dots"></div>
        <div class="needle" id="needle"></div>
        <div class="labels"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
      </div>
    </div>

    <input type="range" id="tune" min="0" max="1000" value="0" aria-label="Tuning">

    <div class="ctrls">
      <button class="b" id="prev">&#9664;&#9664;</button>
      <button class="b" id="play">&#9654;</button>
      <button class="b" id="next">&#9654;&#9654;</button>
      <button class="b" id="scan">AUTO SCAN</button>
      <label class="vol">&#128266;<input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></label>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="filters" id="genres"></div>
  <div class="row">
    <select id="country"></select>
    <input type="search" id="q" placeholder="Search station...">
    <button class="b" id="load">GO</button>
  </div>
  <div class="list" id="list"></div>
  <footer id="foot">Streams by Radio-Browser.info, the open community radio database.</footer>
</div>

<script>
const T={
 en:{on:'Tap to switch on and start listening',search:'Search station...',world:'Worldwide',scan:'AUTO SCAN',scanOn:'SCANNING',load:'Loading stations...',tuned:'Tuned',noise:'Between stations...',fail:'Stream unavailable, moving on...',none:'No stations found, showing built-in list.',all:'All',foot:'Streams by Radio-Browser.info, the open community radio database.',ok:'stations loaded'},
 es:{on:'Toca para encender y escuchar',search:'Buscar emisora...',world:'Todo el mundo',scan:'ESCANEO AUTO',scanOn:'ESCANEANDO',load:'Cargando emisoras...',tuned:'Sintonizada',noise:'Entre emisoras...',fail:'Emisora no disponible, siguiente...',none:'No hay emisoras, se muestra la lista interna.',all:'Todas',foot:'Emisoras de Radio-Browser.info, la base de datos abierta de radios.',ok:'emisoras cargadas'}
};
let lang=(navigator.language||'en').toLowerCase().startsWith('es')?'es':'en';
const $=id=>document.getElementById(id);
const GENRES=['all','pop','rock','jazz','classical','news','electronic','latin','chillout','hiphop'];
const COUNTRIES=[['','world'],['ES','Espa\u00f1a'],['US','USA'],['GB','UK'],['FR','France'],['DE','Deutschland'],['IT','Italia'],['PT','Portugal'],['MX','M\u00e9xico'],['AR','Argentina'],['BR','Brasil'],['JP','Japan']];
const FALLBACK=[
 ['SomaFM Groove Salad','https://ice1.somafm.com/groovesalad-128-mp3','chillout','US'],
 ['SomaFM Space Station','https://ice1.somafm.com/spacestation-128-mp3','electronic','US'],
 ['SomaFM Secret Agent','https://ice1.somafm.com/secretagent-128-mp3','lounge','US'],
 ['SomaFM Indie Pop Rocks','https://ice1.somafm.com/indiepop-128-mp3','indie','US'],
 ['SomaFM Fluid','https://ice1.somafm.com/fluid-128-mp3','hiphop','US'],
 ['SomaFM Folk Forward','https://ice1.somafm.com/folkfwd-128-mp3','folk','US'],
 ['Radio Paradise','https://stream.radioparadise.com/mp3-128','eclectic','US'],
 ['Radio Paradise Mellow','https://stream.radioparadise.com/mellow-128','mellow','US'],
 ['KEXP Seattle','https://kexp.streamguys1.com/kexp128.mp3','indie','US']
].map(a=>({name:a[0],url:a[1],tag:a[2],cc:a[3]}));

let stations=[],cur=-1,tag='all',scanning=false,scanTimer=null,powered=false,tuneTimer=null;
const audio=new Audio();audio.preload='none';
let ctx,noiseGain;
function initNoise(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=2500;f.Q.value=.4;
  noiseGain=ctx.createGain();noiseGain.gain.value=0;
  src.connect(f).connect(noiseGain).connect(ctx.destination);src.start();
}
function noise(on){if(!noiseGain)return;noiseGain.gain.setTargetAtTime(on?.12*(audio.volume||.8):0,ctx.currentTime,.05)}

function t(k){return T[lang][k]}
function applyLang(){
  document.documentElement.lang=lang;$('langBtn').textContent=lang==='en'?'ES':'EN';
  $('pTxt').textContent=t('on');$('q').placeholder=t('search');$('foot').textContent=t('foot');
  $('scan').textContent=scanning?t('scanOn'):t('scan');
  buildGenres();buildCountries();
}
function buildGenres(){
  $('genres').innerHTML='';
  GENRES.forEach(g=>{const b=document.createElement('button');b.className='chip'+(g===tag?' on':'');b.textContent=g==='all'?t('all'):g;b.onclick=()=>{tag=g;buildGenres();loadStations()};$('genres').appendChild(b)});
}
function buildCountries(){
  const v=$('country').value;$('country').innerHTML='';
  COUNTRIES.forEach(c=>{const o=document.createElement('option');o.value=c[0];o.textContent=c[1]==='world'?t('world'):c[1];$('country').appendChild(o)});
  $('country').value=v||'';
}

function assign(list){
  const seen=new Set();
  stations=list.filter(s=>s.url&&s.url.startsWith('https')&&!seen.has(s.name.toLowerCase())&&seen.add(s.name.toLowerCase())).slice(0,60);
  const n=stations.length;
  stations.forEach((s,i)=>s.pos=n>1?(i+.5)/n:.5);
  stations.forEach(s=>s.freq=88+s.pos*20);
  cur=-1;renderList();renderDots();
}
async function loadStations(){
  $('status').textContent=t('load');
  const p=new URLSearchParams({limit:'80',hidebroken:'true',is_https:'true',order:'votes',reverse:'true'});
  if(tag!=='all')p.set('tag',tag);
  const cc=$('country').value;if(cc)p.set('countrycode',cc);
  const q=$('q').value.trim();if(q)p.set('name',q);
  let list=[];
  try{
    const r=await fetch('https://all.api.radio-browser.info/json/stations/search?'+p,{signal:AbortSignal.timeout(9000)});
    const j=await r.json();
    list=j.map(s=>({name:(s.name||'').trim(),url:s.url_resolved||s.url,tag:(s.tags||'').split(',')[0],cc:s.countrycode}));
  }catch(e){list=[]}
  if(!list.filter(s=>s.url&&s.name).length){assign(FALLBACK);$('status').textContent=t('none')}
  else{assign(list.filter(s=>s.name));$('status').textContent=stations.length+' '+t('ok')}
  if(powered&&stations.length)tuneTo(0,true);
}
function renderList(){
  const L=$('list');L.innerHTML='';
  stations.forEach((s,i)=>{
    const d=document.createElement('div');d.className='st'+(i===cur?' cur':'');
    d.innerHTML='<span></span><span>'+s.freq.toFixed(1)+'</span>';
    d.firstChild.textContent=s.name;
    d.onclick=()=>{if(!powered)powerOn();tuneTo(i,true)};
    L.appendChild(d);
  });
}
function renderDots(){
  $('dots').innerHTML=stations.map(s=>'<b style="left:'+(s.pos*100)+'%"></b>').join('');
}
function setDial(pos,fr){
  $('needle').style.left=(pos*100)+'%';
  $('freq').textContent=fr.toFixed(1);
  $('tune').value=Math.round(pos*1000);
}
function tuneTo(i,move){
  if(i<0||i>=stations.length)return;
  cur=i;const s=stations[i];
  if(move)setDial(s.pos,s.freq);
  $('name').textContent=s.name;
  $('meta').textContent=[s.tag,s.cc].filter(Boolean).join(' / ');
  document.querySelectorAll('.st').forEach((e,k)=>e.classList.toggle('cur',k===i));
  const el=document.querySelectorAll('.st')[i];if(el)el.scrollIntoView({block:'nearest'});
  playStream(s);
}
function playStream(s){
  noise(true);$('led').classList.remove('on');$('radio').classList.remove('playing');
  audio.src=s.url;audio.volume=$('vol').value/100;
  const pr=audio.play();
  if(pr&&pr.catch)pr.catch(()=>{});
}
audio.addEventListener('playing',()=>{noise(false);$('led').classList.add('on');$('radio').classList.add('playing');$('play').innerHTML='&#10074;&#10074;';$('status').textContent=t('tuned')+': '+(stations[cur]?stations[cur].name:'')});
audio.addEventListener('waiting',()=>noise(true));
audio.addEventListener('pause',()=>{$('play').innerHTML='&#9654;';$('led').classList.remove('on');$('radio').classList.remove('playing')});
audio.addEventListener('error',()=>{
  if(!powered||cur<0)return;
  $('status').textContent=t('fail');
  setTimeout(()=>{if(audio.error)step(1)},1500);
});
function step(d){
  if(!stations.length)return;
  const n=(cur+d+stations.length)%stations.length;tuneTo(n,true);
}

$('tune').addEventListener('input',e=>{
  if(!powered||!stations.length)return;
  const pos=e.target.value/1000,fr=88+pos*20;
  $('needle').style.left=(pos*100)+'%';$('freq').textContent=fr.toFixed(1);
  let best=0,bd=9;stations.forEach((s,i)=>{const dd=Math.abs(s.pos-pos);if(dd<bd){bd=dd;best=i}});
  const gap=.5/stations.length;
  clearTimeout(tuneTimer);
  if(bd<gap*.6){
    tuneTimer=setTimeout(()=>{if(best!==cur||audio.paused)tuneTo(best,false)},250);
  }else{
    noise(true);$('status').textContent=t('noise');audio.pause();$('name').textContent='~~~~~';$('meta').textContent='';cur=-1;
    document.querySelectorAll('.st').forEach(e=>e.classList.remove('cur'));
  }
});
$('vol').addEventListener('input',e=>{audio.volume=e.target.value/100});
$('prev').onclick=()=>step(-1);
$('next').onclick=()=>step(1);
$('play').onclick=()=>{
  if(audio.paused){if(cur<0)tuneTo(0,true);else audio.play().catch(()=>{})}else audio.pause();
};
$('scan').onclick=()=>{
  scanning=!scanning;$('scan').classList.toggle('on',scanning);$('scan').textContent=scanning?t('scanOn'):t('scan');
  clearInterval(scanTimer);if(scanning)scanTimer=setInterval(()=>step(1),12000);
};
$('load').onclick=loadStations;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')loadStations()});
$('country').onchange=loadStations;
$('langBtn').onclick=()=>{lang=lang==='en'?'es':'en';applyLang()};

function powerOn(){
  if(powered)return;powered=true;initNoise();if(ctx.state==='suspended')ctx.resume();
  $('power').style.display='none';
  if(stations.length)tuneTo(Math.floor(Math.random()*stations.length),true);
}
$('pBtn').onclick=powerOn;
applyLang();
loadStations();
</script>
</body>
</html>
