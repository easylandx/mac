<style>
:root{--bg:#0a0a0d;--p:#131318;--p2:#1b1b22;--line:#2a2a33;--ink:#f3efe6;--mute:#9b98a6;--gold:#d8b26a;--gold2:#f2d390;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1100px 600px at 80% -10%,rgba(216,178,106,.10),transparent 60%),var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:84px}

.glyph{width:34px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--gold2),var(--gold));transform:rotate(-8deg);position:relative;flex:none}
.glyph::before{content:"";position:absolute;left:5px;top:6px;width:11px;height:3px;border-radius:2px;background:#0a0a0d}
.glyph::after{content:"";position:absolute;left:5px;top:12px;width:18px;height:2px;border-radius:2px;background:rgba(10,10,13,.5)}
.brand{font-family:"Playfair Display",serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand b{color:var(--gold)}
.sub{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bp{display:inline-flex;align-items:center;font:inherit;font-weight:800;font-size:13px;letter-spacing:.02em;padding:7px 14px;border-radius:999px;border:1.5px solid var(--gold);color:#17130a;background:linear-gradient(135deg,var(--gold2),var(--gold));text-decoration:none;white-space:nowrap}
.bp:hover{filter:brightness(1.08)}
.bp:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.top{flex-wrap:wrap;row-gap:8px}
.lang{margin-left:auto;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.lang:hover{border-color:var(--gold);color:var(--gold2)}
.studio{width:100%;max-width:1240px;margin:0 auto;padding:0 calc(18px + env(safe-area-inset-right,0px)) 0 calc(18px + env(safe-area-inset-left,0px));display:grid;gap:22px}
.intro{padding:28px 0 0}
.intro h1{margin:0 0 10px;font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(30px,6.2vw,50px);line-height:1.05;letter-spacing:-.02em}
.intro h1 span{color:var(--gold2);font-style:italic}
.intro p{margin:0;color:var(--mute);font-size:16px;line-height:1.55;max-width:560px}
.stagebox{margin-top:20px;background:linear-gradient(180deg,#17171d,#0f0f14);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,4vw,34px) clamp(14px,3vw,30px) 18px}
.shadow{filter:drop-shadow(0 26px 34px rgba(0,0,0,.65))}
.scene{perspective:1500px;cursor:pointer;max-width:620px;margin:0 auto}
.tilt{transform-style:preserve-3d;transition:transform .18s ease-out}
.inner{position:relative;aspect-ratio:1050/600;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.75,.2,1)}
.inner.flip{transform:rotateY(180deg)}
.inner canvas{position:absolute;inset:0;width:100%;height:100%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#cvB{transform:rotateY(180deg)}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.ic{font:inherit;font-size:20px;line-height:1;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--p2);color:var(--ink);cursor:pointer}
.ic:hover{border-color:var(--gold);color:var(--gold2)}
.tn{min-width:150px;text-align:center;font-weight:700;font-size:14px;color:var(--ink)}
.tn small{display:block;color:var(--mute);font-weight:600;font-size:12px;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--p2)}
.seg button{font:inherit;font-weight:700;font-size:13px;border:0;background:transparent;color:var(--mute);padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130a}
.hint{margin:14px 0 0;text-align:center;color:var(--mute);font-size:13px;font-weight:600}
.hint.sample{color:var(--gold2)}
.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:20px}
.card+.card{margin-top:14px}
.step{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-weight:800;font-size:17px}
.step i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold2);font-size:12px;font-weight:800}
.step em{font-style:normal;font-weight:600;color:var(--mute);font-size:13px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld span{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;font-weight:600;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--p2);color:var(--ink);outline:none}
input::placeholder{color:#5f5d69;font-weight:500}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,178,106,.14)}
button:focus-visible,label:focus-within,a:focus-visible{outline:3px solid rgba(216,178,106,.5);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:700;font-size:15px;padding:14px 14px;border-radius:12px;border:1.5px solid var(--gold);cursor:pointer;color:#17130a;background:linear-gradient(135deg,var(--gold2),var(--gold));text-align:center}
.btn:active{transform:scale(.985)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--gold);color:var(--gold2)}
.btn.wa{background:#25d366;border-color:#25d366;color:#052e16}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{display:none;align-items:center;gap:12px;margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#112017;border:1px solid #1f4d33;color:#a7f3c4;font-size:14px;font-weight:700}
.ok.on{display:flex}
.ok img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff}
.ok img.lg{border-radius:8px;object-fit:contain;padding:3px}
.ok button{margin-left:auto;background:none;border:0;color:#b8b6c2;font:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tpl{font:inherit;padding:6px 6px 9px;border-radius:14px;border:1.5px solid var(--line);background:var(--p2);cursor:pointer;display:grid;gap:7px;text-align:center;color:var(--ink)}
.tpl canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.tpl span{font-size:12px;font-weight:700;color:var(--mute)}
.tpl[aria-pressed=true]{border-color:var(--gold);background:#211c10}
.tpl[aria-pressed=true] span{color:var(--gold2)}
.lbl{margin:18px 0 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lbl:first-of-type{margin-top:0}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw button{height:40px;border-radius:10px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(216,178,106,.25)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pick label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;background:var(--p2);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.pick input{width:42px;height:34px;border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--p2);color:var(--mute);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--gold);color:var(--gold2);background:#211c10}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.acts{display:grid;gap:10px;margin-top:14px}
.err{display:none;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:#2a1215;border:1px solid #6b2229;color:#fecaca;font-size:14px;font-weight:700}
.err.on{display:block}
.note{display:none;margin:0;padding:12px 14px;border-radius:12px;background:#112017;border:1px solid #1f4d33;color:#a7f3c4;font-size:14px;line-height:1.45;font-weight:600}
.note.on{display:block}
.note kbd{font:inherit;font-weight:800;background:#16a34a;color:#fff;border-radius:6px;padding:1px 7px}
.elx{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--gold);color:#17130a;font-weight:800;font-size:13px;padding:10px 15px;border-radius:999px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}

}

<body>
<header class="top"><div class="glyph" aria-hidden="true"></div><div class="brand">Card<b>Pro</b></div><span class="sub" data-i="sub"></span><a class="bp" href="https://easylandx.github.io/mac/badgepro.html" target="_blank" rel="noopener">BadgePro</a><button class="lang" id="lang" type="button"></button></header>

<main class="studio">
 <div class="intro">

  <p data-i="lead"></p>
 </div>

 <section class="stagecol" aria-label="Preview">
  <div class="stagebox">

   <p class="hint" id="hint" data-i="hint"></p>

  </div>

  <div class="card" style="margin-top:14px">

    <p class="note" id="note" role="status"></p>
    <button class="btn sec" id="restart" type="button" data-i="restart"></button>
   </div>
  </div>
 </section>

 <section class="ctrlcol">
  <div class="card">
   <p class="step"><i>1</i><span data-i="s1"></span> <em data-i="opt"></em></p>
   <div class="two">
    <label class="btn" for="f1" tabindex="0" data-i="selfie"></label>
    <label class="btn sec" for="f2" tabindex="0" data-i="upload"></label>
   </div>
   <p class="ok" id="phOk"><img id="phImg" alt=""><span data-i="phReady"></span><button type="button" id="phRm" data-i="rm"></button></p>
   <div style="height:10px"></div>
   <label class="btn sec" for="f3" tabindex="0" data-i="logo"></label>
   <p class="ok" id="lgOk"><img class="lg" id="lgImg" alt=""><span data-i="lgReady"></span><button type="button" id="lgRm" data-i="rm"></button></p>
  </div>

  <div class="card">
   <p class="step"><i>2</i><span data-i="s2"></span></p>
   <label class="fld"><span data-i="fName"></span><input type="text" id="nm" placeholder="Alex Morgan" autocomplete="name" maxlength="34"></label>
   <label class="fld"><span data-i="fJob"></span><input type="text" id="jb" placeholder="Creative Director" autocomplete="organization-title" maxlength="42"></label>
   <label class="fld"><span data-i="fCo"></span><input type="text" id="co" placeholder="Northwind Studio" autocomplete="organization" maxlength="30"></label>
   <label class="fld"><span data-i="fTag"></span><input type="text" id="tg" placeholder="Design that moves people" maxlength="46"></label>
   <div class="grid2">
    <label class="fld"><span data-i="fPh"></span><input type="tel" id="ph" placeholder="+34 600 123 456" autocomplete="tel" maxlength="22"></label>
    <label class="fld"><span data-i="fEm"></span><input type="email" id="em" placeholder="alex@northwind.studio" autocomplete="email" maxlength="44"></label>
    <label class="fld"><span data-i="fWeb"></span><input type="text" id="wb" placeholder="northwind.studio" autocapitalize="none" autocomplete="url" maxlength="40"></label>
    <label class="fld"><span data-i="fAd"></span><input type="text" id="ad" placeholder="Madrid, Spain" autocomplete="street-address" maxlength="44"></label>
   </div>
  </div>

  <div class="card">
   <p class="step"><i>3</i><span data-i="s3"></span></p>
   <div class="gal" id="gal"></div>
  </div>

  <div class="card">
   <p class="step"><i>4</i><span data-i="s4"></span></p>
   <p class="lbl" data-i="colors"></p>
   <div class="sw" id="sw"></div>
   <div class="pick">
    <label><span data-i="accent"></span><input type="color" id="cAc" aria-label="Accent color"></label>
    <label><span data-i="bgc"></span><input type="color" id="cBg" aria-label="Background color"></label>
   </div>
   <button class="btn sec" id="rc" type="button" data-i="resetC"></button>
   <p class="lbl" data-i="typeface"></p><div class="chips" id="tfC"></div>
   <p class="lbl" data-i="finish"></p><div class="chips" id="finC"></div>
   <p class="lbl" data-i="corners"></p><div class="chips" id="corC"></div>
   <p class="lbl" data-i="backS"></p>
   <label class="chk"><input type="checkbox" id="qrchk" checked><span data-i="qr"></span></label>
  </div>
 </section>
</main>

 $('cAc').value=ac;$('cBg').value=bg;
 [...$('sw').children].forEach((b,i)=>b.setAttribute('aria-pressed',ov.bg===PAL[i][0]&&ov.ac===PAL[i][1]));
 [...$('gal').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===cur));
 $('sample').style.display=d.any?'none':'block'}

/* gallery */
const gal=$('gal'),thumbs=[];
TPL.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='tpl';b.setAttribute('aria-pressed',i===0);
 const c=document.createElement('canvas');c.width=315;c.height=180;b.appendChild(c);const s=document.createElement('span');s.textContent=t[0];b.appendChild(s);
 b.onclick=()=>{cur=i;ov={ac:null,bg:null};render();window.scrollTo({top:0,behavior:'smooth'})};gal.appendChild(b);thumbs.push(c)});
function drawThumbs(){const d=getD();thumbs.forEach((c,i)=>{const t=TPL[i];drawCard(c.getContext('2d'),c.width/W,0,t,t[2],t[3],d,{rad:30,fin:'matte',font:null})})}
let tmr=0;const later=()=>{clearTimeout(tmr);tmr=setTimeout(drawThumbs,260)};
const live=()=>{schedule();later()};

PAL.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Color scheme '+(i+1));b.setAttribute('aria-pressed','false');
 b.style.background=`linear-gradient(135deg,${p[0]} 50%,${p[1]} 50%)`;b.onclick=()=>{ov.bg=p[0];ov.ac=p[1];render()};$('sw').appendChild(b)});

/* chips */
function chips(){
 const mk=(el,items,get,set)=>{el.innerHTML='';items.forEach(([v,k])=>{const b=document.createElement('button');b.type='button';b.textContent=tr(k);b.setAttribute('aria-pressed',get()===v);b.onclick=()=>{set(v);chips();render()};el.appendChild(b)})};
 mk($('tfC'),[[null,'tf0'],['d','tf1'],['s','tf2'],['g','tf3']],()=>fontSel,v=>fontSel=v);
 mk($('finC'),[['matte','fm'],['gloss','fg'],['linen','fl']],()=>finish,v=>finish=v);
 mk($('corC'),[['round','cr'],['sq','cs']],()=>corner,v=>corner=v)}

/* language */
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
 $('lang').textContent=lang==='en'?'Español':'English';
 chips();render();drawThumbs()}
$('lang').onclick=()=>{lang=lang==='en'?'es':'en';applyLang()};

/* uploads */
function readImg(file,cb){if(!file)return;const img=new Image();img.onload=()=>cb(img);img.src=URL.createObjectURL(file)}
['f1','f2'].forEach(id=>$(id).addEventListener('change',e=>{readImg(e.target.files[0],img=>{photoImg=img;$('phImg').src=img.src;$('phOk').classList.add('on');live()});e.target.value=''}));
$('f3').addEventListener('change',e=>{readImg(e.target.files[0],img=>{logoImg=img;$('lgImg').src=img.src;$('lgOk').classList.add('on');live()});e.target.value=''});
$('phRm').onclick=()=>{photoImg=null;$('phOk').classList.remove('on');live()};
$('lgRm').onclick=()=>{logoImg=null;$('lgOk').classList.remove('on');live()};
document.querySelectorAll('label.btn').forEach(l=>l.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();l.click()}}));
['nm','jb','co','tg','ph','em','wb','ad'].forEach(id=>$(id).addEventListener('input',()=>{hideErr();live()}));

/* controls */
const go=n=>{cur=(cur+n+TPL.length)%TPL.length;ov={ac:null,bg:null};render()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('cAc').oninput=e=>{ov.ac=e.target.value;if(!ov.bg)ov.bg=TPL[cur][2];render()};
$('cBg').oninput=e=>{ov.bg=e.target.value;if(!ov.ac)ov.ac=TPL[cur][3];render()};
$('rc').onclick=()=>{ov={ac:null,bg:null};render()};
$('qrchk').onchange=e=>{useQR=e.target.checked;render()};
function setSide(v){side=v;$('inner').classList.toggle('flip',v===1);$('sF').setAttribute('aria-pressed',v===0);$('sB').setAttribute('aria-pressed',v===1)}
$('sF').onclick=()=>setSide(0);$('sB').onclick=()=>setSide(1);$('scene').onclick=()=>setSide(side?0:1);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
$('scene').addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||reduce)return;const r=$('scene').getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;$('tilt').style.transform=`rotateX(${(-y*10).toFixed(2)}deg) rotateY(${(x*14).toFixed(2)}deg)`});
$('scene').addEventListener('pointerleave',()=>{$('tilt').style.transform=''});

function showErr(m){const e=$('err');e.textContent=m;e.classList.add('on');e.scrollIntoView({behavior:'smooth',block:'center'})}
function hideErr(){$('err').classList.remove('on')}
const note=h=>{const n=$('note');n.innerHTML=h;n.classList.add('on')};
const need=()=>{if(!$('nm').value.trim()){showErr(tr('errName'));return false}hideErr();return true};

/* export */
const blobOf=c=>new Promise(r=>c.toBlob(r,'image/png'));
const slug=()=>($('nm').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||'card';
function dl(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('saveF').onclick=async()=>{if(!need())return;dl(await blobOf(cvF),`card-front-${slug()}.png`)};
$('saveB').onclick=async()=>{if(!need())return;dl(await blobOf(cvB),`card-back-${slug()}.png`)};
$('vcfb').onclick=()=>{if(!need())return;dl(new Blob([vcf(getD())],{type:'text/vcard'}),`${slug()}.vcf`)};
$('sheet').onclick=async()=>{
 if(!need())return;await loadFonts();
 const t=TPL[cur],[bg,ac]=colors(),d=getD(),o={...opts(),rad:0},x0=190,y0=254;
 for(const s of[0,1]){
  const c=document.createElement('canvas');c.width=2480;c.height=3508;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,2480,3508);
  for(let r=0;r<5;r++)for(let k=0;k<2;k++)drawCard(x,1,s,t,bg,ac,d,o,x0+k*W,y0+r*H);
  x.strokeStyle='#444';x.lineWidth=2;x.beginPath();
  for(let k=0;k<=2;k++){const X=x0+k*W;x.moveTo(X,y0-44);x.lineTo(X,y0-10);x.moveTo(X,y0+5*H+10);x.lineTo(X,y0+5*H+44)}
  for(let r=0;r<=5;r++){const Y=y0+r*H;x.moveTo(x0-44,Y);x.lineTo(x0-10,Y);x.moveTo(x0+2*W+10,Y);x.lineTo(x0+2*W+44,Y)}
  x.stroke();dl(await blobOf(c),`cards-${s?'back':'front'}-a4-${slug()}.png`);await sleep(450)}
 note(tr('sheetOk'))};
const MOB=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const MSG='My business card. Made with CardPro\nhttps://easylandx.github.io/mac/cardpro.html';
$('wa').onclick=async()=>{
 if(!need())return;
 const cvS=side?cvB:cvF,sn=side?'back':'front';
 if(!MOB){
  let cp=Promise.reject();try{cp=navigator.clipboard.write([new ClipboardItem({'image/png':blobOf(cvS)})])}catch(e){}
  const w=window.open('https://web.whatsapp.com/send?text='+encodeURIComponent(MSG),'_blank');if(!w)location.href='https://web.whatsapp.com/send?text='+encodeURIComponent(MSG);
  let ok=true;try{await cp}catch(e){ok=false}if(!ok)dl(await blobOf(cvS),`card-${sn}-${slug()}.png`);
  note(ok?tr('waCopied'):tr('waSaved'));return}
 const fb=await blobOf(cvS),files=[new File([fb],`card-${sn}.png`,{type:'image/png'})];
 if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share({files,text:MSG});return}catch(e){if(e.name==='AbortError')return}}
 dl(fb,`card-${sn}-${slug()}.png`);window.open('https://wa.me/?text='+encodeURIComponent(MSG),'_blank')};
$('restart').onclick=()=>{
 photoImg=null;logoImg=null;cur=0;ov={ac:null,bg:null};fontSel=null;finish='matte';corner='round';useQR=true;$('qrchk').checked=true;
 ['nm','jb','co','tg','ph','em','wb','ad'].forEach(id=>$(id).value='');
 $('phOk').classList.remove('on');$('lgOk').classList.remove('on');$('note').classList.remove('on');hideErr();setSide(0);chips();render();drawThumbs();window.scrollTo({top:0,behavior:'smooth'})};
['gesturestart','gesturechange','gestureend'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));

async function loadFonts(){try{await Promise.all([...[500,600,700,800].flatMap(w=>[`${w} 40px "Manrope"`,`${w} 40px "Playfair Display"`]),'500 40px "Space Grotesk"','600 40px "Space Grotesk"','700 40px "Space Grotesk"','500 20px "IBM Plex Mono"','600 20px "IBM Plex Mono"'].map(f=>document.fonts.load(f)))}catch(e){}}
applyLang();loadFonts().then(()=>{render();drawThumbs()});
</script>
</body>
</html>
