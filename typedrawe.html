<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TypeDraw"><meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href='data:application/manifest+json,{"name":"TypeDraw","short_name":"TypeDraw","display":"fullscreen","orientation":"any"}'>
<title>TypeDraw</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Roboto+Condensed:wght@400;500&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#15161a;color:#eee;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y}
#sp{height:400vh}
body{margin:0}
.device{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 22px 1fr;grid-template-rows:1fr;background:#0b0b0d;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);perspective:2000px;touch-action:pan-y}
.device>*{grid-row:1}
.scr{position:relative;overflow:hidden;background:#fffdf5;border-radius:2%/1.6%;grid-column:1}
#sr{grid-column:3}
.hinge{grid-column:2;background:linear-gradient(90deg,#000,#34353b 50%,#000)}
.paper{position:absolute;inset:0;background:linear-gradient(to right,transparent calc(var(--m) - 1px),#e9a0a0 0 calc(var(--m) + 1px),transparent 0),repeating-linear-gradient(to bottom,transparent 0 calc(5% - 2px),#a9c8e8 0 5%),#fffdf5}
.scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,#0003,transparent 9%)}
#sr::after{background:linear-gradient(to right,#0003,transparent 9%)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tab{position:absolute;bottom:0;width:17%;height:12%;z-index:3;background:linear-gradient(135deg,#e2dbc6,#b9b199);cursor:pointer;touch-action:none}
.tab.r{right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.tab.l{left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
.flap{display:none;grid-column:1;background-size:100% 100%;border-radius:2%/1.6%;z-index:5;box-shadow:0 0 28px #0009;transform-origin:right center;pointer-events:none}
#fr{grid-column:3;transform-origin:left center}
.ti{position:absolute;border:0;border-bottom:1px dashed #888;background:transparent;outline:0;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;font-weight:500;padding:0;line-height:1;z-index:4}
.brand{font:700 20px Caveat,cursive;color:#e8d9a8}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6px);z-index:10;display:flex;gap:2px;align-items:center;background:#0006;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;padding:2px 6px}
.bar button,.bar a{font:600 11px Inter,system-ui,sans-serif;background:none;color:#fff;border:0;border-radius:14px;padding:6px 8px;cursor:pointer;text-decoration:none;opacity:.85}
.bar button.on{background:#e8d9a8;color:#222;opacity:1}
#epx{font-size:10px;opacity:.55}
#mm{position:fixed;z-index:11;display:none;flex-direction:column;gap:2px;background:#15161af2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #fff2;border-radius:14px;padding:6px;box-shadow:0 6px 24px #000a;max-width:calc(100vw - 24px)}
#mm button{display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;font:600 13px Inter,system-ui,sans-serif;color:#fff;background:none;border:0;border-radius:9px;padding:7px 12px;text-align:left;cursor:pointer;opacity:.92}
#mm button small{font:500 10px Inter,system-ui,sans-serif;opacity:.55;white-space:nowrap}
#mm button.on{background:#e8d9a8;color:#222;opacity:1}
#mm button:active{background:#fff3;color:#fff}
#mstop{display:none;margin-top:3px;border-top:1px solid #fff2;border-radius:0 0 9px 9px;justify-content:center!important;color:#ff9b8f!important}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#000c;padding:9px 14px;border-radius:10px;font-size:13px;display:none;z-index:20}
/* portrait: one page */
.pt .device{grid-template-columns:minmax(0,1fr);place-items:center;perspective:1400px;padding-top:max(env(safe-area-inset-top),8px);padding-left:max(env(safe-area-inset-left),10px);padding-right:max(env(safe-area-inset-right),10px)}
.pt .device>*{grid-area:1/1}
.pt .scr,.pt .flap{width:var(--pw,100%);height:var(--ph,100%);justify-self:center;align-self:center}
.pt #sr,.pt .hinge{display:none}
.pt #fl,.pt #fr{grid-area:1/1;transform-origin:left center}
.pt .scr::after{background:linear-gradient(to right,#0003,transparent 7%)}
.edge{display:none;position:absolute;top:0;bottom:0;width:9%;z-index:2;touch-action:none}
.edge.l{left:0}.edge.r{right:0}
.pt .edge{display:block}
#tr2{display:none}
.pt #tr2{display:block}
.pt .tab{width:18%;height:8%}
.pt .bar{left:6px;right:6px;transform:none;margin-left:auto;margin-right:auto;width:max-content;max-width:calc(100% - 12px);flex-wrap:wrap;justify-content:center;border-radius:16px;padding-top:3px;padding-bottom:3px;padding-left:4px;padding-right:4px}
.pt .bar button,.pt .bar a{font-size:10.5px;padding:6px}
.pt #epx{font-size:10px}
.pt #toast{bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:calc(100vw - 32px);text-align:center}
</style></head><body>

<div class="device" id="dev">
  <div class="scr" id="sl"><div class="paper"></div><canvas id="cl"></canvas><div class="edge l" id="edl"></div><div class="edge r" id="edr"></div><div class="tab l" id="tl" title="Página anterior"></div><div class="tab r" id="tr2" title="Página siguiente"></div></div>
  <div class="hinge"></div>
  <div class="scr" id="sr"><div class="paper"></div><canvas id="cr"></canvas><div class="tab r" id="tr" title="Página siguiente"></div></div>
  <div class="flap" id="fl"></div><div class="flap" id="fr"></div>
</div>

<div class="bar"><button id="ai" title="Modo IA">✨ AI</button><button id="cz" title="Pollock">🎨 Pollock</button><button id="mo" title="Más pintores">Más ▾</button><button id="er" title="Borrador">🧽</button><button id="rs" title="Reiniciar cuaderno">↺</button><button id="clr" title="Borrar">🗑</button><button id="save" title="Guardar">💾</button><button id="wa">WhatsApp</button><a id="epx" href="https://easylandx.github.io" target="_blank" rel="noopener">easylandx</a></div>
<div id="toast"></div><div id="mm"></div><div id="sp"></div>

<script>
let W=720;const H=800,$=s=>document.querySelector(s),mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const cv={L:$('#cl'),R:$('#cr')},dev=$('#dev');
const LINK='https://easylandx.github.io/mac/typedrawe.html',INK='#1c3fd1',PEN=6,FONT='500 34px "Roboto Condensed","Arial Narrow",Arial,sans-serif',ND=$('#ai');
const mqP=matchMedia('(orientation:portrait)'),barEl=$('.bar'),NB={};
let PT=mqP.matches,SD=PT?['L']:['L','R'],LIM=PT?60:30;
const newSp=()=>PT?{L:mk()}:{L:mk(),R:mk()};
function room(){dev.style.paddingBottom=PT?`calc(env(safe-area-inset-bottom) + ${barEl.offsetHeight+14}px)`:'';const cs=getComputedStyle(dev);return{w:dev.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h:dev.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)}}
function wLand(){const a=Math.max(screen.width,screen.height),b=Math.min(screen.width,screen.height);return Math.max(400,Math.round(H*((a-22)/2)/b))}
function wPort(){const r=room();return Math.max(300,Math.min(720,Math.round(H*r.w/r.h)))}
function fit(){if(PT){const r=room(),s=Math.min(r.w/W,r.h/H);dev.style.setProperty('--pw',W*s+'px');dev.style.setProperty('--ph',H*s+'px')}else room();document.querySelectorAll('.paper').forEach(q=>q.style.setProperty('--m',(90/W*100)+'%'))}
document.body.classList.toggle('pt',PT);W=PT?wPort():wLand();fit();
cv.L.width=cv.R.width=W;cv.L.height=cv.R.height=H;
const cx={L:cv.L.getContext('2d'),R:cv.R.getContext('2d')};
let sp=[newSp()],cur=0,mode='pen',busy=0,aiOn=0,dr=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),frame=()=>new Promise(r=>requestAnimationFrame(r));
const toast=(m,ms)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms||6000)};
const lab=()=>{};
function store(){for(const s of SD){const g=sp[cur][s].getContext('2d');g.clearRect(0,0,W,H);g.drawImage(cv[s],0,0)}}
function live(s,c){cx[s].clearRect(0,0,W,H);cx[s].drawImage(c,0,0)}
function paper(g){g.fillStyle='#fffdf5';g.fillRect(0,0,W,H);g.lineWidth=2;g.strokeStyle='#a9c8e8';for(let y=40;y<H;y+=40){g.beginPath();g.moveTo(0,y-1);g.lineTo(W,y-1);g.stroke()}g.strokeStyle='#e9a0a0';g.beginPath();g.moveTo(90,0);g.lineTo(90,H);g.stroke()}
function img(c){const t=mk(),g=t.getContext('2d');paper(g);g.drawImage(c,0,0);return 'url('+t.toDataURL('image/jpeg',.85)+')'}

/* drawing */
const pos=(c,e)=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
function ink(s,a,b){const g=cx[s],er=mode=='erase';g.globalCompositeOperation=er?'destination-out':'source-over';g.strokeStyle=INK;g.lineWidth=er?40:PEN;g.lineCap=g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.globalCompositeOperation='source-over'}
function txt(s,p){const c=cv[s],r=c.getBoundingClientRect(),k=r.width/W,fs=34,y=Math.max(32,Math.round(p.y/40)*40-8),i=document.createElement('input');
  i.className='ti';i.style.cssText=`left:${p.x*k}px;top:${(y-fs*.8)*k}px;font-size:${fs*k}px;color:${INK};width:${(W-p.x-10)*k}px`;
  c.parentNode.appendChild(i);i.focus();let done=0;
  const fin=()=>{if(done)return;done=1;if(i.value){const g=cx[s];g.font=FONT;g.fillStyle=INK;g.fillText(i.value,p.x,y)}i.remove();setTimeout(onRes,300)};
  i.onblur=fin;i.onkeydown=ev=>{if(ev.key=='Enter')fin()}}
for(const s of['L','R']){const c=cv[s];
  c.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();const p=pos(c,e);c.setPointerCapture(e.pointerId);dr={s,sx:p.x,sy:p.y,x:p.x,y:p.y,mv:0}});
  c.addEventListener('pointermove',e=>{if(!dr||dr.s!=s)return;const p=pos(c,e);if(!dr.mv){if(Math.hypot(p.x-dr.sx,p.y-dr.sy)<8)return;dr.mv=1}ink(s,dr,p);dr.x=p.x;dr.y=p.y});
  c.addEventListener('pointerup',()=>{if(dr&&dr.s==s&&!dr.mv&&mode!='erase')txt(s,{x:dr.sx,y:dr.sy});dr=null});
  c.addEventListener('pointercancel',()=>dr=null)}
$('#er').onclick=()=>{mode=mode=='erase'?'pen':'erase';$('#er').classList.toggle('on',mode=='erase')};

/* page flip */
async function go(d,force){
  const n=cur+d;if(busy||n<0||n>=LIM)return;busy=1;store();
  if(n==sp.length)sp.push(newSp());
  const o=sp[cur],t=sp[n],fL=$('#fl'),fR=$('#fr');
  const A=(el,a,b,ease)=>el.animate([{transform:`rotateY(${a}deg)`},{transform:`rotateY(${b}deg)`}],{duration:330,easing:ease,fill:'forwards'}).finished;
  if(PT){const f=fR,run=(a,b,ease)=>{const an=f.animate([{transform:`rotateY(${a}deg)`},{transform:`rotateY(${b}deg)`}],{duration:420,easing:ease,fill:'forwards'});return an.finished.then(()=>an)};let an;
    if(d>0){f.style.backgroundImage=img(o.L);f.style.display='block';cur=n;live('L',t.L);an=await run(0,-90,'ease-in');f.style.display='none';an.cancel()}
    else{f.style.backgroundImage=img(t.L);f.style.display='block';an=await run(-90,0,'ease-out');cur=n;live('L',t.L);f.style.display='none';an.cancel()}
    busy=0;return}
  if(d>0){fR.style.backgroundImage=img(o.R);fR.style.display='block';cur=n;live('R',t.R);lab();
    await A(fR,0,-90,'ease-in');fR.style.display='none';
    fL.style.backgroundImage=img(t.L);fL.style.display='block';await A(fL,90,0,'ease-out');live('L',t.L);fL.style.display='none'}
  else{fL.style.backgroundImage=img(o.L);fL.style.display='block';cur=n;live('L',t.L);lab();
    await A(fL,0,90,'ease-in');fL.style.display='none';
    fR.style.backgroundImage=img(t.R);fR.style.display='block';await A(fR,-90,0,'ease-out');live('R',t.R);fR.style.display='none'}
  busy=0}
function sw(el,def,noAI){let x0=null;
  el.addEventListener('pointerdown',e=>{if(el===dev&&e.target!==dev&&!e.target.classList.contains('hinge'))return;x0=e.clientX;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointercancel',()=>x0=null);
  el.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)go(dx<0?1:-1);else if(def)go(def);else if(!noAI&&Math.abs(dx)<12){const n=Date.now();if(n-(sw.t||0)<450){sw.t=0;ai()}else sw.t=n}})}
sw($('#tl'),-1);sw($('#tr'),1);sw($('#tr2'),1);sw(dev,0);sw($('#edl'),0,1);sw($('#edr'),0,1);

addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});
$('#clr').onclick=()=>{if(busy)return;if(confirm(PT?'¿Borrar esta página?':'¿Borrar las dos páginas de este par?')){for(const s of SD)cx[s].clearRect(0,0,W,H)}};
document.addEventListener('gesturestart',e=>e.preventDefault());

/* save + share */
const toFile=c=>new Promise(r=>c.toBlob(b=>r(new File([b],'typedraw.png',{type:'image/png'})),'image/png'));
function shot(){const c=document.createElement('canvas');c.width=PT?W+60:2*W+120;c.height=H+60;const g=c.getContext('2d');
  if(PT){g.fillStyle='#0b0b0d';g.fillRect(0,0,c.width,c.height);g.save();g.translate(30,30);paper(g);g.drawImage(cv.L,0,0);g.restore();return toFile(c)}
  g.fillStyle='#0b0b0d';g.fillRect(0,0,c.width,c.height);
  [['L',30],['R',W+90]].forEach(([s,x])=>{g.save();g.translate(x,30);paper(g);g.drawImage(cv[s],0,0);g.restore()});
  const h=g.createLinearGradient(W+30,0,W+90,0);h.addColorStop(0,'#000');h.addColorStop(.5,'#34353b');h.addColorStop(1,'#000');g.fillStyle=h;g.fillRect(W+30,30,60,H);
  return new Promise(r=>c.toBlob(b=>r(new File([b],'typedraw.png',{type:'image/png'})),'image/png'))}
function dl(f){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='typedraw-'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const canShare=f=>navigator.canShare&&navigator.canShare({files:[f]});
$('#save').onclick=async()=>{const f=await shot();
  if(canShare(f)&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({files:[f],title:'TypeDraw'});return}catch(e){if(e.name=='AbortError')return}}
  dl(f);toast('Guardado. En el móvil, usa Compartir y luego Guardar imagen para añadirla a Fotos.')};
$('#wa').onclick=async()=>{const f=await shot(),MSG='Hecho con TypeDraw ✍️ '+LINK,WEB='https://web.whatsapp.com/send?text='+encodeURIComponent(MSG);
  /* phones: native share sheet (WhatsApp is in it) */
  if(matchMedia('(pointer:coarse)').matches&&canShare(f)){try{await navigator.share({files:[f],text:MSG});return}catch(e){if(e.name=='AbortError')return}}
  /* web: copy the image, tell the person to paste it, then open WhatsApp Web */
  let ok=0;try{await navigator.clipboard.write([new ClipboardItem({'image/png':f})]);ok=1}catch(e){}
  if(ok)toast('¡Imagen copiada! Se abrirá WhatsApp Web: elige un contacto y pulsa Ctrl+V (Cmd+V en Mac) para pegar la imagen. El texto del mensaje ya está escrito.',8000);
  else{dl(f);toast('Imagen descargada. Se abrirá WhatsApp Web: elige un contacto y adjunta la imagen (o arrástrala al chat). El texto del mensaje ya está escrito.',8000)}
  setTimeout(()=>open(WEB,'_blank'),ok?2800:2000)};

/* AI mode */
const C=(x,y,r,a0=0,a1=6.283,n=28)=>Array.from({length:n+1},(_,i)=>{const a=a0+(a1-a0)*i/n;return[x+r*Math.cos(a),y+r*Math.sin(a)]});
const rays=(x,y,r1,r2,n)=>Array.from({length:n},(_,i)=>{const a=6.283*i/n;return[[x+r1*Math.cos(a),y+r1*Math.sin(a)],[x+r2*Math.cos(a),y+r2*Math.sin(a)]]});
const gull=(x,y,s)=>[[x-12*s,y],[x-6*s,y-6*s],[x,y],[x+6*s,y-6*s],[x+12*s,y]];
const wave=y=>Array.from({length:24},(_,i)=>[5+i*4,y+5*Math.sin(i*.9)]);
const EL=(x,y,a,b,n=24)=>Array.from({length:n+1},(_,i)=>{const t=6.283*i/n;return[x+a*Math.cos(t),y+b*Math.sin(t)]});
const ART=[
['Persigue el sol',()=>[C(50,50,17),...rays(50,50,24,40,10)]],
['Hazlo con amor',()=>[Array.from({length:41},(_,i)=>{const t=6.283*i/40;return[50+2.4*16*Math.pow(Math.sin(t),3),46-2.4*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]})]],
['Pide un deseo a una estrella',()=>[[0,1,2,3,4,5].map(i=>{const a=-1.571+i*2.513;return[50+40*Math.cos(a),54+40*Math.sin(a)]}),C(14,16,3),C(86,22,2.5)]],
['Sueña bajo la luna',()=>[C(50,50,32),C(40,42,6),C(58,62,9),C(62,36,4),C(10,12,2),C(90,86,2)]],
['Florece donde estés plantado',()=>{const s=[[[50,66],[50,98]],[[50,86],[64,78],[50,94]],C(50,40,8)];for(let i=0;i<6;i++){const a=i*1.047;s.push(C(50+17*Math.cos(a),40+17*Math.sin(a),10))}return s}],
['Crece despacio, mantente firme',()=>[[[45,98],[45,62]],[[55,98],[55,62]],C(50,38,28),C(40,34,3),C(58,44,3),C(52,24,3)]],
['Primero café, luego magia',()=>[[[22,40],[22,72],[30,88],[58,88],[66,72],[66,40],[22,40]],C(68,56,12,-1.5,1.5,14),[[34,30],[38,22],[34,14],[38,6]],[[50,30],[54,22],[50,14],[54,6]]]],
['Apunta más alto que el cielo',()=>[[[50,4],[62,30],[62,66],[38,66],[38,30],[50,4]],C(50,38,6),[[38,50],[26,74],[38,66]],[[62,50],[74,74],[62,66]],[[44,70],[50,96],[56,70]]]],
['Fluye con la corriente',()=>[[[40,34],[40,6],[64,28],[40,28]],[[30,34],[70,34],[62,44],[38,44],[30,34]],wave(58),wave(74),wave(90)]],
['Deja volar tus pensamientos',()=>[gull(50,56,2.2),gull(22,24,1.2),gull(78,20,1.4)]],
['Los pequeños pasos escalan montañas',()=>[[[4,90],[34,34],[50,56],[68,22],[96,90],[4,90]],[[27,48],[34,34],[41,48]],[[61,36],[68,22],[75,36]],C(84,12,7)]]
,
['Sonríe, es gratis',()=>[C(50,50,38,0,6.283,36),C(37,40,4,0,6.283,10),C(63,40,4,0,6.283,10),C(50,52,24,.35,2.79,16)]],
['Mantén viva la curiosidad',()=>[C(42,42,28,0,6.283,32),[[62,62],[92,92]],[[57,67],[87,97]],C(42,42,20,3.6,5,8)]],
['Sé luz en la oscuridad',()=>[[[38,52],[62,52],[62,96],[38,96],[38,52]],[[50,52],[50,44]],[[50,42],[42,30],[50,8],[58,30],[50,42]],[[44,60],[44,90]]]],
['Hogar es donde está el corazón',()=>[[[10,50],[50,12],[90,50]],[[20,44],[20,92],[80,92],[80,44]],[[42,92],[42,64],[58,64],[58,92]],[[68,30],[68,14],[78,14],[78,38]],C(50,40,5,0,6.283,10)]],
['La lluvia hace crecer las flores',()=>[[[24,52],[16,44],[20,32],[32,30],[40,18],[56,16],[66,26],[78,28],[86,40],[80,52],[24,52]],[[30,62],[26,76]],[[46,62],[42,76]],[[62,62],[58,76]],[[76,62],[72,76]],[[38,80],[34,94]],[[54,80],[50,94]]]],

  return{base:'#aebdc9',len:28,wid:7,k:1.6,per:18,
  col(x,y){
    const d=Math.hypot(x-su[0],y-su[1]);
    if(y<hz){
      if(d<su[2])return pk(['#f26b21','#ff8a3d','#e8541a']);
      if(d<su[2]*2.4&&Math.random()<.5)return pk(['#f8b27a','#f4c9a0','#f6a560']);
      return pk(['#9fb5c8','#b8c4cc','#d6b8a0','#e8c4a8','#8aa0b8','#c8a898','#f0d0b0'])}
    if(Math.abs(x-su[0])<(y-hz)*.1+16&&Math.random()<.6)return pk(['#f4883a','#f8a65a','#e8703a']);
    return pk(['#3f5f78','#4d7088','#6a8aa0','#2f4c63','#7f9db0','#58788f'])},
  ang(x,y){return y<hz?Math.sin(x/80)*.15:Math.sin(x/35+y/20)*.1},
  async post(g,ok){
    const nb=ri(2,3);
    for(let i=0;i<nb&&ok();i++){
      const bx=rnd(.15,.85)*W,by=hz+rnd(.1,.28)*H,s=rnd(.8,1.3);
      g.fillStyle='#1e2f3d';g.strokeStyle='#1e2f3d';g.lineCap='round';
      g.beginPath();g.moveTo(bx-42*s,by);g.lineTo(bx+42*s,by);g.lineTo(bx+28*s,by+12*s);g.lineTo(bx-30*s,by+12*s);g.closePath();g.fill();
      await frame();
      g.lineWidth=3;g.beginPath();g.moveTo(bx,by);g.lineTo(bx+2*s,by-48*s);g.stroke();
      g.beginPath();g.moveTo(bx-24*s,by-4*s);g.lineTo(bx-8*s,by-6*s);g.lineTo(bx+4*s,by-10*s);g.stroke();
      await frame()}}}}
function hay(){
  const hz=H*.6,hs=[rnd(.3,.62)*W,H*.7,rnd(.17,.24)*W,rnd(.15,.21)*H],
  inH=(x,y)=>{const dx=(x-hs[0])/hs[2],dy=(y-hs[1])/hs[3];return y<hs[1]+6&&dx*dx+dy*dy<1};
  return{base:'#f0c9a0',len:28,wid:7,k:1.6,per:18,
  col(x,y){
    if(inH(x,y))return x<hs[0]+(hs[1]-y)*.25-hs[2]*.1?pk(['#f2b24a','#f6c968','#e89a3c','#f8d98a']):pk(['#a05a8a','#7a4a90','#c06a7a','#5c4a8a','#8a5aa0']);
    if(y>hz){
      if(x>hs[0]&&y>hs[1]-6&&y<hs[1]+60&&x<hs[0]+W*.5)return pk(['#7a5a9a','#5a4a8a','#9a6aa0','#6a5aa0']);
      return pk(['#d8b04a','#c8a03c','#8fa84a','#e8c868','#b8b050','#f0d27a'])}
    return Math.random()<y/hz?pk(['#f4a98a','#f6c9a0','#e8a0b0','#f9dcb0','#f2b0a0']):pk(['#b8a0d0','#8fb0e0','#a9b8e0','#c8b0d8'])},
  ang(x,y){if(inH(x,y))return Math.atan2(y-hs[1],x-hs[0])+1.57;return y>hz?Math.sin(x/50)*.2:Math.sin(x/70+y/30)*.12}}}

const PP=[['#c9a66b','#8c6d46','#d8c9a8','#6b5a47','#a39071','#3e3a33','#e6d5b0'],['#2e4a7d','#6b8cae','#c9d6e3','#e8b24a','#c4452d','#2d6a4f','#d98ca0','#f0e1c0']];
async function poly(g,pts,fill,ok,T,o={}){
  g.lineJoin=g.lineCap='round';

  g.lineWidth=o.w||4;g.strokeStyle=o.c||'#14110e';
  if(o.anim){for(let i=0;i<pts.length&&ok();i++){const a=pts[i],b=pts[(i+1)%pts.length];g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();await T(1)}}
  else{g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.stroke();await T(2)}}
const circ=(g,x,y,r,f,lw=4)=>{g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle=f;g.fill();g.lineWidth=lw;g.strokeStyle='#14110e';g.stroke()},
bar=(g,p,q,w)=>{g.lineWidth=w;g.strokeStyle='#14110e';g.lineCap='round';g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()};

/* ---------- limbs: shared by Leonardo (ink) and Michelangelo (red chalk) ---------- */
async function ln(g,pts,ok,T,w=1.5,c=INKC,al=.9){
  g.lineCap=g.lineJoin='round';g.strokeStyle=c;g.lineWidth=w;g.globalAlpha=al;
  for(let i=1;i<pts.length&&ok();i++){g.beginPath();g.moveTo(pts[i-1][0],pts[i-1][1]);g.lineTo(pts[i][0],pts[i][1]);g.stroke();await T(4)}
  g.globalAlpha=1}
async function limb(g,a,b,ra,rb,o,ok,T){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,N=Math.max(6,L/8|0),bul=o.bul??.18,sd=o.side||1,hh=Math.round(N*(o.h||1)),
  P=(t,k)=>{const r=(ra+(rb-ra)*t)*(1+bul*Math.sin(Math.PI*t));return[a[0]+dx*t+nx*r*k,a[1]+dy*t+ny*r*k]};
  g.lineCap=g.lineJoin='round';g.strokeStyle=o.c;
  for(const k of[-1,1]){
    if(!ok())return;
    g.lineWidth=o.w;g.globalAlpha=.9;g.beginPath();
    for(let i=0;i<=N;i++){const p=P(i/N,k);i?g.lineTo(p[0]+rnd(-.5,.5),p[1]+rnd(-.5,.5)):g.moveTo(p[0],p[1])}
    g.stroke();await T(2)}
  g.lineWidth=o.w*.55;
  for(let i=0;i<=hh&&ok();i++){
    const t=i/hh,p=P(t,sd),q=P(Math.min(1,t+.1),sd*(1-2*rnd(.3,.95)));
    g.globalAlpha=rnd(.3,.55);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();await T(3)}
  g.globalAlpha=1}

/* ---------- Leonardo da Vinci: notebook studies ---------- */
const NOTES=['Ostinato rigore','Imparare sempre','Saper vedere','La semplicità è somma perfezione','Ogni ostacolo si piega alla ferma volontà','Il moto è causa d’ogni vita','Studia prima la scienza','La pittura è poesia muta','Chi poco pensa, assai erra'];
async function notes(g,x,y,w,ok,T,n=3){
  g.fillStyle=INKC;g.globalAlpha=.85;g.font='700 23px Caveat,cursive';
  for(let i=0;i<n&&ok();i++){
    let t=pk(NOTES);while(t&&g.measureText(t).width>w)t=t.slice(0,Math.max(0,t.lastIndexOf(' ')));
    if(!t)continue;
    const yy=y+i*30;
    for(let j=0;j<t.length&&ok();j++){
      const off=g.measureText(t.slice(0,j)).width;
      g.save();g.translate(x+w-off,yy);g.scale(-1,1);g.fillText(t[j],0,0);g.restore();
      if(t[j]!=' ')await T(2)}}
  g.globalAlpha=1}
async function vit(g,x,y,s,ok,T){

  await ln(g,jit(C(x,y-s*.34,s*.06,0,6.4,18),.4),ok,T,1.4);
  await limb(g,[x,y-s*.26],[x,y+s*.04],s*.09,s*.07,{...o,bul:.06},ok,T);
  for(const k of[-1,1]){
    const S=[x+k*s*.09,y-s*.25],H0=[x+k*s*.04,y+s*.04];
    await limb(g,S,[x+k*s*.42,y-s*.22],s*.035,s*.025,{...o,side:k},ok,T);
    await limb(g,S,[x+k*s*.36,y-s*.38],s*.035,s*.025,{...o,side:-k},ok,T);
    await limb(g,H0,[x+k*s*.07,y+s*.4],s*.05,s*.03,{...o,side:k},ok,T);
    await limb(g,H0,[x+k*s*.27,y+s*.4],s*.05,s*.03,{...o,side:-k},ok,T)}}
const gearP=(x,y,r,n,rot)=>{const p=[];for(let i=0;i<n;i++){const a0=rot+i*6.283/n,d=6.283/n;for(const[da,rr]of[[0,.8],[d*.18,.8],[d*.3,1],[d*.62,1],[d*.74,.8]]){const a=a0+da;p.push([x+r*rr*Math.cos(a),y+r*rr*Math.sin(a)])}}p.push(p[0]);return p};

    await ln(g,jit(C(c[0],c[1],r*.16,0,6.4,16),.3),ok,T,1.2);
