<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Mayne">
<meta name="theme-color" content="#000000">
<title>La Mayne</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:#000;-webkit-text-size-adjust:100%}
  body{background:#000;color:#f3e6b0;font-family:Georgia,"Times New Roman",serif;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .hero{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transition:opacity .12s linear;pointer-events:none}
  #off{opacity:0}
  .hero.is-off #off{opacity:1}
  .hero.is-off #on{opacity:0}
  #rain{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #flash{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 60% 20%,rgba(235,240,255,.95),rgba(170,190,255,.6) 60%,rgba(120,140,220,.4));opacity:0}
  .hero.storm #rain{opacity:1}
  #stormBtn{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,217,120,.45);background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#ffd978;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .2s,box-shadow .2s,color .2s}
  #stormBtn svg{width:24px;height:24px}
  #stormBtn.active{background:rgba(255,217,120,.22);box-shadow:0 0 14px rgba(255,200,80,.5);color:#fff1c2}
  .film{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:80px max(28px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));text-align:center;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));pointer-events:none}
  .film a{pointer-events:auto;display:inline-block;max-width:100%;color:#ffd978;font-size:1.2rem;line-height:1.5;text-decoration:none;border-bottom:1px solid rgba(255,217,120,.5);padding-bottom:4px;text-shadow:0 0 12px rgba(255,200,80,.5),0 1px 6px rgba(0,0,0,.9)}
  .film a:active{opacity:.7}
  .spacer{height:160px;background:#000}
</style>
</head>

<script>
(function(){
  var hero=document.getElementById('hero');
  var isOff=false, busy=false, ctx=null;

  function getCtx(){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!ctx) ctx=new AC();
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }

  function noiseBuffer(c,sec){
    var n=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }

  // Neon buzz: 100Hz mains hum with harmonics + crackle, gated by a flicker pattern
  function buzz(turningOn){
    var c=getCtx(); if(!c) return;
    var t0=c.currentTime;
    var master=c.createGain(); master.gain.value=0; master.connect(c.destination);

    var hum=[[100,.5,'sawtooth'],[200,.3,'square'],[300,.15,'sawtooth'],[50,.25,'sine']];
    var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; lp.connect(master);
    var oscs=hum.map(function(h){
      var o=c.createOscillator(), g=c.createGain();
      o.type=h[2]; o.frequency.value=h[0]; g.gain.value=h[1]*0.18;
      o.connect(g); g.connect(lp); o.start(t0); return o;
    });

    var nb=c.createBufferSource(); nb.buffer=noiseBuffer(c,2); nb.loop=true;
    var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.8;
    var ng=c.createGain(); ng.gain.value=0.05;
    nb.connect(bp); bp.connect(ng); ng.connect(master); nb.start(t0);

    var g=master.gain, pattern, end;
    if(turningOn){
      // flickers then settles into a steady buzz
      pattern=[[0,.9],[.05,0],[.11,.8],[.16,0],[.24,1],[.29,.1],[.33,0],[.42,.9],[.47,.3],[.52,1],[.6,.55]];
      end=1.0;
      pattern.forEach(function(p){ g.setValueAtTime(p[1],t0+p[0]); });
      g.setTargetAtTime(0,t0+.75,.09);
    } else {
      pattern=[[0,1],[.04,.2],[.08,1],[.14,.1],[.19,.7]];
      end=.45;
      pattern.forEach(function(p){ g.setValueAtTime(p[1],t0+p[0]); });
      g.setTargetAtTime(0,t0+.2,.04);
      // final zap
      var z=c.createOscillator(), zg=c.createGain();
      z.type='square'; z.frequency.setValueAtTime(1400,t0); z.frequency.exponentialRampToValueAtTime(90,t0+.12);
      zg.gain.setValueAtTime(.06,t0); zg.gain.exponentialRampToValueAtTime(.0001,t0+.14);
      z.connect(zg); zg.connect(c.destination); z.start(t0); z.stop(t0+.2);
    }
    setTimeout(function(){
      try{oscs.forEach(function(o){o.stop()}); nb.stop(); master.disconnect();}catch(e){}
    }, end*1000+400);
  }

  // Visual flicker that matches the sound
  function flicker(turningOn,done){
    var steps = turningOn
      ? [[0,1],[60,0],[120,1],[180,0],[260,1],[320,0],[400,1],[470,.5],[540,1]]
      : [[0,0],[60,1],[110,0],[170,1],[230,0]];
    // value 1 = lit image visible, 0 = dark image visible
    steps.forEach(function(s){
      setTimeout(function(){ hero.classList.toggle('is-off', s[1]===0); }, s[0]);
    });
    var last=steps[steps.length-1][0]+20;
    setTimeout(function(){ hero.classList.toggle('is-off', !turningOn); done(); }, last);
  }

  function toggle(){
    if(busy) return;
    busy=true;
    var turningOn=isOff; // currently off -> turn on
    buzz(turningOn);
    flicker(turningOn,function(){ isOff=!turningOn; busy=false; });
  }

  hero.addEventListener('click',toggle);
  document.getElementById('film').addEventListener('click',function(e){e.stopPropagation();});
})();
</script>
<script>
(function(){
  var hero=document.getElementById('hero'), btn=document.getElementById('stormBtn');
  var cv=document.getElementById('rain'), g=cv.getContext('2d'), flash=document.getElementById('flash');
  var on=false, raf=0, drops=[], W=0, H=0, dpr=Math.min(window.devicePixelRatio||1,2);
  var ctx=null, rainGain=null, rainSrc=null, thunderTimer=0, flashTimers=[];

  function size(){
    W=hero.clientWidth; H=hero.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/2600); drops=[];
    for(var i=0;i<n;i++) drops.push(mk(true));
  }
  function mk(rand){
    var z=Math.random();
    return {x:Math.random()*(W+120)-60,y:rand?Math.random()*H:-30,l:10+z*22,v:14+z*16,a:.15+z*.4,w:.6+z*.8};
  }
  function draw(){
    g.clearRect(0,0,W,H);
    g.lineCap='round';
    var wind=-0.22;
    for(var i=0;i<drops.length;i++){
      var d=drops[i];
      g.strokeStyle='rgba(200,215,240,'+d.a+')'; g.lineWidth=d.w;
      g.beginPath(); g.moveTo(d.x,d.y); g.lineTo(d.x+d.l*wind,d.y+d.l); g.stroke();
      d.y+=d.v; d.x+=d.v*wind;
      if(d.y>H+30||d.x<-80){ drops[i]=mk(false); }
    }
    raf=requestAnimationFrame(draw);
  }

  function getCtx(){
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    if(!ctx) ctx=new AC(); if(ctx.state==='suspended') ctx.resume(); return ctx;
  }
  function noise(c,sec){
    var n=Math.floor(c.sampleRate*sec), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1; return b;
  }
  function startRainSound(){
    var c=getCtx(); if(!c) return;
    rainSrc=c.createBufferSource(); rainSrc.buffer=noise(c,3); rainSrc.loop=true;
    var hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=700;
    var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7500;
    rainGain=c.createGain(); rainGain.gain.value=0;
    rainSrc.connect(hp); hp.connect(lp); lp.connect(rainGain); rainGain.connect(c.destination);
    rainSrc.start(); rainGain.gain.setTargetAtTime(.14,c.currentTime,.5);
  }
  function stopRainSound(){
    if(!rainSrc||!ctx) return;
    var s=rainSrc, gn=rainGain; gn.gain.setTargetAtTime(0,ctx.currentTime,.25);
    setTimeout(function(){try{s.stop();gn.disconnect();}catch(e){}},1200);
    rainSrc=null; rainGain=null;
  }
  function thunder(){
    var c=getCtx(); if(!c) return;
    var t=c.currentTime, s=c.createBufferSource(); s.buffer=noise(c,5);
    var lp=c.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(420,t); lp.frequency.exponentialRampToValueAtTime(60,t+3.5);
    var gn=c.createGain(); gn.gain.setValueAtTime(0,t);
    gn.gain.linearRampToValueAtTime(.9,t+.08);
    gn.gain.setTargetAtTime(.35,t+.2,.4);
    gn.gain.setTargetAtTime(0,t+1.6,.8);
    s.connect(lp); lp.connect(gn); gn.connect(c.destination); s.start(t); s.stop(t+4.5);
  }
  function lightning(){
    if(!on) return;
    var seq=[[0,.9],[70,.1],[130,1],[220,.25],[300,0]];
    seq.forEach(function(s){ flashTimers.push(setTimeout(function(){
      flash.style.transition='opacity '+(s[1]?'40ms':'220ms')+' linear'; flash.style.opacity=s[1];
    },s[0])); });
    flashTimers.push(setTimeout(function(){ if(on) thunder(); }, 450+Math.random()*1600));
  }
  function schedule(){
    thunderTimer=setTimeout(function(){ lightning(); schedule(); }, 4000+Math.random()*8000);
  }

  function toggle(e){
    e.stopPropagation();
    on=!on;
    btn.classList.toggle('active',on); btn.setAttribute('aria-pressed',on);
    hero.classList.toggle('storm',on);
    if(on){
      size(); cancelAnimationFrame(raf); draw(); startRainSound();
      thunderTimer=setTimeout(function(){ lightning(); schedule(); },1500);
    } else {
      cancelAnimationFrame(raf); stopRainSound(); clearTimeout(thunderTimer);
      flashTimers.forEach(clearTimeout); flashTimers=[]; flash.style.opacity=0;
      setTimeout(function(){ if(!on) g.clearRect(0,0,W,H); },650);
    }
  }
  btn.addEventListener('click',toggle);
  window.addEventListener('resize',function(){ if(on) size(); });
})();
</script>
</body>
</html>
