<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>easylandx</title>
<style>
  :root{
    --cream: #fdf6e3;
    --ivory: #fffaf0;
    --champagne: #f7e7ce;
    --gold: #c9a24b;
    --gold-dark: #a9822f;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    min-height:100%;
    background: radial-gradient(circle at 50% 20%, var(--ivory), var(--champagne) 60%, var(--cream) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:40px 20px;
  }
  .frame{
    position:relative;
    width:min(90vw, 420px);
    aspect-ratio: 720 / 1280;
    border-radius: 28px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(169,130,47,0.25), 0 4px 14px rgba(0,0,0,0.08);
  }
  .frame img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }
  .video-mask{
    position:absolute;
    left:8.06%;
    top:14.7%;
    width:85.55%;
    height:66.9%;
    overflow:hidden;
    border-radius: 46% 46% 42% 42% / 22% 22% 16% 16%;
    background:#000;
  }
  .video-mask iframe{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    aspect-ratio: 9 / 16;
    transform: translate(-50%, -50%);
    border:0;
    pointer-events:none;
  }
  .cta{
    display:inline-block;
    padding:14px 38px;
    border-radius:999px;
    text-decoration:none;
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    color:#fffaf0;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    box-shadow: 0 8px 22px rgba(169,130,47,0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(169,130,47,0.45);
  }
</style>
</head>
<body>
  <div class="page">
    <div class="frame">
      <img src="w2.jpg" alt="">
      <div class="video-mask">
        <iframe
          src="https://www.youtube.com/embed/oYtU7jb9X4c?autoplay=1&mute=1&loop=1&playlist=oYtU7jb9X4c&controls=0&modestbranding=1&rel=0&playsinline=1&showinfo=0"
          title="video"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
    </div>
    <a class="cta" href="https://easylandx.github.io" target="_blank" rel="noopener">easylandx</a>
  </div>
</body>
</html>
