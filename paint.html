<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Paint</title>
<style>
:root{--bg:#fff4c9;--bg2:#ffd6ec;--ink:#2b1b4d;--card:#ffffffcc;--accent:#7c3aed;--accent2:#ff7a1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff4c9;--bg2:#ffd6ec;--ink:#2b1b4d}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
background:linear-gradient(135deg,var(--bg),var(--bg2) 50%,#cfe6ff);background-attachment:fixed;
padding:20px clamp(18px,6vw,56px) 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.7rem;margin:6px 0 4px}
p.sub{margin:0 0 16px;opacity:.8;line-height:1.45}
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px #7c3aed33}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
.stage video{transition:opacity .2s}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(160deg,#ffe066,#ff8fb8,#9b8cff);text-align:center;padding:24px;z-index:3}
.start p{margin:0;max-width:300px;line-height:1.4}
button{font:inherit;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent)}
button.alt{background:var(--accent2)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0002}
.panel{margin-top:16px;background:var(--card);border-radius:20px;padding:16px;display:grid;gap:14px;backdrop-filter:blur(8px)}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}
.sw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0003;cursor:pointer}
.sw i.on{outline:3px solid var(--ink)}
.rb{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem}
#msg{font-size:.85rem;min-height:1.2em;opacity:.85}
.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid #fff;border-radius:50%;pointer-events:none;display:none;z-index:2;transform:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>✨ Light Paint</h1>
  <p class="sub">Dim the room, hold a bright light (another phone's flashlight works great) in front of the selfie camera and draw in the air.</p>
  <div class="stage" id="stage">
    <video id="v" playsinline muted></video>
    <canvas id="paint"></canvas>
    <div class="dot" id="dot"></div>
    <div class="start" id="start">
      <p><b>Ready to paint?</b><br>Allow the camera, then wave a light around. No light? Draw with your finger.</p>
      <button id="go">Start camera</button>
    </div>
  </div>
  <div class="panel">
    <div id="msg">Camera is off.</div>
    <div class="sw" id="sw"></div>
    <label>Brush size <input type="range" id="size" min="3" max="40" value="14"></label>
    <label>Light sensitivity <input type="range" id="sens" min="10" max="120" value="55"></label>
    <label>Camera brightness <input type="range" id="dim" min="0" max="100" value="35"></label>
    <label class="chk"><input type="checkbox" id="fade"> Trails fade away</label>
    <div class="row">
      <button class="ghost" id="clear">Clear</button>
      <button class="alt" id="save">Save image</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const v=$('v'),paint=$('paint'),pc=paint.getContext('2d'),dot=$('dot'),stage=$('stage');
const det=document.createElement('canvas');det.width=96;det.height=128;
const dc=det.getContext('2d',{willReadFrequently:true});
let color='rainbow',hue=0,running=false,last=null,lost=99,sm=null,pointerDown=false;
const cols=['rainbow','#ffffff','#ffe14a','#ff4fa3','#3fc7ff','#8b5cff','#ff7a1a','#39e58c'];
cols.forEach((c,i)=>{const e=document.createElement('i');e.className=c==='rainbow'?'rb on':'';if(c!=='rainbow')e.style.background=c;
e.onclick=()=>{color=c;[...$('sw').children].forEach(x=>x.classList.remove('on'));e.classList.add('on')};$('sw').appendChild(e)});
function size(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
if(paint.width!==Math.round(r.width*d)){const t=document.createElement('canvas');t.width=paint.width;t.height=paint.height;
t.getContext('2d').drawImage(paint,0,0);paint.width=Math.round(r.width*d);paint.height=Math.round(r.height*d);pc.drawImage(t,0,0,paint.width,paint.height)}}
size();addEventListener('resize',size);
function style(){if(color==='rainbow'){hue=(hue+2)%360;return `hsl(${hue},100%,60%)`}return color}
function seg(a,b){const c=style(),w=+$('size').value*(paint.width/stage.clientWidth);
pc.globalCompositeOperation='lighter';pc.lineCap='round';pc.lineJoin='round';
pc.shadowColor=c;pc.shadowBlur=w*1.6;pc.strokeStyle=c;pc.lineWidth=w*.7;
pc.beginPath();pc.moveTo(a.x,a.y);pc.lineTo(b.x,b.y);pc.stroke();
pc.shadowBlur=0;pc.strokeStyle='#fff';pc.lineWidth=w*.25;
pc.beginPath();pc.moveTo(a.x,a.y);pc.lineTo(b.x,b.y);pc.stroke()}
// map video coords (cover) to canvas
function map(nx,ny){const W=paint.width,H=paint.height,vw=v.videoWidth||3,vh=v.videoHeight||4;
const s=Math.max(W/vw,H/vh),ox=(W-vw*s)/2,oy=(H-vh*s)/2;return{x:ox+nx*vw*s,y:oy+ny*vh*s}}
function find(){const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
// crop video to the 3:4 detection frame (cover)
const ta=det.width/det.height,va=vw/vh;let sw=vw,sh=vh,sx=0,sy=0;
if(va>ta){sw=vh*ta;sx=(vw-sw)/2}else{sh=vw/ta;sy=(vh-sh)/2}
dc.drawImage(v,sx,sy,sw,sh,0,0,det.width,det.height);
const d=dc.getImageData(0,0,det.width,det.height).data,th=255-(+$('sens').value)*1.2-30;
let n=0,X=0,Y=0,tot=0;
for(let i=0,p=0;i<d.length;i+=4,p++){const l=Math.max(d[i],d[i+1],d[i+2]);
if(l>th&&Math.min(d[i],d[i+1],d[i+2])>th*.55){const w=l-th;const x=p%det.width,y=(p/det.width)|0;X+=x*w;Y+=y*w;tot+=w;n++}}
if(n<2||n>det.width*det.height*.25)return null;
// normalised coords within the cropped frame -> full video normalised
return{nx:(sx+(X/tot/det.width)*sw)/vw,ny:(sy+(Y/tot/det.height)*sh)/vh}}
function loop(){if(!running)return;
if($('fade').checked){pc.globalCompositeOperation='destination-out';pc.fillStyle='rgba(0,0,0,.035)';pc.fillRect(0,0,paint.width,paint.height)}
const f=find();
if(f){const p=map(f.nx,f.ny);sm=sm?{x:sm.x+(p.x-sm.x)*.6,y:sm.y+(p.y-sm.y)*.6}:p;
if(last&&lost<6)seg(last,sm);last={...sm};lost=0;
const r=stage.getBoundingClientRect(),k=r.width/paint.width;
dot.style.display='block';dot.style.left=(r.width-sm.x*k)+'px';dot.style.top=(sm.y*k)+'px'}
else{lost++;dot.style.display='none';if(lost>6){sm=null}}
requestAnimationFrame(loop)}
$('go').onclick=async()=>{
try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
v.srcObject=s;await v.play();$('start').style.display='none';running=true;
$('msg').textContent='Looking for a bright light… hold it steady in view.';loop()}
catch(e){$('start').style.display='none';$('msg').textContent='Camera unavailable ('+e.name+'). Draw with your finger instead, or open this page directly in your browser.'}};
$('dim').oninput=e=>v.style.opacity=e.target.value/100;v.style.opacity=.35;
$('clear').onclick=()=>{pc.globalCompositeOperation='source-over';pc.clearRect(0,0,paint.width,paint.height);last=null};
$('save').onclick=()=>{const t=document.createElement('canvas');t.width=paint.width;t.height=paint.height;const c=t.getContext('2d');
c.fillStyle='#000';c.fillRect(0,0,t.width,t.height);c.translate(t.width,0);c.scale(-1,1);c.drawImage(paint,0,0);
const a=document.createElement('a');a.download='light-paint.png';a.href=t.toDataURL('image/png');a.click()};
// finger fallback
function pt(e){const r=stage.getBoundingClientRect(),k=paint.width/r.width;return{x:(r.right-e.clientX)*k,y:(e.clientY-r.top)*k}}
stage.addEventListener('pointerdown',e=>{if($('start').style.display!=='none'&&$('start').style.display!=='')return;pointerDown=true;last=pt(e);lost=0;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!pointerDown)return;const p=pt(e);seg(last,p);last=p});
stage.addEventListener('pointerup',()=>{pointerDown=false;last=null});
stage.style.touchAction='none';
</script>
</body>
</html>
