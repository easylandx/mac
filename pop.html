<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Paleta de Playa — Click & Chill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-sea:#043c4a;
    --lagoon:#0fb5c4;
    --foam:#eaf7f5;
    --sand:#f4e9d8;
    --berry:#8a3a6b;
    --berry-dark:#5c2249;
    --coral:#ff8c69;
    --shadow: 0 20px 60px rgba(4,60,74,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, #bdeef0 0%, transparent 60%),
      linear-gradient(180deg, #eafcfb 0%, #dff2ee 35%, var(--sand) 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--deep-sea);
    overflow-x:hidden;
    position:relative;
  }

  /* ambient drifting light */
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(600px 400px at 80% 10%, rgba(255,255,255,0.5), transparent 70%);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{ from{transform:translate(0,0);} to{transform:translate(-40px,30px);} }

  .wrap{
    position:relative; z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:56px 24px 90px;
  }

  header{
    text-align:center;
    margin-bottom:36px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--lagoon); font-weight:700;
    background:rgba(15,181,196,0.1);
    padding:6px 14px; border-radius:999px;
    margin-bottom:18px;
  }
  .eyebrow::before{content:"●"; color:var(--coral); font-size:8px;}

  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(2.4rem, 6vw, 4.2rem);
    line-height:1.02;
    margin:0 0 14px;
    color:var(--deep-sea);
    letter-spacing:-0.01em;
  }
  h1 em{ color:var(--berry); font-style:italic; }

  p.sub{
    max-width:520px;
    margin:0 auto;
    font-size:16.5px;
    line-height:1.6;
    color:#1c5763;
    opacity:0.85;
  }

  /* --- stage --- */
  .stage{
    position:relative;
    display:flex;
    justify-content:center;
    margin:52px auto 20px;
  }

  .pop-frame{
    position:relative;
    width:min(360px, 78vw);
    aspect-ratio: 720/1280;
    border-radius:34px;
    overflow:hidden;
    box-shadow: var(--shadow), 0 0 0 10px rgba(255,255,255,0.55), 0 0 0 11px rgba(4,60,74,0.08);
    cursor:pointer;
    background: var(--deep-sea);
    transform: translateZ(0);
  }
  .pop-frame:active{ transform: scale(0.985); }

  .pop-frame img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition: opacity .38s ease;
    user-select:none; -webkit-user-drag:none;
  }
  .pop-frame img.active{ opacity:1; }

  .tap-hint{
    position:absolute;
    bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(4,60,74,0.55);
    backdrop-filter: blur(6px);
    color:#fff;
    font-size:12.5px;
    letter-spacing:0.05em;
    padding:8px 16px;
    border-radius:999px;
    display:flex; align-items:center; gap:7px;
    pointer-events:none;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .tap-hint svg{width:13px;height:13px;}
  @keyframes pulse{ 0%,100%{opacity:0.9;} 50%{opacity:0.45;} }

  .progress-dots{
    display:flex; gap:8px; justify-content:center;
    margin-top:22px;
  }
  .progress-dots span{
    width:8px; height:8px; border-radius:50%;
    background: rgba(4,60,74,0.18);
    transition: all .35s ease;
  }
  .progress-dots span.active{
    background: var(--berry);
    width:22px; border-radius:6px;
  }

  .bite-counter{
    text-align:center;
    margin-top:14px;
    font-size:13px;
    color:#1c5763;
    opacity:0.7;
    letter-spacing:0.02em;
  }
  .bite-counter b{ color:var(--berry); font-weight:700; }

  /* --- sound toggle --- */
  .sound-btn{
    position:fixed;
    top:20px; right:20px;
    z-index:10;
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    border:1px solid rgba(4,60,74,0.12);
    color:var(--deep-sea);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px; font-weight:500;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(4,60,74,0.12);
    transition: all .25s ease;
  }
  .sound-btn:hover{ background:#fff; transform:translateY(-1px); }
  .sound-btn .bars{ display:flex; align-items:flex-end; gap:2px; height:12px; }
  .sound-btn .bars i{
    display:block; width:2.5px; background:var(--lagoon); border-radius:2px;
    animation: eq 1s ease-in-out infinite;
  }
  .sound-btn.muted .bars i{ animation-play-state:paused; height:3px !important; opacity:0.35; }
  .sound-btn .bars i:nth-child(1){ animation-delay:0s; }
  .sound-btn .bars i:nth-child(2){ animation-delay:.2s; }
  .sound-btn .bars i:nth-child(3){ animation-delay:.4s; }
  @keyframes eq{ 0%,100%{height:4px;} 50%{height:12px;} }

  /* --- footer / cta --- */
  .cta-row{
    margin-top:64px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .cta-line{
    font-size:14.5px; color:#1c5763; opacity:0.75; text-align:center;
    max-width:380px; line-height:1.5;
  }
  .easypagex-btn{
    display:inline-flex; align-items:center; gap:10px;
    background: linear-gradient(135deg, var(--berry), var(--berry-dark));
    color:#fff9f5;
    text-decoration:none;
    font-weight:700;
    font-size:15.5px;
    padding:16px 30px;
    border-radius:999px;
    box-shadow: 0 14px 34px rgba(138,58,107,0.35);
    transition: transform .2s ease, box-shadow .2s ease;
    letter-spacing:0.01em;
  }
  .easypagex-btn:hover{
    transform:translateY(-2px);
    box-shadow: 0 18px 40px rgba(138,58,107,0.45);
  }
  .easypagex-btn .arrow{ transition: transform .2s ease; }
  .easypagex-btn:hover .arrow{ transform:translateX(3px); }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:#1c5763;
    opacity:0.5;
  }

  @media (max-width:480px){
    .wrap{ padding:44px 18px 70px; }
    .sound-btn{ top:14px; right:14px; padding:9px 13px; font-size:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .glow, .tap-hint, .sound-btn .bars i{ animation:none !important; }
  }
</style>
</head>

  <span class="bars"><i></i><i></i><i></i></span>
  <span id="soundLabel">Beach sound</span>
</button>

<script>
(function(){
  const frame = document.getElementById('popFrame');
  const imgs = Array.from(frame.querySelectorAll('img'));
  const dots = Array.from(document.getElementById('dots').children);
  const counter = document.getElementById('biteCounter');
  let current = 0;

  function render(){
    imgs.forEach((img,i)=> img.classList.toggle('active', i===current));
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
    counter.innerHTML = 'Mordisco <b>'+current+'</b> de '+(imgs.length-1);
    const hint = frame.querySelector('.tap-hint');
    if(hint) hint.style.opacity = current===0 ? '1' : '0';
  }

  function next(){
    current = (current+1) % imgs.length;
    render();
    playBite();
  }

  frame.addEventListener('click', next);
  frame.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); next(); }
  });

  /* ---------------- Ambient beach breeze + wave sound (Web Audio, generated) ---------------- */
  let audioCtx = null;
  let waveGain = null;
  let breezeGain = null;
  let started = false;
  let waveTimer = null;

  function buildNoiseBuffer(ctx, seconds){
    const bufferSize = ctx.sampleRate * seconds;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    return buffer;
  }

  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- wave layer: filtered noise with slow amplitude swell ---
    const waveNoise = audioCtx.createBufferSource();
    waveNoise.buffer = buildNoiseBuffer(audioCtx, 4);
    waveNoise.loop = true;

    const waveFilter = audioCtx.createBiquadFilter();
    waveFilter.type = 'lowpass';
    waveFilter.frequency.value = 700;
    waveFilter.Q.value = 0.7;

    waveGain = audioCtx.createGain();
    waveGain.gain.value = 0;

    waveNoise.connect(waveFilter).connect(waveGain).connect(audioCtx.destination);
    waveNoise.start();

    // slow swelling LFO to mimic waves rolling in/out
    const lfo = audioCtx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.11;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.16;
    const lfoOffset = audioCtx.createConstantSource ? audioCtx.createConstantSource() : null;

    lfo.connect(lfoGain);
    lfoGain.connect(waveGain.gain);
    lfo.start();

    // --- breeze layer: higher, softer filtered noise ---
    const breezeNoise = audioCtx.createBufferSource();
    breezeNoise.buffer = buildNoiseBuffer(audioCtx, 4);
    breezeNoise.loop = true;

    const breezeFilter = audioCtx.createBiquadFilter();
    breezeFilter.type = 'bandpass';
    breezeFilter.frequency.value = 2200;
    breezeFilter.Q.value = 0.5;

    breezeGain = audioCtx.createGain();
    breezeGain.gain.value = 0;

    breezeNoise.connect(breezeFilter).connect(breezeGain).connect(audioCtx.destination);
    breezeNoise.start();

    const breezeLfo = audioCtx.createOscillator();
    breezeLfo.type = 'sine';
    breezeLfo.frequency.value = 0.06;
    const breezeLfoGain = audioCtx.createGain();
    breezeLfoGain.gain.value = 0.02;
    breezeLfo.connect(breezeLfoGain);
    breezeLfoGain.connect(breezeGain.gain);
    breezeLfo.start();

    // base levels set via ramps in toggleSound()
    waveGain.gain.setValueAtTime(0, audioCtx.currentTime);
    breezeGain.gain.setValueAtTime(0, audioCtx.currentTime);
  }

  function fadeTo(gainNode, target, time){
    if(!audioCtx) return;
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(target, audioCtx.currentTime + time);
  }

  // short "bite" sound: quick low thud + crackle when clicking
  function playBite(){
    if(!audioCtx) return;
    const t = audioCtx.currentTime;

    const noiseBuf = buildNoiseBuffer(audioCtx, 0.15);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;

    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 1400;
    filt.Q.value = 0.9;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);

    src.connect(filt).connect(g).connect(audioCtx.destination);
    src.start(t);
    src.stop(t+0.18);
  }

  const soundBtn = document.getElementById('soundBtn');
  const soundLabel = document.getElementById('soundLabel');
  let soundOn = false;

  function toggleSound(){
    initAudio();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }

    soundOn = !soundOn;
    soundBtn.classList.toggle('muted', !soundOn);
    soundLabel.textContent = soundOn ? 'Silenciar' : 'Sonido playa';

    if(soundOn){
      fadeTo(waveGain, 0.5, 1.4);
      fadeTo(breezeGain, 0.09, 1.4);
    } else {
      fadeTo(waveGain, 0, 1.0);
      fadeTo(breezeGain, 0, 1.0);
    }
  }

  soundBtn.addEventListener('click', toggleSound);

  render();
})();
</script>
