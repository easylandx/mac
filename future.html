<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Circuits Display</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap">
<style>
:root{--red:#ff2a12;--grn:#2cff3a;--amb:#ffc400;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% 0,#22252b,#0a0b0d 70%) #0a0b0d;color:#d8dade;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:max(env(safe-area-inset-top,0px),24px) max(5vw,16px) max(env(safe-area-inset-bottom,0px),32px)}
.wrap{max-width:920px;margin:0 auto}
h1{font:900 clamp(20px,4vw,30px) Orbitron,sans-serif;letter-spacing:.25em;text-align:center;margin:0 0 6px;color:#e9e6df}
.sub{text-align:center;color:#8f949c;font-size:14px;margin:0 0 22px;line-height:1.5}
.panel{container-type:inline-size;background:linear-gradient(#85898f,#5c5f65 45%,#7b7f86);border:3px solid #34363a;border-radius:10px;padding:14px;box-shadow:0 18px 50px #000a,inset 0 1px 0 #fff4}
.row{font-size:calc((100cqw - 64px) / 17);margin-bottom:12px;background:#17181a;border:2px solid #2b2c2f;border-radius:6px;padding:8px 8px 8px}
.row:last-child{margin-bottom:0}
.red{--c:var(--red)}.grn{--c:var(--grn)}.amb{--c:var(--amb)}
.fields{display:flex;align-items:flex-end;justify-content:center;gap:.3em}
.f{display:flex;flex-direction:column;align-items:center}
.lb{font:700 max(7px,.27em)/1 system-ui,sans-serif;letter-spacing:.06em;background:#4a1d1a;color:#ead9c8;padding:.25em .6em;border-radius:3px;margin-bottom:.35em;border:1px solid #6b2c26}
.cell{position:relative;height:1.35em;background:#050505;border-radius:4px;box-shadow:inset 0 0 8px #000;font-family:Orbitron,"Courier New",monospace;font-weight:900}
.cell.m{width:2.9em}.cell.d,.cell.h,.cell.mi{width:1.9em}.cell.y{width:3.6em}
.gh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--c);opacity:.08;letter-spacing:.05em}
.cell input{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;outline:0;color:var(--c);font:inherit;text-align:center;padding:0;border-radius:4px;caret-color:var(--c);text-transform:uppercase;text-shadow:0 0 .2em var(--c),0 0 .55em var(--c)}
.cell input:focus{box-shadow:inset 0 0 0 2px var(--c)}
.ap{display:flex;flex-direction:column;gap:.2em;font:700 max(7px,.26em) system-ui,sans-serif;color:#d9c8b8;margin:0 .1em .45em}
.ap b{display:flex;align-items:center;gap:.4em;cursor:pointer;user-select:none}
.ap i{width:.8em;height:.8em;border-radius:50%;background:#3a1512;border:1px solid #000}
.ap b.on i{background:var(--c);box-shadow:0 0 .8em var(--c)}
.co{height:1.35em;display:flex;flex-direction:column;justify-content:center;gap:.3em;animation:bl 1s steps(1) infinite}
.co span{width:.14em;height:.14em;background:var(--c);box-shadow:0 0 .4em var(--c)}
@keyframes bl{50%{opacity:.25}}
.cap{margin:.6em auto 0;background:#d4d6d9;color:#1d1d1f;font:700 max(8px,.3em) system-ui,sans-serif;letter-spacing:.14em;text-align:center;padding:.3em 1.2em;width:max-content;max-width:100%;border-radius:2px}
.ctl{margin-top:24px;display:grid;gap:12px}
.ai{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid #3a3d42;background:#141518;color:#eee;font-size:16px}
button{font:700 14px system-ui,sans-serif;letter-spacing:.06em;padding:12px 16px;border-radius:8px;border:1px solid #484b52;background:#23252a;color:#e8e8ea;cursor:pointer}
button:hover{background:#2e3037}button:disabled{opacity:.5;cursor:wait}
.go{background:linear-gradient(#ff8a2a,#d9560a);color:#1a0b00;border-color:#ff9a4a;font-size:16px}
.go:hover{background:linear-gradient(#ff9a40,#e8641a)}
#ai{background:linear-gradient(#35c8ff,#0a7bb5);color:#00131c;border-color:#6fd8ff;min-width:64px}
.btns,.pre{display:flex;flex-wrap:wrap;gap:8px}
.btns>*{flex:1 1 150px}
.pre button{flex:1 1 auto;font-size:12px;padding:9px 10px}
.pre small{flex:1 0 100%;color:#8f949c;font-size:12px}
#st{min-height:1.5em;color:#a7adb6;font-size:14px;text-align:center}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s}
#fl.on{opacity:.95;transition:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>TIME CIRCUITS</h1>
  <p class="sub">Click any display and type. Month takes JAN to DEC or 1 to 12. Tap AM or PM to switch.</p>
  <div class="panel" id="p"></div>
  <div class="ctl">
    <div class="ai"><input id="q" placeholder="Ask the AI for a date, or leave empty for a random past or future event" maxlength="140"><button id="ai">AI</button></div>
    <div class="btns"><button id="rnd">RANDOM DATE</button><button class="go" id="go">ENGAGE</button><button id="rst">RESET</button></div>
    
    <div id="st" aria-live="polite"></div>
  </div>
</div>
<div id="fl"></div>
<script>
const $=id=>document.getElementById(id);
const MON='JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC'.split(' ');
const p2=n=>String(n).padStart(2,'0'),p4=n=>String(n).padStart(4,'0');
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mk(y,m,d,h,mi){const t=new Date(0);t.setUTCFullYear(y,m,d);t.setUTCHours(h,mi,0,0);return t.getTime()}
function dim(y,m){const t=new Date(0);t.setUTCFullYear(y,m+1,0);return t.getUTCDate()}
const S={};
const nowL=()=>Date.now()-new Date().getTimezoneOffset()*6e4;
function reset(){S.dest=mk(1985,9,26,1,21);S.last=mk(1985,9,26,1,20);S.off=0}
reset();
const get=k=>k==='pres'?nowL()+S.off:S[k];
const put=(k,ms)=>{if(k==='pres')S.off=ms-nowL();else S[k]=ms};
const ROWS=[['dest','red','DESTINATION TIME'],['pres','grn','PRESENT TIME'],['last','amb','LAST TIME DEPARTED']];
const fld=(k,f,lb,gh,mode,max)=>`<div class="f"><span class="lb">${lb}</span><div class="cell ${f}"><span class="gh">${gh}</span><input data-f="${f}" maxlength="${max}" inputmode="${mode}" autocomplete="off" spellcheck="false" aria-label="${k} ${lb}"></div></div>`;
$('p').innerHTML=ROWS.map(([k,c,cap])=>`<div class="row ${c}" data-k="${k}"><div class="fields">`+
 fld(k,'m','MONTH','888','text',3)+fld(k,'d','DAY','88','numeric',2)+fld(k,'y','YEAR','8888','numeric',4)+
 `<div class="ap"><b data-v="am"><i></i>AM</b><b data-v="pm"><i></i>PM</b></div>`+
 fld(k,'h','HOUR','88','numeric',2)+`<div class="co"><span></span><span></span></div>`+fld(k,'mi','MIN','88','numeric',2)+
 `</div><div class="cap">${cap}</div></div>`).join('');
const rowEl=k=>document.querySelector(`.row[data-k=${k}]`);
function paint(k){
  const d=new Date(get(k)),h=d.getUTCHours();
  const v={m:MON[d.getUTCMonth()],d:p2(d.getUTCDate()),y:p4(d.getUTCFullYear()),h:p2(h%12||12),mi:p2(d.getUTCMinutes())};
  const r=rowEl(k);
  r.querySelectorAll('input').forEach(i=>{if(document.activeElement!==i)i.value=v[i.dataset.f]});
  r.querySelectorAll('.ap b').forEach(b=>b.classList.toggle('on',(b.dataset.v==='pm')===(h>=12)));
}
const paintAll=()=>ROWS.forEach(r=>paint(r[0]));
function commit(k){
  const r=rowEl(k),old=new Date(get(k)),v=f=>r.querySelector(`[data-f=${f}]`).value.trim().toUpperCase();
  const num=(s,lo,hi,df)=>/^\d+$/.test(s)?Math.min(hi,Math.max(lo,+s)):df;
  let m=old.getUTCMonth();const mv=v('m');
  if(/^\d{1,2}$/.test(mv)&&+mv>=1&&+mv<=12)m=+mv-1;
  else if(mv.length>=2){const i=MON.findIndex(x=>x.startsWith(mv.slice(0,3)));if(i>=0)m=i}
  const y=num(v('y'),0,9999,old.getUTCFullYear());
  const d=num(v('d'),1,dim(y,m),Math.min(old.getUTCDate(),dim(y,m)));
  const h12=num(v('h'),1,12,old.getUTCHours()%12||12),pm=old.getUTCHours()>=12;
  const mi=num(v('mi'),0,59,old.getUTCMinutes());
  put(k,mk(y,m,d,h12%12+(pm?12:0),mi));paint(k);
}
const P=$('p');
P.addEventListener('focusin',e=>{if(e.target.matches('input'))e.target.select()});
P.addEventListener('focusout',e=>{if(e.target.matches('input'))commit(e.target.closest('.row').dataset.k)});
P.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();else if(e.key.length===1)beep(1000+rand(0,400),.04)});
P.addEventListener('click',e=>{
  const b=e.target.closest('.ap b');if(!b)return;
  const k=b.closest('.row').dataset.k,pm=b.dataset.v==='pm',h=new Date(get(k)).getUTCHours();
  if((h>=12)!==pm)put(k,get(k)+(pm?12:-12)*36e5);
  paint(k);beep(700,.05);
});
setInterval(()=>paint('pres'),1000);
paintAll();

let AC;
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function beep(f=1100,d=.05){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;g.gain.value=.03;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function whoosh(){try{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(1400,t+.9);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.12,t+.8);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+1.3)}catch(e){}}
const say=t=>$('st').textContent=t;

function scramble(final,done){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  let n=0;
  const id=setInterval(()=>{
    if(++n>10){clearInterval(id);S.dest=final;paint('dest');if(done)done();return}
    const keep=S.dest;S.dest=mk(rand(0,3000),rand(0,11),rand(1,28),rand(0,23),rand(0,59));paint('dest');S.dest=keep;beep(300+n*90,.03);
  },60);
}
function setDest(y,m,d,h,mi,note){
  d=Math.min(d,dim(y,m));
  scramble(mk(y,m,d,h,mi),()=>say(note||''));
}
$('rnd').onclick=()=>{
  const y=Math.random()<.8?rand(1,2999):rand(1,9999);
  setDest(y,rand(0,11),rand(1,28),rand(0,23),rand(0,59),'Random destination set. Press ENGAGE to travel.');
};
$('rst').onclick=()=>{reset();paintAll();say('Circuits reset. Present time is back on your system clock.');beep(500,.1)};
$('go').onclick=()=>{
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  S.last=get('pres');whoosh();$('fl').classList.add('on');
  setTimeout(()=>{S.off=S.dest-nowL();paintAll();$('fl').classList.remove('on');say('Temporal displacement complete.')},900);
};



const PAST=[[1969,7,20,20,17,'Apollo 11 lands on the Moon.'],[1912,4,15,2,20,'The Titanic slips beneath the Atlantic.'],[1989,11,9,18,57,'The Berlin Wall is about to open.'],[1903,12,17,10,35,'The Wright brothers take flight at Kitty Hawk.'],[1215,6,15,12,0,'King John seals the Magna Carta.'],[1066,10,14,9,0,'The Battle of Hastings begins.'],[1492,10,12,2,0,'Columbus sights land in the Americas.'],[1937,5,6,19,25,'The Hindenburg arrives at Lakehurst.'],[79,8,24,13,0,'Vesuvius erupts over Pompeii (traditional date).'],[1883,8,27,10,2,'Krakatoa explodes.']];
const FUTURE=[[2027,8,2,10,7,'A total solar eclipse crosses Spain and North Africa.'],[2028,7,14,19,0,'The Los Angeles Olympics open.'],[2029,4,13,21,46,'Asteroid Apophis passes closer than our satellites.'],[2038,1,19,3,14,'Old 32-bit Unix clocks roll over.'],[2039,11,12,12,0,'A hopeful first crewed Mars landing (a forecast, not a promise).'],[2061,7,28,12,0,'Halley\u2019s Comet returns.'],[2063,4,5,12,0,'Zefram Cochrane\u2019s first warp flight (a Star Trek date).'],[2100,1,1,0,0,'The year 2100 arrives.'],[2117,12,11,3,0,'The next transit of Venus.'],[3000,1,1,0,0,'The year 3000 arrives.']];
const pickBuilt=why=>{const fut=Math.random()<.5,L=fut?FUTURE:PAST,f=L[rand(0,L.length-1)];setDest(f[0],f[1]-1,f[2],f[3],f[4],(fut?'FUTURE: ':'PAST: ')+f[5]+(why||' Press ENGAGE to travel.'))};
$('ai').onclick=async()=>{
  const btn=$('ai'),q=$('q').value.trim();btn.disabled=true;say('Consulting the flux capacitor...');
  if(!q){pickBuilt();btn.disabled=false;return}
  try{
    const sm=window.claude?await window.claude.use('sample'):null;
    if(!sm)throw{code:'none'};
    const r=await sm.json('You pick destinations for a time machine display. Return ONLY JSON: {"y":year 0-9999,"m":month 1-12,"d":day,"h":hour 0-23,"mi":minute 0-59,"note":"one short fun sentence about the moment"}. '+(q?'The traveler asks for: '+q+'. If unclear, pick the closest famous moment.':'Pick a surprising, fun moment in history or the future.')+' Do not use em dashes.');
    const y=Math.round(+r.y),m=Math.round(+r.m)-1,d=Math.round(+r.d),h=Math.round(+r.h),mi=Math.round(+r.mi);
    if(![y,m,d,h,mi].every(Number.isFinite)||y<0||y>9999||m<0||m>11||h<0||h>23||mi<0||mi>59||d<1)throw{code:'bad'};
    setDest(y,m,d,h,mi,String(r.note||'Destination set.'));
  }catch(e){
    pickBuilt(' (built-in pick, the AI is not available here)');
  }finally{btn.disabled=false}
};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')$('ai').click()});
</script>
</body>
</html>
