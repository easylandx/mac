<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shinkansen View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --win-left: 20.6%;
    --win-right: 73.2%;
    --win-top: 24.0%;
    --win-bottom: 53.7%;
    --win-radius: 15%;
    --gold: #c9a86a;
    --ink: #1a1410;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    position:relative;
    height:100vh;
    width:calc(100vh * 9 / 16);
    max-width:100vw;
    max-height:calc(100vw * 16 / 9);
    overflow:hidden;
    background:#000;
    box-shadow:0 0 60px rgba(0,0,0,0.8);
  }

  .cabin-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:5;
    pointer-events:none;
    user-select:none;
  }

  /* ===== scene clipped into the window shape ===== */
  .window-scene{
    position:absolute;
    left:var(--win-left);
    right:calc(100% - var(--win-right));
    top:var(--win-top);
    bottom:calc(100% - var(--win-bottom));
    border-radius:var(--win-radius);
    overflow:hidden;
    z-index:2;
    background:linear-gradient(180deg,#bfe4f5 0%,#9ed4ee 30%,#dff2e0 62%,#eaf6df 66%);
    transition:background 1.2s ease;
  }
  .window-scene.rain{
    background:linear-gradient(180deg,#7a8a94 0%,#8b98a1 30%,#93a08f 62%,#a3ac96 66%);
  }

  .sun{
    position:absolute;
    top:8%;
    left:12%;
    width:11%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d8, #ffd873 55%, #ffb347 100%);
    box-shadow:0 0 4vw 1vw rgba(255,210,120,0.55);
    z-index:3;
    transition:opacity 1s ease;
  }
  .window-scene.rain .sun{ opacity:0; }

  .clouds{
    position:absolute; inset:0; z-index:3;
    background-repeat:repeat-x;
    background-size:60% 100%;
    opacity:0.55;
    animation:driftClouds 70s linear infinite;
    background-image:
      radial-gradient(ellipse 10% 6% at 10% 20%, rgba(255,255,255,0.85), transparent 70%),
      radial-gradient(ellipse 7% 5% at 30% 15%, rgba(255,255,255,0.7), transparent 70%),
      radial-gradient(ellipse 12% 7% at 55% 25%, rgba(255,255,255,0.8), transparent 70%),
      radial-gradient(ellipse 9% 5% at 80% 18%, rgba(255,255,255,0.65), transparent 70%);
  }
  @keyframes driftClouds{ from{background-position-x:0;} to{background-position-x:-200%;} }

  .far-mountains{
    position:absolute;
    left:0; right:0; bottom:33%;
    height:22%;
    z-index:3;
    background:linear-gradient(180deg, rgba(150,170,190,0.55), rgba(150,170,190,0.15));
    clip-path:polygon(0% 100%,0% 55%,8% 30%,16% 60%,25% 20%,34% 55%,42% 35%,52% 65%,60% 25%,70% 58%,80% 32%,90% 62%,100% 40%,100% 100%);
    opacity:0.7;
  }

  .ground{
    position:absolute;
    left:0; right:0; bottom:0;
    height:34%;
    z-index:4;
    background:linear-gradient(180deg,#8fbf5c 0%,#6ea344 45%,#5c8f39 100%);
  }
  .window-scene.rain .ground{
    background:linear-gradient(180deg,#7c9a6b 0%,#5f7d51 45%,#4e6a43 100%);
  }
  .ground::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(100deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 40px);
  }

  /* ===== scrolling scenery track (emoji parade) ===== */
  .parade-lane{
    position:absolute;
    left:0; width:200%; height:14%;
    z-index:6;
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change:transform;
  }
  .parade-lane .set{
    display:inline-flex;
    align-items:center;
    width:50%;
    justify-content:space-around;
  }
  .parade-lane span{
    font-size:1.0em;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }

  .lane-ground{ bottom:6%; font-size:6vw; animation:paradeLTR 34s linear infinite; }
  .lane-sky{ top:10%; font-size:4vw; animation:paradeLTR 52s linear infinite; opacity:0.9; }

  @keyframes paradeLTR{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  /* opposite-direction express train that occasionally rushes past */
  .express{
    position:absolute;
    bottom:8%;
    right:-15%;
    font-size:5vw;
    z-index:7;
    animation:expressPass 5.5s linear infinite;
    animation-delay:6s;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }
  @keyframes expressPass{
    0%{ right:-15%; opacity:0; }
    5%{ opacity:1; }
    45%{ right:115%; opacity:1; }
    50%{ opacity:0; }
    100%{ right:115%; opacity:0; }
  }

  /* tunnel flash */
  .tunnel-flash{
    position:absolute; inset:0;
    background:#000;
    z-index:9;
    opacity:0;
    pointer-events:none;
  }
  .tunnel-flash.go{
    animation:tunnelFlash 1.1s ease-in-out;
  }
  @keyframes tunnelFlash{
    0%{opacity:0;} 8%{opacity:1;} 70%{opacity:1;} 100%{opacity:0;}
  }

  /* rain overlay */
  .rain-layer{
    position:absolute; inset:0; z-index:8;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.8s ease;
  }
  .rain-layer.on{ opacity:1; }
  .drop{
    position:absolute;
    top:-10%;
    width:1px;
    height:9%;
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(230,240,255,0.65));
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    from{ transform:translateY(0); }
    to{ transform:translateY(1150%); }
  }

  .window-glass-shine{
    position:absolute; inset:0;
    z-index:10;
    background:linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(255,255,255,0.06) 100%);
    pointer-events:none;
  }

  /* ===== UI overlay ===== */
  .ui{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.6em;
    padding:5.4% 6% 4%;
    pointer-events:none;
  }
  .title-badge{
    align-self:flex-start;
    margin-left:0;
    pointer-events:auto;
    font-family:'Cormorant Garamond', serif;
    color:#f3e6c9;
    letter-spacing:0.18em;
    font-size:1.05em;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
    opacity:0.9;
  }
  .controls{
    pointer-events:auto;
    display:flex;
    gap:0.6em;
    margin-top:auto;
    margin-bottom:0.6em;
  }
  .ctrl-btn{
    display:flex;
    align-items:center;
    gap:0.4em;
    background:rgba(20,15,10,0.55);
    border:1px solid rgba(201,168,106,0.5);
    color:#f3e6c9;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.72em;
    letter-spacing:0.05em;
    padding:0.65em 1em;
    border-radius:999px;
    backdrop-filter:blur(6px);
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .ctrl-btn:active{ transform:scale(0.96); }
  .ctrl-btn.active{
    background:rgba(201,168,106,0.85);
    color:#241a0f;
  }
  .footer-link{
    pointer-events:auto;
    font-size:0.62em;
    color:#d9c39a;
    text-decoration:none;
    letter-spacing:0.08em;
    opacity:0.75;
    border-bottom:1px solid rgba(217,195,154,0.35);
    padding-bottom:2px;
  }
  .footer-link:hover{ opacity:1; }

  .top-title{
    position:absolute;
    top:3.2%;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    text-align:center;
    pointer-events:none;
  }
  .top-title h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:italic;
    color:#f6ecd6;
    font-size:1.5em;
    letter-spacing:0.05em;
    text-shadow:0 2px 10px rgba(0,0,0,0.7);
  }
  .top-title p{
    font-size:0.55em;
    color:#cbb98b;
    letter-spacing:0.35em;
    text-transform:uppercase;
    margin-top:0.3em;
  }
</style>
</head>

  <div class="top-title">
    <h1>Shinkansen View</h1>
    <p>GranClass · Tokaido</p>
  </div>

  <div class="ui">
    <div class="controls">
      <button class="ctrl-btn" id="soundBtn">🔊 Train sound</button>
      <button class="ctrl-btn" id="rainBtn">🌧️ Rain</button>
    </div>
    <a class="footer-link" href="https://easyland.github.io" target="_blank" rel="noopener">easyland.github.io</a>
  </div>

</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const windowScene = document.getElementById('windowScene');
  const rainLayer = document.getElementById('rainLayer');
  const rainBtn = document.getElementById('rainBtn');
  const soundBtn = document.getElementById('soundBtn');
  const tunnelFlash = document.getElementById('tunnelFlash');

  /* ---------- build rain drops ---------- */
  const DROP_COUNT = 70;
  for(let i=0;i<DROP_COUNT;i++){
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = (Math.random()*100)+'%';
    const dur = 0.5 + Math.random()*0.5;
    d.style.animationDuration = dur+'s';
    d.style.animationDelay = (Math.random()*2)+'s';
    d.style.opacity = (0.4+Math.random()*0.6).toFixed(2);
    rainLayer.appendChild(d);
  }

  let rainOn = false;
  rainBtn.addEventListener('click', ()=>{
    rainOn = !rainOn;
    rainLayer.classList.toggle('on', rainOn);
    windowScene.classList.toggle('rain', rainOn);
    rainBtn.classList.toggle('active', rainOn);
    if(rainNoiseGain){
      rainNoiseGain.gain.setTargetAtTime(rainOn ? 0.14 : 0, audioCtx.currentTime, 0.4);
    }
  });

  /* ---------- random tunnel flashes ---------- */
  function scheduleTunnel(){
    const delay = 14000 + Math.random()*18000;
    setTimeout(()=>{
      tunnelFlash.classList.add('go');
      if(tunnelBoomFn) tunnelBoomFn();
      setTimeout(()=> tunnelFlash.classList.remove('go'), 1150);
      scheduleTunnel();
    }, delay);
  }
  scheduleTunnel();

  /* ---------- Web Audio: synthesized shinkansen sound ---------- */
  let audioCtx, masterGain, rainNoiseGain, running = false, tunnelBoomFn;
  let clackTimer, humNodes = [];

  function buildNoiseBuffer(ctx, seconds){
    const buffer = ctx.createBuffer(1, ctx.sampleRate*seconds, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){ data[i] = Math.random()*2-1; }
    return buffer;
  }

  function initAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(audioCtx.destination);

    /* continuous rail hum: layered low oscillators + filtered noise */
    const hum1 = audioCtx.createOscillator();
    hum1.type = 'sawtooth';
    hum1.frequency.value = 62;
    const hum2 = audioCtx.createOscillator();
    hum2.type = 'sine';
    hum2.frequency.value = 124;
    const humFilter = audioCtx.createBiquadFilter();
    humFilter.type = 'lowpass';
    humFilter.frequency.value = 340;
    const humGain = audioCtx.createGain();
    humGain.gain.value = 0.5;
    hum1.connect(humFilter);
    hum2.connect(humFilter);
    humFilter.connect(humGain);
    humGain.connect(masterGain);
    hum1.start(); hum2.start();
    humNodes.push(hum1,hum2);

    /* rolling wind/rail noise bed */
    const noiseBuf = buildNoiseBuffer(audioCtx, 4);
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    noiseSrc.loop = true;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 500;
    noiseFilter.Q.value = 0.6;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.22;
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseSrc.start();

    /* rhythmic rail joints (clack) */
    function clack(){
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = 180 + Math.random()*40;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
      o.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t+0.1);
    }
    clackTimer = setInterval(clack, 260);

    /* rain noise bed, silent until toggled */
    const rainBuf = buildNoiseBuffer(audioCtx, 4);
    const rainSrc = audioCtx.createBufferSource();
    rainSrc.buffer = rainBuf;
    rainSrc.loop = true;
    const rainFilter = audioCtx.createBiquadFilter();
    rainFilter.type = 'highpass';
    rainFilter.frequency.value = 2200;
    rainNoiseGain = audioCtx.createGain();
    rainNoiseGain.gain.value = 0.0001;
    rainSrc.connect(rainFilter);
    rainFilter.connect(rainNoiseGain);
    rainNoiseGain.connect(masterGain);
    rainSrc.start();

    /* tunnel boom: brief muffled swell */
    tunnelBoomFn = function(){
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = 90;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 220;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t+0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t+1.0);
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.start(t); o.stop(t+1.05);
    };
  }

  soundBtn.addEventListener('click', ()=>{
    initAudio();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    running = !running;
    masterGain.gain.setTargetAtTime(running ? 0.55 : 0.0001, audioCtx.currentTime, 0.5);
    soundBtn.classList.toggle('active', running);
    soundBtn.textContent = running ? '🔈 Sound on' : '🔊 Train sound';
  });

})();
</script>
