<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 Coral Reef Explorer</title>
<style>
  :root{
    --surface-top:#6FE3EE;
    --surface-bottom:#1CA7B8;
    --lagoon-1:#159FB0;
    --lagoon-2:#0E8098;
    --deep-1:#0B5B73;
    --deep-2:#0A455B;
    --abyss-1:#073246;
    --abyss-2:#04202E;
    --sand:#F2D9A0;
    --sand-dark:#D9B978;
    --sun-core:#FFF6C9;
    --sun-glow:#FFE066;
    --white:#F7F5EF;
    --ink:#062A36;
    --panel-bg:rgba(6,42,54,0.72);

    /* dynamic reef colors — rewritten by JS as health changes */
    --c-brain:#FF6F91;
    --c-brain-line:#E23F68;
    --c-staghorn:#FF9E4F;
    --c-fan:#B565A7;
    --c-fan-line:#8C4384;
    --c-anemone:#FF7EB3;
    --c-anemone-tip:#FFD34D;
    --c-clam-1:#5FD6C7;
    --c-clam-2:#2E9E8F;
    --c-tube:#FFD34D;
    --ring-color:#5FE0C4;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    background:var(--abyss-2);
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body{ display:flex; flex-direction:column; }

  section{ display:block; width:100%; line-height:0; position:relative; }

  svg{ display:block; width:100%; height:auto; }

  /* ---------- creatures ---------- */
  .critter{
    position:absolute;
    z-index:6;
    line-height:1;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:pan-y;
    transform-origin:50% 50%;
    transition: left 2.6s ease-in-out, top .3s ease, opacity .6s ease, filter .6s ease;
    filter: drop-shadow(0 6px 8px rgba(0,20,25,0.35));
  }
  .critter:hover{ filter: drop-shadow(0 6px 8px rgba(0,20,25,0.35)) brightness(1.15); }
  .critter:active{ filter: drop-shadow(0 6px 8px rgba(0,20,25,0.35)) brightness(0.9); }
  .critter.faded{ opacity:0.12; filter: drop-shadow(0 6px 8px rgba(0,20,25,0.35)) grayscale(1); }

  @media (prefers-reduced-motion: reduce){ .critter{ transition:none; } }

  /* ---------- motion ---------- */
  .sway{ transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform: rotate(-3deg); } 50%{ transform: rotate(3deg); } }

  .pulse{ transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 3.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.06); } }

  .bob{ transform-box: fill-box; transform-origin: 50% 50%; animation: bob 5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }

  .rise{ animation: rise linear infinite; }
  @keyframes rise{ from{ transform: translateY(0); opacity:0.85; } to{ transform: translateY(-620px); opacity:0; } }

  .shimmer{ animation: shimmer 6s ease-in-out infinite; }
  @keyframes shimmer{ 0%,100%{ opacity:.16; } 50%{ opacity:.4; } }

  .drift-current{ stroke-dasharray: 10 20; animation: flow 4s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-120; } }

  @media (prefers-reduced-motion: reduce){
    .sway,.pulse,.bob,.rise,.shimmer,.drift-current{ animation:none !important; }
  }

  /* ---------- floating feed particles ---------- */
  .particle{
    position:absolute;
    z-index:20;
    pointer-events:none;
    font-size:22px;
    animation: floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) scale(0.6); opacity:0; }
    15%{ opacity:1; transform: translateY(-6px) scale(1); }
    100%{ transform: translateY(-70px) scale(1); opacity:0; }
  }

  /* ---------- pollution overlay ---------- */
  #pollutionOverlay{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(107,92,45,0.0) 0%, rgba(80,70,35,0.0) 70%);
    opacity:0;
    transition: opacity 1.2s ease, background 1.2s ease;
  }
  #pollutionOverlay.on{
    opacity:0.55;
    background: radial-gradient(ellipse at 50% 0%, rgba(120,104,48,0.35) 0%, rgba(58,52,28,0.55) 75%);
  }
  #heatOverlay{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,140,60,0.0) 0%, rgba(255,90,40,0.0) 60%);
    opacity:0;
    transition: opacity 1s ease;
    mix-blend-mode: soft-light;
  }
  #heatOverlay.on{ opacity:0.6; }

  /* ---------- sound toggle ---------- */
  #soundToggle{
    position:fixed;
    bottom:18px;
    left:18px;
    z-index:60;
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.55);
    background:rgba(6,42,54,0.6);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .2s ease, background .3s ease;
  }
  #soundToggle:hover{ transform:scale(1.08); background:rgba(6,42,54,0.8); }
  #soundToggle svg{ width:24px; height:24px; }
  #soundToggle .wave{ transition:opacity .2s ease; }
  #soundToggle.muted .wave{ opacity:0; }
  #soundToggle .pulse-ring{
    position:absolute; inset:-6px; border-radius:50%;
    border:2px solid rgba(95,224,196,0.55); opacity:0;
    animation:pulseRing 2.4s ease-out infinite;
  }
  #soundToggle.playing .pulse-ring{ opacity:1; }
  @keyframes pulseRing{ 0%{ transform:scale(0.85); opacity:.6; } 100%{ transform:scale(1.35); opacity:0; } }

  /* ---------- footer ---------- */
  footer{
    background: linear-gradient(180deg, var(--abyss-2), #021016);
    padding: 56px 20px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    line-height:normal;
  }
  footer p{
    color:rgba(247,245,239,0.65);
    font-size:13px;
    margin:0;
    text-align:center;
    max-width:320px;
  }
  .easypagex-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 36px;
    border-radius:999px;
    background: linear-gradient(135deg, #5FE0C4, #1CA7B8);
    color:#062A36;
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    text-decoration:none;
    box-shadow: 0 8px 22px rgba(28,167,184,0.35), inset 0 0 0 2px rgba(255,255,255,0.25);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .easypagex-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(28,167,184,0.5), inset 0 0 0 2px rgba(255,255,255,0.35);
  }
  .easypagex-btn svg{ width:18px; height:18px; }


</style>
</head>
<body>

<!-- ============ THE DROP-OFF ============ -->
<section id="dropoff">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">

  <g opacity="0.2" fill="var(--white)">

  <!-- rocky ledge -->
  <path d="M0 620 C240 560 380 660 620 600 C860 540 1000 640 1600 560 L1600 900 L0 900 Z" fill="#062A38"/>

  <use href="#tubeSponge" x="200" y="560" width="60" height="150" style="opacity:0.9" data-coral="tube"/>

  <use href="#bubble" class="rise" x="1300" y="800" width="18" height="18" style="animation-duration:13s; animation-delay:-1s;"/>

  <a class="easypagex-btn" href="https://easypagex.com" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z" stroke="#062A36" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5" stroke="#062A36" stroke-width="1.6" stroke-linejoin="round"/></svg>
    EasyPageX
  </a>
  <p>Feed the reef, adjust the water, watch the coral respond — a small demo of what an interactive landing page can do.</p>
</footer>

<script>
(function(){
  /* ===================== REEF HEALTH SYSTEM ===================== */
  const state = { health: 70, pollution: false, heatwave: false };

  const pollutionOverlay = document.getElementById('pollutionOverlay');
  const heatOverlay = document.getElementById('heatOverlay');

  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.round(clamp(v)).toString(16).padStart(2,'0')).join('');
  }
  function lerpColor(bleached, vibrant, t){
    const a = hexToRgb(bleached), b = hexToRgb(vibrant);
    return rgbToHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
  }

  const BLEACHED = '#EDE7DA';
  const BLEACHED_LINE = '#C9C1B1';
  const VIBRANT = {
    '--c-brain': '#FF6F91', '--c-brain-line': '#E23F68',
    '--c-staghorn': '#FF9E4F',
    '--c-fan': '#B565A7', '--c-fan-line': '#8C4384',
    '--c-anemone': '#FF7EB3', '--c-anemone-tip': '#FFD34D',
    '--c-clam-1': '#5FD6C7', '--c-clam-2': '#2E9E8F',
    '--c-tube': '#FFD34D'
  };
  const LINE_VARS = ['--c-brain-line','--c-fan-line'];

  function refresh(){
    const h = state.health;
    const t = h / 100;
    const root = document.documentElement.style;

    Object.keys(VIBRANT).forEach(key => {
      const target = LINE_VARS.includes(key) ? BLEACHED_LINE : BLEACHED;
      root.setProperty(key, lerpColor(target, VIBRANT[key], t));
    });

    document.querySelectorAll('[data-sensitive]').forEach(el => {
      el.classList.toggle('faded', h < 40);
    });

    pollutionOverlay.classList.toggle('on', state.pollution);
    heatOverlay.classList.toggle('on', state.heatwave);
  }

  function setHealth(delta){
    state.health = clamp(state.health + delta);
    refresh();
  }

  refresh();

  /* decay over time — teaches that reefs need ongoing care */
  setInterval(() => {
    let d = -1;
    if(state.pollution) d -= 2;
    if(state.heatwave) d -= 2;
    setHealth(d);
  }, 9000);

  function spawnParticlesAcross(sectionId, emojis){
    const section = document.getElementById(sectionId);
    if(!section) return;
    const rect = section.getBoundingClientRect();
    for(let i=0;i<6;i++){
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = (rect.left + window.scrollX + 40 + Math.random()*(rect.width-80)) + 'px';
      p.style.top = (rect.top + window.scrollY + rect.height*0.5 + (Math.random()*200-100)) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }

  function spawnParticleAt(x, y, emoji){
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = emoji;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }

  /* ---------- click a creature to feed it ---------- */
  document.querySelectorAll('.critter').forEach(function(el){
    if(!el.dataset.side){ el.dataset.side = 'left'; }
    el.addEventListener('click', function(ev){
      const goingRight = el.dataset.side === 'left';
      el.style.left = goingRight ? el.dataset.rightPos : el.dataset.leftPos;
      el.style.transform = goingRight ? 'scaleX(-1)' : 'scaleX(1)';
      el.dataset.side = goingRight ? 'right' : 'left';

      setHealth(3);
      const rect = el.getBoundingClientRect();
      spawnParticleAt(rect.left + window.scrollX, rect.top + window.scrollY - 10, '💚');
    });
  });

  /* ===================== AMBIENT UNDERWATER SOUND ===================== */
  const toggleBtn = document.getElementById('soundToggle');
  let audioCtx = null, masterGain = null, soundOn = false, bubbleTimer = null, callTimer = null;

  function createNoiseBuffer(ctx){
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    return buffer;
  }

  function createNoiseLayer(ctx, dest, {type, freq, Q, gain, lfoRate, lfoDepth}){
    const src = ctx.createBufferSource();
    src.buffer = createNoiseBuffer(ctx);
    src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = type; filter.frequency.value = freq; if(Q) filter.Q.value = Q;
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(filter).connect(g).connect(dest);
    src.start();
    if(lfoRate){
      const lfo = ctx.createOscillator(); lfo.frequency.value = lfoRate;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = gain * (lfoDepth || 0.2);
      lfo.connect(lfoGain).connect(g.gain); lfo.start();
    }
    return g;
  }

  function playBubble(ctx, dest){
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const base = 320 + Math.random()*500;
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base*2.2, now+0.09);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.09, now+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.13);
    osc.connect(g).connect(dest);
    osc.start(now); osc.stop(now+0.15);
  }

  function scheduleBubbles(ctx, dest){
    playBubble(ctx, dest);
    if(Math.random() < 0.4){ setTimeout(()=>playBubble(ctx, dest), 90+Math.random()*160); }
    bubbleTimer = setTimeout(()=>scheduleBubbles(ctx, dest), 900 + Math.random()*2200);
  }

  function playWhaleCall(ctx, dest){
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now+1.6);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.06, now+0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, now+1.8);
    osc.connect(g).connect(dest);
    osc.start(now); osc.stop(now+1.9);
  }

  function scheduleCalls(ctx, dest){
    playWhaleCall(ctx, dest);
    callTimer = setTimeout(()=>scheduleCalls(ctx, dest), 12000 + Math.random()*10000);
  }

  function initAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(audioCtx.destination);

    createNoiseLayer(audioCtx, masterGain, {type:'lowpass', freq:340, Q:0.7, gain:0.2, lfoRate:0.06, lfoDepth:0.3});
    createNoiseLayer(audioCtx, masterGain, {type:'bandpass', freq:900, Q:1.2, gain:0.05});
    scheduleBubbles(audioCtx, masterGain);
    scheduleCalls(audioCtx, masterGain);
  }

  toggleBtn.addEventListener('click', function(){
    if(!audioCtx){ initAudio(); soundOn = true; }
    else{
      soundOn = !soundOn;
      if(soundOn){ audioCtx.resume(); } else { audioCtx.suspend(); }
    }
    toggleBtn.classList.toggle('muted', !soundOn);
    toggleBtn.classList.toggle('playing', soundOn);
  });
})();
</script>
</body>
