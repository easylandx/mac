<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>534</title>
<style>
  :root{
    --navy-deep:#081422;
    --silver:#cbd4dc;
    --silver-bright:#f2f5f7;
    --brass:#b98a3d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 40%, rgba(30,60,92,0.55), transparent 65%),
      linear-gradient(180deg, var(--navy-deep) 0%, #050a11 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .chamber{
    position:relative;
    width:min(78vw, 42vh);
    aspect-ratio:120/526;
    border-radius:14px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 0 6px rgba(203,212,220,0.9),
      0 0 0 7px rgba(0,0,0,0.5),
      0 30px 60px rgba(0,0,0,0.6),
      inset 0 0 24px rgba(0,0,0,0.35);
  }
  .chamber .bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    -webkit-user-select:none; user-select:none; -webkit-user-drag:none;
  }
  .chamber .boat{
    position:absolute;
    left:27.5%;
    width:72.5%;
    -webkit-user-select:none; user-select:none; -webkit-user-drag:none;
    will-change:transform;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }
  .sheen{
    position:absolute; inset:0;
    background:linear-gradient(100deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.03) 18%,
      rgba(255,255,255,0) 34%,
      rgba(0,0,0,0.08) 78%,
      rgba(0,0,0,0.22) 100%);
    pointer-events:none;
  }

  .tilt-btn{
    position:fixed;
    right:18px;
    bottom:18px;
    width:46px; height:46px;
    border-radius:50%;
    border:1px solid rgba(203,212,220,0.35);
    background:rgba(8,20,34,0.55);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    transition:opacity 0.4s ease;
  }
  .tilt-btn svg{width:20px; height:20px; stroke:var(--silver-bright);}
  .tilt-btn.hidden{opacity:0; pointer-events:none;}

  .slider-wrap{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(60vw, 260px);
  }
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:2px;
    background:linear-gradient(90deg, var(--brass), var(--silver));
    border-radius:2px;
    outline:none;
    opacity:0.55;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--silver-bright);
    border:2px solid var(--brass);
    cursor:pointer;
    margin-top:-6px;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px;
    border-radius:50%;
    background:var(--silver-bright);
    border:2px solid var(--brass);
    cursor:pointer;
  }
</style>
</head>

<button class="tilt-btn" id="enableBtn" aria-label="Enable tilt sensor">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>
    <circle cx="12" cy="12" r="4.5"/>
  </svg>
</button>

<div class="slider-wrap">
  <input type="range" id="tiltSlider" min="0" max="1" step="0.001" value="0" aria-label="Tilt">
</div>

<script>
(function(){
  const chamber = document.getElementById('chamber');
  const boat = document.getElementById('boat');
  const slider = document.getElementById('tiltSlider');
  const enableBtn = document.getElementById('enableBtn');

  const BASE_H = 526;
  const REST_Y = 160;   // upright: boat's resting position (native px)
  const TOP_Y = 18;     // inverted: boat glides up to here (native px)

  let target = 0;
  let display = 0;
  let usingSensor = false;

  function render(){
    const scale = chamber.clientHeight / BASE_H;
    const y = REST_Y + (TOP_Y - REST_Y) * display;
    boat.style.top = (y * scale) + 'px';
  }

  function tick(){
    display += (target - display) * 0.028;
    if (Math.abs(target - display) < 0.0005) display = target;
    render();
    if (!usingSensor) slider.value = target;
    requestAnimationFrame(tick);
  }

  function handleOrientation(e){
    if (e.beta === null || e.beta === undefined) return;
    usingSensor = true;
    const rad = (e.beta - 90) * Math.PI / 180;
    target = (1 - Math.cos(rad)) / 2;
  }

  function startListening(){
    window.addEventListener('deviceorientation', handleOrientation, true);
  }

  enableBtn.addEventListener('click', function(){
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(resp){
        if (resp === 'granted'){
          startListening();
          enableBtn.classList.add('hidden');
        }
      }).catch(function(){});
    } else if ('DeviceOrientationEvent' in window){
      startListening();
      enableBtn.classList.add('hidden');
    }
  });

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission !== 'function'){
    startListening();
    enableBtn.classList.add('hidden');
  }

  slider.addEventListener('input', function(){
    usingSensor = false;
    target = parseFloat(slider.value);
  });

  window.addEventListener('resize', render);
  render();
  requestAnimationFrame(tick);
})();
</script>
