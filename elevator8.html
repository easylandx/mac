<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elevator Simulator</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(92vw, 405px);
    aspect-ratio: 720 / 1280;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    border-radius: 6px;
    overflow: hidden;
    background: #111;
  }
  .stage img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .stage img.visible { opacity: 1; }

  /* Floor indicator lights overlay (over "1 2 3 4 5 6 7 8 9" strip) */
  .ind-light {
    position: absolute;
    width: 3.4%;
    height: 2.2%;
    transform: translate(-50%, -50%);
    border-radius: 3px;
    pointer-events: none;
    background: transparent;
  }
  .ind-light.active {
    background: rgba(255, 176, 40, 0.85);
    box-shadow: 0 0 10px 4px rgba(255,176,40,0.9);
  }

  /* Floor call buttons overlay */
  .call-btn {
    position: absolute;
    width: 8.2%;
    height: 3.9%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
  }
  .call-btn.lit {
    background: rgba(255, 200, 60, 0.55);
    box-shadow: 0 0 6px 2px rgba(255, 190, 50, 0.75);
  }
  .call-btn.floor1 {
    border-radius: 4px;
    width: 8%;
    height: 4.2%;
  }

  .status {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: #ffcf7a;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 5px 14px;
    border-radius: 20px;
    pointer-events: none;
    user-select: none;
  }

  .mute-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 15px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <img id="imgClosed" src="elevator_closed.jpg" class="visible" alt="elevator closed">
  <img id="imgOpen" src="elevator_open.jpg" alt="elevator open">

  <!-- Indicator lights for floors 1-9 (over top strip) -->
  <div class="ind-light" id="ind1" style="left:13.2%; top:9.2%;"></div>
  <div class="ind-light" id="ind2" style="left:18.9%; top:9.2%;"></div>
  <div class="ind-light" id="ind3" style="left:24.4%; top:9.2%;"></div>
  <div class="ind-light" id="ind4" style="left:30.1%; top:9.2%;"></div>
  <div class="ind-light" id="ind5" style="left:35.8%; top:9.2%;"></div>
  <div class="ind-light" id="ind6" style="left:41.4%; top:9.2%;"></div>
  <div class="ind-light" id="ind7" style="left:47.1%; top:9.2%;"></div>
  <div class="ind-light" id="ind8" style="left:52.8%; top:9.2%;"></div>
  <div class="ind-light" id="ind9" style="left:58.3%; top:9.2%;"></div>

  <!-- Call buttons -->
  <div class="call-btn" data-floor="8" style="left:56.9%; top:45.0%;"></div>
  <div class="call-btn" data-floor="9" style="left:63.5%; top:45.0%;"></div>
  <div class="call-btn" data-floor="6" style="left:56.9%; top:49.6%;"></div>
  <div class="call-btn" data-floor="7" style="left:63.5%; top:49.6%;"></div>
  <div class="call-btn" data-floor="4" style="left:56.9%; top:54.3%;"></div>
  <div class="call-btn" data-floor="5" style="left:63.5%; top:54.3%;"></div>
  <div class="call-btn" data-floor="2" style="left:56.9%; top:59.0%;"></div>
  <div class="call-btn" data-floor="3" style="left:63.5%; top:59.0%;"></div>
  <div class="call-btn floor1" data-floor="1" style="left:57.4%; top:64.7%;"></div>

  <div class="status" id="status">Floor 1</div>
  <button class="mute-btn" id="muteBtn" title="Mute/Unmute music">&#128266;</button>
</div>

<audio id="bgMusic" src="https://ia801509.us.archive.org/9/items/lp_playing-the-great-movie-show-themes_bob-ralston/disc1/01.01.+A+Man+And+A+Woman+(A+Man+And+A+Woman).mp3" loop preload="auto" muted playsinline></audio>

<script>
(function() {
  const music = document.getElementById('bgMusic');
  const muteBtn = document.getElementById('muteBtn');
  const imgClosed = document.getElementById('imgClosed');
  const imgOpen = document.getElementById('imgOpen');
  const statusEl = document.getElementById('status');
  const buttons = document.querySelectorAll('.call-btn');

  let currentFloor = 1;
  let targetFloor = null;
  let moving = false;
  let doorOpen = false;
  let musicStarted = false;
  let userMuted = false;

  // Every major browser blocks autoplay WITH sound, but muted autoplay is
  // always allowed. So: start it muted immediately (this always works, and
  // starts the instant the page loads), then unmute the moment the user
  // makes any real gesture (tap/click/key press) - browsers require an
  // actual gesture for this, so passive events like scroll won't count.
  function startMutedAutoplay() {
    if (musicStarted) return;
    music.muted = true;
    const p = music.play();
    if (p && p.then) {
      p.then(() => { musicStarted = true; }).catch(() => {
        // Even muted autoplay was blocked (rare) - it will retry on the
        // next attempt below and on the first user gesture.
      });
    }
  }

  function unmuteOnInteraction() {
    const p = music.play();
    if (p && p.then) p.then(() => { musicStarted = true; }).catch(() => {});
    if (!userMuted) music.muted = false;
  }

  // Try immediately, on DOM ready, and on full page load - covers every
  // timing case for when the script actually runs.
  startMutedAutoplay();
  document.addEventListener('DOMContentLoaded', startMutedAutoplay);
  window.addEventListener('load', startMutedAutoplay);
  window.addEventListener('pageshow', startMutedAutoplay);

  ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
    document.addEventListener(evt, unmuteOnInteraction, { once: true, passive: true });
  });

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    userMuted = !userMuted;
    music.muted = userMuted;
    muteBtn.innerHTML = userMuted ? '&#128263;' : '&#128266;';
    if (!musicStarted) {
      music.play().then(() => { musicStarted = true; }).catch(() => {});
    }
  });

  function setIndicator(floor, on) {
    const el = document.getElementById('ind' + floor);
    if (el) el.classList.toggle('active', on);
  }

  function clearAllIndicators() {
    for (let f = 1; f <= 9; f++) setIndicator(f, false);
  }

  function lightButton(floor, on) {
    const btn = document.querySelector('.call-btn[data-floor="' + floor + '"]');
    if (btn) btn.classList.toggle('lit', on);
  }

  function playDing() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      function tone(freq, start, dur, gainPeak) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + start);
        gain.gain.linearRampToValueAtTime(gainPeak, now + start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur + 0.05);
      }

      // Softer ding-dong, played twice (like a real elevator chime)
      tone(880, 0, 0.85, 0.16);
      tone(1318.5, 0.2, 0.95, 0.13);
      tone(880, 0.75, 0.85, 0.13);
      tone(1318.5, 0.95, 0.95, 0.1);
    } catch (e) {}
  }

  function openDoor() {
    doorOpen = true;
    imgClosed.classList.remove('visible');
    imgOpen.classList.add('visible');
    statusEl.textContent = 'Floor ' + currentFloor + ' - Door Open';
  }

  function closeDoor() {
    doorOpen = false;
    imgOpen.classList.remove('visible');
    imgClosed.classList.add('visible');
  }

  function moveToFloor(floor) {
    if (moving || floor === currentFloor) {
      if (!moving && floor === currentFloor && !doorOpen) {
        arriveAtFloor();
      }
      return;
    }

    if (doorOpen) closeDoor();

    moving = true;
    targetFloor = floor;
    lightButton(floor, true);

    const direction = floor > currentFloor ? 1 : -1;
    statusEl.textContent = 'Moving to Floor ' + floor;

    const stepInterval = setInterval(() => {
      setIndicator(currentFloor, false);
      currentFloor += direction;
      setIndicator(currentFloor, true);
      statusEl.textContent = 'Floor ' + currentFloor;

      if (currentFloor === targetFloor) {
        clearInterval(stepInterval);
        moving = false;
        arriveAtFloor();
      }
    }, 700);
  }

  function arriveAtFloor() {
    lightButton(currentFloor, false);
    playDing();
    setTimeout(() => {
      openDoor();
    }, 250);
  }

  setIndicator(currentFloor, true);

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const floor = parseInt(btn.getAttribute('data-floor'), 10);
      moveToFloor(floor);
    });
  });
})();
</script>

</body>
</html>
