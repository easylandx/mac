<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE: NHK WORLD-JAPAN News</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* CSS Tatami Mat Pattern Background */
            background-color: #d1ca98;
            background-image: 
                linear-gradient(90deg, rgba(140, 130, 80, 0.4) 1px, transparent 1px),
                linear-gradient(0deg, rgba(140, 130, 80, 0.4) 1px, transparent 1px),
                linear-gradient(45deg, rgba(0, 0, 0, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.05) 75%),
                linear-gradient(45deg, rgba(0, 0, 0, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.05) 75%);
            background-size: 60px 120px, 120px 60px, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 0 0, 10px 10px;
            padding: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.92);
            border: 8px solid #3d3a2a;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: #2c2a1e;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        /* Responsive Video Container */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 4px;
            border: 2px solid #5a543f;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LIVE: NHK WORLD-JAPAN News</h1>
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/IimtbuqYIE8" 
                title="LIVE: NHK WORLD-JAPAN News" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
