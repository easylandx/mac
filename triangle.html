<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musical Triangle</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 20%, #fff6d8 0%, #ffe28a 35%, #ffcc55 70%, #f0a93a 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 40px;
  }
  h1 {
    color: #7a4a10;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    font-size: 1.6rem;
    letter-spacing: 1px;
    margin: 0;
  }
  .frame {
    position: relative;
    padding: 18px;
    border-radius: 24px;
    background: linear-gradient(145deg, #fff3c4, #ffdd80);
    box-shadow:
      0 10px 30px rgba(150, 90, 10, 0.35),
      inset 0 0 0 4px rgba(255,255,255,0.6);
  }
  #triangleImg {
    display: block;
    width: 340px;
    max-width: 70vw;
    cursor: pointer;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 12px 18px rgba(120,70,0,0.35));
    transition: transform 0.08s ease-out, filter 0.15s ease-out;
    border-radius: 12px;
    background: transparent;
  }
  #triangleImg:active {
    transform: scale(0.96) rotate(-1.5deg);
  }
  .ripple {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    pointer-events: none;
    box-shadow: 0 0 0 0 rgba(255, 215, 90, 0.7);
    animation: none;
  }
  .ripple.active {
    animation: ping 0.7s ease-out;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(255, 215, 90, 0.7); }
    100% { box-shadow: 0 0 0 40px rgba(255, 215, 90, 0); }
  }
  .hint {
    color: #8a5a15;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  footer {
    color: #9a6a25;
    font-size: 0.75rem;
    opacity: 0.7;
  }
</style>
</head>

    <div class="hint">Click or tap the triangle to strike it</div>

<script>
  const img = document.getElementById('triangleImg');
  const ripple = document.getElementById('ripple');
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Synthesize a bright, metallic, indefinite-pitch triangle strike
  // using a cluster of slightly inharmonic sine partials with a
  // sharp attack and a long shimmering decay.
  function strikeTriangle(intensity = 1, pan = 0) {
    const ctx = getCtx();
    const now = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.value = 0;
    let panner;
    if (ctx.createStereoPanner) {
      panner = ctx.createStereoPanner();
      panner.pan.value = pan;
      master.connect(panner);
      panner.connect(ctx.destination);
    } else {
      master.connect(ctx.destination);
    }

    // Randomize base frequency slightly to simulate strike position/size
    const base = 2600 + (Math.random() - 0.5) * 400;

    // Inharmonic partials characteristic of a struck metal bar/triangle
    const ratios = [1, 1.83, 2.71, 3.96, 5.43, 6.79, 8.12, 9.61, 11.4];

    const peakGain = 0.5 * intensity;
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(peakGain, now + 0.004);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 5.5);

    ratios.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      const freq = base * ratio * (1 + (Math.random() - 0.5) * 0.01);
      osc.frequency.value = freq;

      const partialGain = ctx.createGain();
      const amp = 1 / Math.pow(i + 1, 1.35);
      const decayTime = 5.5 - i * 0.35 + Math.random() * 0.3;

      partialGain.gain.setValueAtTime(amp, now);
      partialGain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(1.2, decayTime));

      osc.connect(partialGain);
      partialGain.connect(master);

      osc.start(now);
      osc.stop(now + Math.max(1.3, decayTime) + 0.1);
    });

    // A touch of shimmering high-frequency noise for the "clang" attack
    const bufferSize = ctx.sampleRate * 0.06;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 5000;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.35 * intensity, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(master);
    noise.start(now);
  }

  // A rapid back-and-forth "trill"/roll, used every few clicks
  function trillTriangle() {
    const hits = 14;
    const duration = 1.6;
    for (let i = 0; i < hits; i++) {
      const t = (i / hits) * duration;
      const pan = (i % 2 === 0) ? -0.3 : 0.3;
      setTimeout(() => strikeTriangle(0.55, pan), t * 1000);
    }
  }

  let clickCount = 0;

  function handleStrike() {
    clickCount++;
    ripple.classList.remove('active');
    void ripple.offsetWidth; // restart animation
    ripple.classList.add('active');

    if (clickCount % 4 === 0) {
      trillTriangle();
    } else {
      strikeTriangle(1, 0);
    }
  }

  img.addEventListener('click', handleStrike);
  img.addEventListener('touchstart', function(e) {
    e.preventDefault();
    handleStrike();
  }, { passive: false });
</script>
