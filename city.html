<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Scrollable Container */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
    }

    #viewport::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    #viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    /* World Canvas (Large Scrollable Area) */
    #city-world {
      width: 3200px;
      height: 1800px;
      position: relative;
      background: linear-gradient(to bottom, #70c4ff 0%, #bdecff 35%, #e0f4ff 50%, #e2e8f0 100%);
      overflow: hidden;
    }

    /* SVG Layer for Static Background */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Foreground Interactive Layer */
    #entity-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Moving Entities */
    .entity {
      position: absolute;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease-out;
      filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.15));
      z-index: 12;
      will-change: transform, left, top;
    }

    .entity:hover {
      transform: scale(1.25);
      z-index: 100 !important;
    }

    .entity.fast-dash {
      transition: left 1.5s cubic-bezier(0.25, 1, 0.5, 1), top 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s ease;
    }

    /* Layering Adjustments */
    .layer-sky { z-index: 5; }
    .layer-skyline { z-index: 6; }
    .layer-back-road { z-index: 8; }
    .layer-river { z-index: 9; }
    .layer-bridge { z-index: 11; }
    .layer-sidewalk { z-index: 12; }
    .layer-front-road { z-index: 14; }
    .layer-foreground { z-index: 15; }

    /* Animated CSS Elements */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 100px;
      filter: blur(2px);
      pointer-events: none;
      animation: floatCloud linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }

    @keyframes floatCloud {
      from { transform: translateX(-300px); }
      to { transform: translateX(3300px); }
    }

    /* Smoke Animation */
    .smoke-puff {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(200, 200, 200, 0.5);
      border-radius: 50%;
      pointer-events: none;
      animation: riseSmoke 4s infinite ease-out;
    }

    @keyframes riseSmoke {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.6; }
      100% { transform: translate(20px, -80px) scale(3); opacity: 0; }
    }

    /* Traffic Light Blinking */
    .light-red { animation: cycleRed 6s infinite; }
    .light-yellow { animation: cycleYellow 6s infinite; }
    .light-green { animation: cycleGreen 6s infinite; }

    @keyframes cycleRed {
      0%, 40%, 100% { fill: #ff3b30; opacity: 1; }
      45%, 95% { fill: #550000; opacity: 0.3; }
    }
    @keyframes cycleYellow {
      0%, 38%, 52%, 100% { fill: #554400; opacity: 0.3; }
      40%, 50% { fill: #ffcc00; opacity: 1; }
    }
    @keyframes cycleGreen {
      0%, 48% { fill: #004400; opacity: 0.3; }
      52%, 95% { fill: #34c759; opacity: 1; }
      100% { fill: #004400; opacity: 0.3; }
    }

    /* Distance Runner on Horizon */
    .horizon-runner {
      position: absolute;
      top: 512px;
      left: -50px;
      font-size: 16px;
      pointer-events: none;
      z-index: 7;
      animation: runHorizon 45s linear infinite;
    }

    @keyframes runHorizon {
      0% { transform: translateX(0); }
      100% { transform: translateX(3300px); }
    }

    /* Floating Fixed UI Controls */
    #ui-layer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ui-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0,0,0,0.1);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .ui-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      background: #ffffff;
    }

    .ui-btn:active {
      transform: translateY(0);
    }

    .audio-toggle {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    /* Audio visualizer effect when playing */
    .audio-playing {
      border: 2px solid #34c759;
    }
  </style>
</head>

<script>
  /**
   * CITY SIMULATOR - Pure Interactive JS Engine
   */

  // --- AUDIO SYNTHESIS ENGINE (Web Audio API - Pure & Standalone) ---
  class CityAudioEngine {
    constructor() {
      this.ctx = null;
      this.isMuted = true;
      this.initialized = false;
      this.gainNode = null;
    }

    init() {
      if (this.initialized) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      this.ctx = new AudioCtx();
      this.gainNode = this.ctx.createGain();
      this.gainNode.gain.setValueAtTime(0.15, this.ctx.currentTime); // Gentle ambient volume
      this.gainNode.connect(this.ctx.destination);

      this.createWindAmbient();
      this.createTrafficAmbient();
      this.scheduleRandomCityNoises();

      this.initialized = true;
      this.isMuted = false;
    }

    toggle() {
      if (!this.initialized) {
        this.init();
        return true;
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.isMuted = !this.isMuted;
      this.gainNode.gain.linearRampToValueAtTime(
        this.isMuted ? 0 : 0.15, 
        this.ctx.currentTime + 0.3
      );
      return !this.isMuted;
    }

    // Continuous Soft Wind Noise
    createWindAmbient() {
      const bufferSize = this.ctx.sampleRate * 2;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 300;

      whiteNoise.connect(filter);
      filter.connect(this.gainNode);
      whiteNoise.start();
    }

    // Low Frequency Traffic Rumble
    createTrafficAmbient() {
      const bufferSize = this.ctx.sampleRate * 2;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const trafficNoise = this.ctx.createBufferSource();
      trafficNoise.buffer = noiseBuffer;
      trafficNoise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 120;
      filter.Q.value = 3;

      trafficNoise.connect(filter);
      filter.connect(this.gainNode);
      trafficNoise.start();
    }

    // Occasional City Sounds (Horns, Birds, Construction)
    scheduleRandomCityNoises() {
      const playNextSound = () => {
        if (!this.isMuted && this.ctx) {
          const rand = Math.random();
          if (rand < 0.4) this.playCarHorn();
          else if (rand < 0.7) this.playBirdChirp();
          else this.playConstructionSound();
        }
        setTimeout(playNextSound, 4000 + Math.random() * 8000);
      };
      playNextSound();
    }

    playCarHorn() {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150 + Math.random() * 80, this.ctx.currentTime);
      
      gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    }

    playBirdChirp() {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(2000, now);
      osc.frequency.exponentialRampToValueAtTime(3000, now + 0.1);
      
      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start();
      osc.stop(now + 0.15);
    }

    playConstructionSound() {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(80, this.ctx.currentTime);

      gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);

      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    }

    // Interaction Sound (Boing/Dash effect on click)
    playDashSound() {
      if (!this.ctx || this.isMuted) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      
      const now = this.ctx.currentTime;
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);

      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

      osc.connect(gain);
      gain.connect(this.gainNode);
      osc.start();
      osc.stop(now + 0.25);
    }
  }

  const audioSystem = new CityAudioEngine();

  // --- ENTITY CONFIGURATION & SPAWNER ---

  const WORLD_WIDTH = 3200;

  // Types of City Entities and their movement zones / behaviors
  const ENTITY_TYPES = [
    // Pedestrians (Sidewalks & Plaza)
    { emoji: '🚶', category: 'pedestrian', yMin: 1080, yMax: 1140, speedMin: 0.8, speedMax: 1.5, size: 28 },
    { emoji: '🏃', category: 'pedestrian', yMin: 1080, yMax: 1140, speedMin: 2.0, speedMax: 3.2, size: 28 },
    { emoji: '👩', category: 'pedestrian', yMin: 1540, yMax: 1720, speedMin: 0.7, speedMax: 1.4, size: 30 },
    { emoji: '👨', category: 'pedestrian', yMin: 1540, yMax: 1720, speedMin: 0.8, speedMax: 1.3, size: 30 },
    { emoji: '👮', category: 'pedestrian', yMin: 1080, yMax: 1140, speedMin: 1.0, speedMax: 1.2, size: 30 },
    { emoji: '👷', category: 'pedestrian', yMin: 1540, yMax: 1700, speedMin: 0.9, speedMax: 1.4, size: 30 },
    { emoji: '🧍', category: 'pedestrian', yMin: 1540, yMax: 1720, speedMin: 0.5, speedMax: 1.0, size: 30 },

    // Vehicles (Main Road Lanes)
    { emoji: '🚗', category: 'vehicle', yMin: 1180, yMax: 1240, speedMin: 3.5, speedMax: 6.0, size: 40, dir: 1 },
    { emoji: '🚕', category: 'vehicle', yMin: 1250, yMax: 1310, speedMin: 4.0, speedMax: 6.5, size: 40, dir: 1 },
    { emoji: '🚌', category: 'vehicle', yMin: 1370, yMax: 1420, speedMin: 2.8, speedMax: 4.5, size: 48, dir: -1 },
    { emoji: '🚚', category: 'vehicle', yMin: 1430, yMax: 1490, speedMin: 3.0, speedMax: 5.0, size: 46, dir: -1 },
    { emoji: '🏎️', category: 'vehicle', yMin: 1250, yMax: 1310, speedMin: 7.0, speedMax: 10.0, size: 38, dir: 1 },
    
    // Back Road Vehicles
    { emoji: '🚗', category: 'vehicle', yMin: 560, yMax: 620, speedMin: 3.0, speedMax: 5.5, size: 28, dir: -1 },
    { emoji: '🚌', category: 'vehicle', yMin: 620, yMax: 650, speedMin: 2.5, speedMax: 4.0, size: 32, dir: 1 },

    // Small Mobility (Bicycles / Scooters / Vendors)
    { emoji: '🚲', category: 'bike', yMin: 1140, yMax: 1170, speedMin: 2.2, speedMax: 3.8, size: 28 },
    { emoji: '🛵', category: 'bike', yMin: 1180, yMax: 1220, speedMin: 3.5, speedMax: 5.0, size: 30 },
    { emoji: '🛴', category: 'bike', yMin: 1540, yMax: 1600, speedMin: 2.0, speedMax: 3.5, size: 26 },

    // Animals
    { emoji: '🐕', category: 'animal', yMin: 1560, yMax: 1740, speedMin: 1.2, speedMax: 2.2, size: 26 },
    { emoji: '🐈', category: 'animal', yMin: 1560, yMax: 1740, speedMin: 0.8, speedMax: 1.5, size: 22 },
    { emoji: '🐿️', category: 'animal', yMin: 720, yMax: 820, speedMin: 1.0, speedMax: 2.5, size: 20 }, // Park Squirrel
    { emoji: '🐀', category: 'animal', yMin: 1070, yMax: 1100, speedMin: 1.5, speedMax: 3.0, size: 18 }, // Alley Rat

    // Sky / Air
    { emoji: '🕊️', category: 'air', yMin: 150, yMax: 480, speedMin: 1.5, speedMax: 3.5, size: 22 },
    { emoji: '🦅', category: 'air', yMin: 80, yMax: 300, speedMin: 2.0, speedMax: 4.0, size: 28 },
    { emoji: '🚁', category: 'air', yMin: 60, yMax: 200, speedMin: 3.0, speedMax: 5.5, size: 42 }
  ];

  class Entity {
    constructor(config, container) {
      this.config = config;
      this.container = container;
      this.element = document.createElement('div');
      this.element.className = 'entity';
      this.element.textContent = config.emoji;
      
      // Initial Position & State
      this.x = Math.random() * WORLD_WIDTH;
      this.y = config.yMin + Math.random() * (config.yMax - config.yMin);
      
      // Movement Direction: 1 = Right, -1 = Left
      this.dir = config.dir || (Math.random() > 0.5 ? 1 : -1);
      this.baseSpeed = config.speedMin + Math.random() * (config.speedMax - config.speedMin);
      this.speed = this.baseSpeed;
      
      this.isDashing = false;
      this.dashTimeout = null;

      // Styling
      this.element.style.fontSize = `${config.size}px`;
      this.element.style.top = `${this.y}px`;
      
      // Click Interaction
      this.element.addEventListener('click', (e) => this.onClick(e));
      this.element.addEventListener('touchstart', (e) => this.onClick(e), { passive: true });

      this.container.appendChild(this.element);
      this.updateTransform();
    }

    updateTransform() {
      // ScaleX flips horizontally depending on direction
      const scaleX = this.dir === 1 ? 1 : -1;
      this.element.style.transform = `scaleX(${scaleX})`;
      this.element.style.left = `${this.x}px`;
    }

    move() {
      if (this.isDashing) return; // Managed by CSS transition during dash

      this.x += this.speed * this.dir;

      // Wrap around world edges
      if (this.dir === 1 && this.x > WORLD_WIDTH + 60) {
        this.x = -60;
      } else if (this.dir === -1 && this.x < -60) {
        this.x = WORLD_WIDTH + 60;
      }

      this.updateTransform();
    }

    // Smooth dash across screen on click / tap
    onClick(e) {
      if (e) e.stopPropagation();

      // Trigger Audio Effect
      audioSystem.playDashSound();

      // Reverse direction and boost speed across screen
      this.dir *= -1;
      this.isDashing = true;

      // Add fast dash CSS class for smooth animation
      this.element.classList.add('fast-dash');

      // Calculate dramatic dash target destination
      const dashDistance = 800 + Math.random() * 600;
      this.x += dashDistance * this.dir;

      // Clamp target within reasonable bounds
      if (this.x > WORLD_WIDTH + 100) this.x = WORLD_WIDTH + 100;
      if (this.x < -100) this.x = -100;

      this.updateTransform();

      // Reset after dash completes
      clearTimeout(this.dashTimeout);
      this.dashTimeout = setTimeout(() => {
        this.element.classList.remove('fast-dash');
        this.isDashing = false;
        
        // Wrap around reset if off screen
        if (this.x >= WORLD_WIDTH + 100) this.x = -50;
        if (this.x <= -100) this.x = WORLD_WIDTH + 50;
      }, 1500);
    }
  }

  // --- ENVIRONMENT SETUP & GENERATION ---

  const entityContainer = document.getElementById('entity-layer');
  const entities = [];

  // Spawn clouds dynamically
  function createClouds() {
    const cityWorld = document.getElementById('city-world');
    for (let i = 0; i < 12; i++) {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      const width = 120 + Math.random() * 180;
      const height = 40 + Math.random() * 30;
      cloud.style.width = `${width}px`;
      cloud.style.height = `${height}px`;
      cloud.style.top = `${30 + Math.random() * 260}px`;
      cloud.style.left = `${Math.random() * WORLD_WIDTH}px`;
      cloud.style.animationDuration = `${40 + Math.random() * 60}s`;
      cloud.style.animationDelay = `-${Math.random() * 50}s`;
      cityWorld.appendChild(cloud);
    }
  }

  // Initialize Population
  function initSimulator() {
    createClouds();

    // Spawn multiple instances of each type
    ENTITY_TYPES.forEach(typeConfig => {
      // Create 3 to 6 instances per type for a lively city
      const count = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        entities.push(new Entity(typeConfig, entityContainer));
      }
    });

    // Start Animation Loop
    function render() {
      for (let i = 0; i < entities.length; i++) {
        entities[i].move();
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }

  // --- INTERACTION & UI CONTROLS ---

  const viewport = document.getElementById('viewport');
  const audioBtn = document.getElementById('audioBtn');

  // Center scroll position on start (Focus on main avenue)
  window.addEventListener('load', () => {
    initSimulator();
    
    // Scroll to center-ish view of the city street
    viewport.scrollLeft = (WORLD_WIDTH - window.innerWidth) / 2;
    viewport.scrollTop = 800;
  });

  // Global Audio Enable on First Interaction
  function handleFirstUserInteraction() {
    audioSystem.init();
    if (!audioSystem.isMuted) {
      audioBtn.textContent = '🔊';
      audioBtn.classList.add('audio-playing');
    }
    window.removeEventListener('click', handleFirstUserInteraction);
    window.removeEventListener('keydown', handleFirstUserInteraction);
    window.removeEventListener('touchstart', handleFirstUserInteraction);
  }

  window.addEventListener('click', handleFirstUserInteraction);
  window.addEventListener('keydown', handleFirstUserInteraction);
  window.addEventListener('touchstart', handleFirstUserInteraction);

  // Manual Audio Toggle Button
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isNowPlaying = audioSystem.toggle();
    audioBtn.textContent = isNowPlaying ? '🔊' : '🔇';
    if (isNowPlaying) {
      audioBtn.classList.add('audio-playing');
    } else {
      audioBtn.classList.remove('audio-playing');
    }
  });

  // Mouse Drag to Pan / Scroll City Canvas
  let isDragging = false;
  let startX, startY, scrollLeft, scrollTop;

  viewport.addEventListener('mousedown', (e) => {
    // Only drag if clicking background (not on interactive entity)
    if (e.target.classList.contains('entity') || e.target.closest('#ui-layer')) return;
    
    isDragging = true;
    viewport.style.cursor = 'grabbing';
    startX = e.pageX - viewport.offsetLeft;
    startY = e.pageY - viewport.offsetTop;
    scrollLeft = viewport.scrollLeft;
    scrollTop = viewport.scrollTop;
  });

  viewport.addEventListener('mouseleave', () => {
    isDragging = false;
    viewport.style.cursor = 'default';
  });

  viewport.addEventListener('mouseup', () => {
    isDragging = false;
    viewport.style.cursor = 'default';
  });

  viewport.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const x = e.pageX - viewport.offsetLeft;
    const y = e.pageY - viewport.offsetTop;
    const walkX = (x - startX) * 1.5; // Scroll speed factor
    const walkY = (y - startY) * 1.5;
    viewport.scrollLeft = scrollLeft - walkX;
    viewport.scrollTop = scrollTop - walkY;
  });

</script>
