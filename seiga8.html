<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Seigaiha</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html {
    background:#111;
  }
  body {
    width:100%;
    background:#111; cursor:pointer; user-select:none;
    overflow-x:hidden;
    touch-action:pan-y;
  }

  #stage {
    position:relative;
    width:100%;
    height:800vh;
    height:800dvh;
  }

  .layer {
    position:absolute;
    inset:0;
    width:100%; height:100%;
    background-repeat:repeat;
    background-position:top center;
    background-size:240px 520px;
    opacity:0;
    transition:opacity 1.1s ease;
    will-change:opacity;
  }
  .layer.active { opacity:1; }

  .ui-btn {
    position:fixed;
    width:42px; height:42px;
    border-radius:50%;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.92);
    cursor:pointer;
    transition:background 0.25s ease, transform 0.15s ease, opacity .25s ease;
    z-index:50;
  }
  .ui-btn:hover { background:rgba(255,255,255,0.26); }
  .ui-btn:active { transform:scale(0.92); }
  .ui-btn svg { width:18px; height:18px; display:block; }

  #infoBtn { top:calc(18px + env(safe-area-inset-top)); right:calc(18px + env(safe-area-inset-right)); }
  #muteBtn { bottom:calc(18px + env(safe-area-inset-bottom)); right:calc(18px + env(safe-area-inset-right)); }

  #easylandxBtn {
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom)); left:calc(18px + env(safe-area-inset-left));
    height:42px;
    padding:0 16px;
    border-radius:21px;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    gap:7px;
    color:rgba(255,255,255,0.92);
    text-decoration:none;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background 0.25s ease, transform 0.15s ease;
    z-index:50;
  }
  #easylandxBtn:hover { background:rgba(255,255,255,0.26); }
  #easylandxBtn:active { transform:scale(0.95); }
  #easylandxBtn svg { width:14px; height:14px; flex-shrink:0; }

  #overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.3s ease;
    z-index:100;
    padding:24px;
  }
  #overlay.show { opacity:1; pointer-events:auto; }

  #infoBox {
    max-width:440px;
    background:rgba(20,20,20,0.86);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:16px;
    padding:30px 28px;
    color:rgba(255,255,255,0.92);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size:14.5px;
    line-height:1.65;
    font-weight:400;
    letter-spacing:0.005em;
    transform:translateY(8px);
    transition:transform 0.3s ease;
  }
  #overlay.show #infoBox { transform:translateY(0); }

  #muteBtn.is-muted .icon-on { display:none; }
  #muteBtn.is-muted .icon-off { display:block; }
</style>
</head>

<script>
(function(){
  var layers = [document.getElementById('layer0'), document.getElementById('layer1')];
  var current = 0;
  var muted = false;
  var intervalMs = 8000;
  var timer = null;
  var audioCtx = null;

  function ensureAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playDing(){
    if (muted) return;
    ensureAudio();
    var ctx = audioCtx;
    var now = ctx.currentTime;

    function tone(freq, start, dur, vol){
      var osc = ctx.createOscillator();
      var partial = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      partial.type = 'sine';
      osc.frequency.value = freq;
      partial.frequency.value = freq * 2.01;

      var pGain = ctx.createGain();
      pGain.gain.value = 0.18;
      partial.connect(pGain);
      pGain.connect(gain);
      osc.connect(gain);
      gain.connect(ctx.destination);

      gain.gain.setValueAtTime(0.0001, now + start);
      gain.gain.exponentialRampToValueAtTime(vol, now + start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);

      osc.start(now + start);
      partial.start(now + start);
      osc.stop(now + start + dur + 0.05);
      partial.stop(now + start + dur + 0.05);
    }

    // classic two-tone cabin chime (descending)
    tone(1046.5, 0.00, 1.1, 0.22);
    tone(783.99, 0.22, 1.3, 0.20);
  }

  function goTo(index){
    layers[current].classList.remove('active');
    current = index;
    layers[current].classList.add('active');
  }

  function next(playSound){
    var idx = (current + 1) % layers.length;
    goTo(idx);
    if (playSound) playDing();
  }

  function resetTimer(){
    if (timer) clearInterval(timer);
    timer = setInterval(function(){ next(true); }, intervalMs);
  }

  document.body.addEventListener('click', function(e){
    if (e.target.closest('#infoBtn') || e.target.closest('#muteBtn') || e.target.closest('#easylandxBtn') || e.target.closest('#overlay')) return;
    ensureAudio();
    next(true);
    resetTimer();
  });

  document.getElementById('muteBtn').addEventListener('click', function(e){
    e.stopPropagation();
    ensureAudio();
    muted = !muted;
    this.classList.toggle('is-muted', muted);
  });

  document.getElementById('infoBtn').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('overlay').classList.add('show');
  });

  document.getElementById('overlay').addEventListener('click', function(e){
    if (e.target === this){
      this.classList.remove('show');
    }
  });

  document.getElementById('easylandxBtn').addEventListener('click', function(e){
    e.stopPropagation();
  });

  resetTimer();

  function hideAddressBar(){
    window.scrollTo(0, 1);
  }
  window.addEventListener('load', function(){
    hideAddressBar();
    setTimeout(hideAddressBar, 100);
    setTimeout(hideAddressBar, 300);
    setTimeout(hideAddressBar, 800);
  });
  window.addEventListener('orientationchange', function(){
    setTimeout(hideAddressBar, 300);
  });
  document.body.addEventListener('touchend', function(){
    if (window.scrollY < 1) setTimeout(hideAddressBar, 50);
  }, {passive:true});
})();
</script>

</body>
</html>
