<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelfApp</title>
<style>
  :root { --ink:#111; --paper:#f5f2ea; --accent:#25D366; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px;
  }
  h1 { font-size:clamp(1.8rem,6vw,2.8rem); letter-spacing:-1px; font-weight:900; }
  h1 span { background:var(--ink); color:var(--paper); padding:0 .25em; }
  .sub { margin:6px 0 20px; font-size:.95rem; opacity:.7; text-align:center; }
  .frame {
    position:relative; width:min(92vw,420px); aspect-ratio:3/4;
    background:#fff; border:4px solid var(--ink); border-radius:14px;
    box-shadow:8px 8px 0 var(--ink); overflow:hidden;
  }
  video, canvas#out {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#fff;
  }
  video { transform:scaleX(-1); }
  canvas#out { display:none; }
  .msg {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px; font-size:.95rem; line-height:1.4; background:#fff;
  }
  .msg[hidden] { display:none; }
  .countdown {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:7rem; font-weight:900; color:#fff; text-shadow:0 0 0 #000, 4px 4px 0 #000;
    pointer-events:none;
  }
  .controls { margin-top:30px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:min(92vw,420px); }
  button, .btn {
    font:inherit; font-weight:800; font-size:1rem; cursor:pointer;
    border:3px solid var(--ink); background:#fff; color:var(--ink);
    padding:14px 22px; border-radius:999px; box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s, box-shadow .08s; text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  }
  button:active, .btn:active { transform:translate(4px,4px); box-shadow:0 0 0 var(--ink); }
  button.primary { background:var(--ink); color:var(--paper); }
  button.wa { background:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hidden { display:none !important; }
  .phone {
    width:min(92vw,420px); margin-top:18px; display:flex; flex-direction:column; gap:6px; font-size:.85rem;
  }
  .phone input {
    font:inherit; padding:12px 14px; border:3px solid var(--ink); border-radius:10px; background:#fff;
  }
  .toast { margin-top:16px; font-size:.9rem; min-height:1.2em; text-align:center; max-width:420px; }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash.go { animation:flash .35s ease-out; }
  @keyframes flash { 0%{opacity:.9} 100%{opacity:0} }
</style>
</head>
<body>
  <h1>Self<span>App</span></h1>
  <p class="sub">Snap a selfie, get a black &amp; white illustration.</p>

  <div class="frame">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="out"></canvas>
    <div class="countdown" id="count"></div>
    <div class="msg" id="msg">Starting camera…</div>
  </div>

  <div class="controls" id="camControls">
    <button class="primary" id="snap" disabled>📸 Take selfie</button>
    <label class="btn hidden" id="uploadBtn">🖼️ Upload photo
      <input type="file" id="file" accept="image/*" capture="user" hidden>
    </label>
  </div>

  <div class="controls hidden" id="resultControls">
    <button id="retake">↺ Retake</button>
    <button class="wa" id="send">💬 Send via WhatsApp</button>
    <button id="download">⬇ Save PNG</button>
  </div>

  <div class="phone hidden" id="phoneBox">
    <label for="phone">WhatsApp number (optional, with country code, e.g. 34600123456)</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="34600123456">
  </div>

  <div class="toast" id="toast"></div>
  <div class="flash" id="flash"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), out = $('out'), msg = $('msg'), snap = $('snap');
  const camControls = $('camControls'), resultControls = $('resultControls');
  const phoneBox = $('phoneBox'), toast = $('toast'), count = $('count');
  let stream = null, busy = false;

  const say = t => toast.textContent = t || '';

  async function startCamera() {
    out.style.display = 'none';
    video.style.display = 'block';
    resultControls.classList.add('hidden');
    phoneBox.classList.add('hidden');
    camControls.classList.remove('hidden');
    say('');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      msg.hidden = true;
      snap.disabled = false;
    } catch (e) {
      msg.hidden = false;
      msg.textContent = 'Camera unavailable. Allow camera access, or upload a photo instead.';
      $('uploadBtn').classList.remove('hidden');
      snap.disabled = true;
    }
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  // ---------- Illustration engine ----------
  function boxBlur(src, w, h, r) {
    const tmp = new Float32Array(w * h), dst = new Float32Array(w * h);
    const d = r * 2 + 1;
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let x = -r; x <= r; x++) sum += src[y * w + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = sum / d;
        sum += src[y * w + Math.min(w - 1, x + r + 1)] - src[y * w + Math.max(0, x - r)];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let y = -r; y <= r; y++) sum += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) {
        dst[y * w + x] = sum / d;
        sum += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
      }
    }
    return dst;
  }

  function illustrate(ctx, w, h) {
    const img = ctx.getImageData(0, 0, w, h), px = img.data;
    const gray = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++)
      gray[i] = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];

    // auto-levels (2nd to 98th percentile)
    const hist = new Uint32Array(256);
    for (let i = 0; i < gray.length; i++) hist[gray[i] | 0]++;
    const cut = w * h * 0.02;
    let lo = 0, hi = 255, acc = 0;
    for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > cut) { lo = i; break; } }
    acc = 0;
    for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > cut) { hi = i; break; } }
    const range = Math.max(40, hi - lo);
    for (let i = 0; i < gray.length; i++) gray[i] = Math.min(1, Math.max(0, (gray[i] - lo) / range));

    const soft = boxBlur(boxBlur(gray, w, h, 2), w, h, 2);
    const tone = boxBlur(gray, w, h, 3);
    const scale = Math.max(1, Math.round(w / 480));

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        let v;
        if (x > 0 && y > 0 && x < w - 1 && y < h - 1) {
          const gx = -soft[i-w-1] - 2*soft[i-1] - soft[i+w-1] + soft[i-w+1] + 2*soft[i+1] + soft[i+w+1];
          const gy = -soft[i-w-1] - 2*soft[i-w] - soft[i-w+1] + soft[i+w-1] + 2*soft[i+w] + soft[i+w+1];
          const edge = Math.sqrt(gx*gx + gy*gy);
          if (edge > 0.32) { px[i*4] = px[i*4+1] = px[i*4+2] = 0; px[i*4+3] = 255; continue; }
        }
        const t = tone[i];
        const sx = Math.floor(x / scale), sy = Math.floor(y / scale);
        if (t < 0.25) v = 0;
        else if (t < 0.45) v = ((sx + sy) % 5 < 2) ? 0 : 255;
        else if (t < 0.62) v = ((sx - sy + 1000) % 7 < 1) ? 0 : 255;
        else v = 255;
        px[i*4] = px[i*4+1] = px[i*4+2] = v; px[i*4+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function renderSource(srcEl, sw, sh, mirror) {
    const maxW = 720;
    // crop to 3:4 portrait
    const targetRatio = 3 / 4;
    let cw = sw, ch = sh;
    if (sw / sh > targetRatio) cw = sh * targetRatio; else ch = sw / targetRatio;
    const cx = (sw - cw) / 2, cy = (sh - ch) / 2;
    const W = Math.min(maxW, Math.round(cw)), H = Math.round(W / targetRatio);
    out.width = W; out.height = H;
    const ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(srcEl, cx, cy, cw, ch, 0, 0, W, H);
    ctx.restore();
    illustrate(ctx, W, H);
    video.style.display = 'none';
    out.style.display = 'block';
    camControls.classList.add('hidden');
    resultControls.classList.remove('hidden');
    phoneBox.classList.remove('hidden');
    say('Looking good! Retake it or send it.');
  }

  // ---------- Capture ----------
  async function takeSelfie() {
    if (busy) return;
    busy = true; snap.disabled = true;
    count.style.display = 'flex';
    for (let n = 3; n > 0; n--) { count.textContent = n; await new Promise(r => setTimeout(r, 800)); }
    count.style.display = 'none';
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    renderSource(video, video.videoWidth, video.videoHeight, true);
    stopCamera();
    busy = false;
  }

  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const im = new Image();
    im.onload = () => { msg.hidden = true; renderSource(im, im.naturalWidth, im.naturalHeight, false); URL.revokeObjectURL(im.src); };
    im.src = URL.createObjectURL(f);
  });

  // ---------- Share ----------
  const toBlob = () => new Promise(res => out.toBlob(res, 'image/png'));

  function downloadBlob(blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'selfie-sketch.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  async function sendWhatsApp() {
    const blob = await toBlob();
    const file = new File([blob], 'selfie-sketch.png', { type: 'image/png' });
    const text = 'Check out my selfie sketch! 🎨';
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text });
        say('Pick WhatsApp in the share sheet to send it.');
        return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    // Fallback (desktop): save image, open WhatsApp chat
    downloadBlob(blob);
    const num = $('phone').value.replace(/\D/g, '');
    const url = 'https://wa.me/' + (num ? num : '') + '?text=' + encodeURIComponent(text);
    window.open(url, '_blank', 'noopener');
    say('Image saved. In WhatsApp, attach selfie-sketch.png from your downloads.');
  }

  snap.addEventListener('click', takeSelfie);
  $('retake').addEventListener('click', startCamera);
  $('send').addEventListener('click', sendWhatsApp);
  $('download').addEventListener('click', async () => downloadBlob(await toBlob()));

  startCamera();
})();
</script>
</body>
</html>
