<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9AA5FF">
<title>Panoramas and Masterpieces</title>
<style>
:root{--yellow:#FFD93D;--orange:#FF9F1C;--pink:#FF6B9D;--blue:#4D96FF;--violet:#8B5CF6;--ink:#1F1B3A;--side:clamp(28px,8vw,120px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#9AA5FF}
body{margin:0;min-height:101vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#9AA5FF;
  padding:calc(56px + env(safe-area-inset-top,0px)) calc(var(--side) + env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) calc(var(--side) + env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto}
header{text-align:center;margin-bottom:44px}
h1{margin:0 0 12px;font-size:clamp(34px,7vw,64px);line-height:1.05;font-weight:900;letter-spacing:-1px;
  color:#1F1B3A}
header p{margin:0;font-size:clamp(17px,2.6vw,22px);font-weight:600}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.88);border:3px solid #fff;border-radius:28px;
  padding:24px;box-shadow:0 10px 26px rgba(31,27,58,.14);transition:transform .25s,box-shadow .25s;
  animation:rise .6s both;animation-delay:calc(var(--i)*60ms);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.card:hover,.card:active{transform:translateY(-6px) scale(1.01);box-shadow:0 18px 34px rgba(31,27,58,.22)}
.emoji{display:grid;place-items:center;width:60px;height:60px;border-radius:20px;font-size:32px;background:var(--c);margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:21px;font-weight:800}
.card p{margin:0;font-size:15px;line-height:1.4;opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#brand{position:fixed;z-index:5;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));
  height:64px;padding:0 26px;border-radius:32px;border:3px solid #fff;text-decoration:none;display:flex;align-items:center;gap:8px;
  font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--orange),var(--pink) 55%,var(--violet));
  box-shadow:0 8px 22px rgba(31,27,58,.3);transition:transform .2s}
#brand:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Panoramas and Masterpieces</h1>
    <p>The world at your fingertips.</p>
  </header>
  <main class="grid" id="grid"></main>
</div>
<a id="brand" href="https://easylandx.github.io" target="_blank" rel="noopener">EasyLandX <span>→</span></a>
<script>
var base = "https://easylandx.github.io/mac/";
var items = [
  ["capereinga","🌊","Cape Reinga","Where two seas meet.","#3DDAD7"],
  ["lasmeninas","👑","Las Meninas","Velázquez's royal mystery.","#FF9F1C"],
  ["gizapyramid","🔺","Giza Pyramids","Ancient wonders in golden sand.","#FFC857"],
  ["freedomtower","🗽","Freedom Tower","New York from the sky.","#8B5CF6"],
  ["machupichu","⛰️","Machu Picchu","An Inca city above the clouds.","#7BE0AD"],
  ["mezquita-cordoba","🕌","Mezquita of Córdoba","A forest of striped arches.","#FF8E72"],
  ["monalisa","🖼️","Mona Lisa","The world's most famous smile.","#FFD93D"],
  ["mount-everest","🏔️","Mount Everest","Standing on top of the world.","#A8C8FF"],
  ["90milebeach","🏖️","Ninety Mile Beach","Endless sand, endless ocean.","#4D96FF"],
  ["peritomoreno","🧊","Perito Moreno","A wall of glowing blue ice.","#6CC5FF"],
  ["sistinechapel","⛪","Sistine Chapel","Michelangelo's painted heaven.","#FF6B9D"]
];
var grid = document.getElementById('grid');
items.forEach(function(it, i){
  var a = document.createElement('a');
  a.className = 'card';
  a.href = base + it[0] + '.html';
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.setProperty('--c', it[4]);
  a.style.setProperty('--i', i);
  a.innerHTML = '<div class="emoji">' + it[1] + '</div><h2>' + it[2] + '</h2><p>' + it[3] + '</p>';
  grid.appendChild(a);
});
</script>
</body>
</html>
