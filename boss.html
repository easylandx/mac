<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Squeaky Wheel</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0a;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #slideshow {
    position: relative;
    max-width: 100vw;
    max-height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #slideshow img {
    max-width: 100vw;
    max-height: 88vh;
    width: auto;
    height: auto;
    display: block;
    opacity: 0;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: opacity 0.5s ease-in-out;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #slideshow img.active {
    opacity: 1;
    position: relative;
    top: auto;
    left: auto;
    transform: none;
  }
  #caption {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 18px 12px 22px;
    text-align: center;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    color: #e8e0d0;
    font-size: 15px;
    letter-spacing: 0.5px;
    z-index: 10;
  }
  #caption a {
    color: #d9b26a;
    text-decoration: none;
    border-bottom: 1px solid rgba(217,178,106,0.5);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  #caption a:hover {
    color: #f2cf8e;
    border-color: #f2cf8e;
  }
  #hint {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(232,224,208,0.55);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #startOverlay {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    color: #e8e0d0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 100;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  #startOverlay h1 {
    font-size: 20px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #startOverlay p {
    font-size: 13px;
    color: rgba(232,224,208,0.6);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>Click to Begin</h1>
  <p>Sound on</p>
</div>

<div id="stage">
  <div id="slideshow">
    <img src="1.jpg" data-index="0">
    <img src="2.jpg" data-index="1">
    <img src="3.jpg" data-index="2">
    <img src="3b.jpg" data-index="3">
    <img src="5.jpg" data-index="4">
    <img src="6.jpg" data-index="5">
    <img src="9.jpg" data-index="6">
    <img src="7.jpg" data-index="7">
    <img src="8.jpg" data-index="8">
    <img src="10.jpg" data-index="9">
  </div>
</div>

<div id="hint">Click the image to continue</div>

<div id="caption">
  Inspired by The Boss &mdash;
  <a href="https://www.youtube.com/watch?v=-wWJfFQOnHw&t=40s" target="_blank" rel="noopener noreferrer">
    youtube.com/watch?v=-wWJfFQOnHw&amp;t=40s
  </a>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://dn721801.ca.archive.org/0/items/ORCH-00677.Lake.Pizzicato/ORCH-00677.Lake.Pizzicato.mp3" type="audio/mpeg">
</audio>

<audio id="alarmSound" preload="auto">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  <source src="https://www.soundjay.com/buttons/sounds/beep-07a.mp3" type="audio/mpeg">
</audio>

<script>
  const images = Array.from(document.querySelectorAll('#slideshow img'));
  const total = images.length;
  let current = 0;
  const bgMusic = document.getElementById('bgMusic');
  const alarmSound = document.getElementById('alarmSound');
  const stage = document.getElementById('stage');
  const startOverlay = document.getElementById('startOverlay');
  const hint = document.getElementById('hint');

  // Fallback synthesized alarm beep (WebAudio) in case the remote alarm file fails to load
  let synthAlarmInterval = null;
  function playSynthBeepBurst(ctx) {
    const now = ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1000;
      const start = now + i * 0.35;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
      gain.gain.linearRampToValueAtTime(0, start + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.25);
    }
  }
  function playSynthAlarmBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      playSynthBeepBurst(ctx);
      synthAlarmInterval = setInterval(() => playSynthBeepBurst(ctx), 800);
    } catch (e) { /* silent fail */ }
  }
  function stopSynthAlarmBeep() {
    if (synthAlarmInterval) {
      clearInterval(synthAlarmInterval);
      synthAlarmInterval = null;
    }
  }

  function showImage(index) {
    images.forEach(img => img.classList.remove('active'));
    images[index].classList.add('active');
  }

  function triggerAlarm() {
    // Stop the music before the alarm beeps
    bgMusic.pause();
    alarmSound.currentTime = 0;
    alarmSound.loop = true;
    const p = alarmSound.play();
    if (p && p.catch) {
      p.catch(() => playSynthAlarmBeep());
    }
  }

  function stopAlarm() {
    alarmSound.pause();
    alarmSound.currentTime = 0;
    stopSynthAlarmBeep();
  }

  function advance() {
    const onLastImage = current === total - 1;

    if (onLastImage) {
      // Stop the alarm, loop back to the first image, and resume the music
      stopAlarm();
      current = 0;
      showImage(current);
      bgMusic.currentTime = 0;
      bgMusic.play().catch(() => {});
    } else {
      current++;
      showImage(current);
      if (current === total - 1) {
        // Just reached the 10th image -> stop music, fire the alarm
        triggerAlarm();
      }
    }
  }

  stage.addEventListener('click', advance);

  startOverlay.addEventListener('click', () => {
    startOverlay.style.display = 'none';
    showImage(current);
    bgMusic.volume = 0.85;
    bgMusic.play().catch(() => {});
    setTimeout(() => { hint.style.opacity = '0'; }, 3500);
  });
</script>

</body>
</html>
