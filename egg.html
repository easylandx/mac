<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Egg</title>
<style>
  :root {
    --bg: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: min(100vw, 720px);
    height: min(100vh, 1280px);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }
  .stage img.active {
    opacity: 1;
  }
  .hint {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .hint.hidden { opacity: 0; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-1deg); }
    40% { transform: translateX(5px) rotate(1deg); }
    60% { transform: translateX(-4px) rotate(-0.5deg); }
    80% { transform: translateX(3px) rotate(0.5deg); }
  }
  .shake { animation: shake 0.35s ease; }

  @keyframes sizzlePulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.08); }
  }
  .sizzle { animation: sizzlePulse 0.6s ease-in-out 2; }
</style>
</head>

<script>
(function() {
  var stage = document.getElementById('stage');
  var imgs = [document.getElementById('img1'), document.getElementById('img2'), document.getElementById('img3')];
  var hint = document.getElementById('hint');
  var state = 0; // 0 = raw egg, 1 = cracking, 2 = fried
  var audioCtx = null;

  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function noiseBuffer(ctx, duration) {
    var bufferSize = Math.floor(ctx.sampleRate * duration);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  // Sharp egg-crack: a couple of quick transient clicks + a short brittle snap
  function playCrack() {
    var ctx = getCtx();
    var now = ctx.currentTime;

    function snap(time, freq, dur, gainVal) {
      var osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, time);
      osc.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.3, 40), time + dur);

      var gain = ctx.createGain();
      gain.gain.setValueAtTime(gainVal, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + dur);
    }

    function crackNoise(time, dur, gainVal, hp) {
      var buf = noiseBuffer(ctx, dur);
      var src = ctx.createBufferSource();
      src.buffer = buf;

      var filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = hp;

      var gain = ctx.createGain();
      gain.gain.setValueAtTime(gainVal, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(time);
      src.stop(time + dur);
    }

    // initial sharp tap
    snap(now, 1400, 0.03, 0.5);
    crackNoise(now, 0.04, 0.6, 2500);
    // secondary crack a beat later
    snap(now + 0.09, 900, 0.05, 0.4);
    crackNoise(now + 0.09, 0.06, 0.5, 1800);
    // trailing brittle crumble
    crackNoise(now + 0.16, 0.12, 0.25, 3000);
  }

  // Frying/sizzle: filtered noise with slow amplitude flutter, held for a bit
  function playSizzle() {
    var ctx = getCtx();
    var now = ctx.currentTime;
    var duration = 1.4;

    var buf = noiseBuffer(ctx, duration);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = false;

    var bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 1400;
    bandpass.Q.value = 0.5;

    var masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.exponentialRampToValueAtTime(0.14, now + 0.08);
    masterGain.gain.setValueAtTime(0.14, now + duration - 0.3);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    // Flutter: an LFO modulating gain to sound like popping/spitting oil
    var lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 10;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.1;
    lfo.connect(lfoGain);

    var flutterGain = ctx.createGain();
    flutterGain.gain.value = 1;
    lfoGain.connect(flutterGain.gain);

    src.connect(bandpass);
    bandpass.connect(flutterGain);
    flutterGain.connect(masterGain);
    masterGain.connect(ctx.destination);

    lfo.start(now);
    src.start(now);
    src.stop(now + duration);
    lfo.stop(now + duration);

    // A handful of random little pops for extra realism
    for (var i = 0; i < 10; i++) {
      (function() {
        var t = now + 0.1 + Math.random() * (duration - 0.2);
        var popBuf = noiseBuffer(ctx, 0.02);
        var popSrc = ctx.createBufferSource();
        popSrc.buffer = popBuf;
        var popFilter = ctx.createBiquadFilter();
        popFilter.type = 'bandpass';
        popFilter.frequency.value = 700 + Math.random() * 1200;
        popFilter.Q.value = 3;
        var popGain = ctx.createGain();
        popGain.gain.setValueAtTime(0.05 + Math.random() * 0.06, t);
        popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
        popSrc.connect(popFilter);
        popFilter.connect(popGain);
        popGain.connect(ctx.destination);
        popSrc.start(t);
        popSrc.stop(t + 0.02);
      })();
    }
  }

  function showImage(index, animClass) {
    for (var i = 0; i < imgs.length; i++) {
      imgs[i].classList.remove('active');
    }
    imgs[index].classList.add('active');
    if (animClass) {
      imgs[index].classList.remove(animClass);
      void imgs[index].offsetWidth;
      imgs[index].classList.add(animClass);
    }
  }

  function handleClick() {
    if (hint) {
      hint.classList.add('hidden');
    }
    if (state === 0) {
      playCrack();
      showImage(1, 'shake');
      state = 1;
    } else if (state === 1) {
      playSizzle();
      showImage(2, 'sizzle');
      state = 2;
    } else {
      showImage(0);
      state = 0;
    }
  }

  stage.addEventListener('click', handleClick);
  stage.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handleClick();
    }
  });
})();
</script>
