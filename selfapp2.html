<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SelfApp</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#2a1650;--violet:#7a4dff;--pink:#ff4f9a;--orange:#ff9a1f;--yellow:#ffe14d;--blue:#3fb4ff;--card:#ffffffd9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Poppins","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
background:radial-gradient(circle at 10% 10%,#ffe98a 0,transparent 40%),radial-gradient(circle at 90% 15%,#ffb3d6 0,transparent 42%),radial-gradient(circle at 80% 90%,#aee0ff 0,transparent 45%),radial-gradient(circle at 10% 90%,#ffc98a 0,transparent 40%),#fff6e0;
padding:clamp(28px,6vw,64px) clamp(28px,10vw,140px)}
main{max-width:820px;margin:0 auto}
.brand{display:inline-block;font-weight:800;font-size:1.15rem;letter-spacing:-.01em;background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;margin-bottom:18px;box-shadow:0 4px 0 var(--pink)}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{font-size:1.1rem;margin:0 0 32px;max-width:520px;opacity:.85}
.stage{background:var(--card);border-radius:28px;padding:clamp(16px,3vw,28px);box-shadow:0 18px 50px #7a4dff26;text-align:center}
.frame{position:relative;width:100%;max-width:420px;aspect-ratio:4/5;margin:0 auto 22px;border-radius:22px;overflow:hidden;background:#ffe9f3;border:4px solid var(--ink)}
.frame video,.frame canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;font-weight:600}
.hidden{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
button,label.btn{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:999px;padding:14px 26px;cursor:pointer;color:var(--ink);background:var(--yellow);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active,label.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pink{background:var(--pink);color:#fff}.green{background:#25d366;color:#fff}.blue{background:var(--blue)}
.big{font-size:1.15rem;padding:16px 34px}
.styles button{padding:8px 18px;font-size:.9rem;box-shadow:0 3px 0 var(--ink);background:#fff}
.styles button.on{background:var(--violet);color:#fff}
.msg{min-height:1.4em;margin:14px 0 0;font-size:.95rem}
footer{margin-top:28px;font-size:.85rem;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="brand">📸 SelfApp</div>
  <h1>Turn your selfie into an <span>illustration</span></h1>
  <p class="lead">Snap a photo, watch it become a colorful illustration, then retake it or send it on WhatsApp.</p>

  <section class="stage">
    <div class="frame">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="out" class="hidden"></canvas>
      <div id="hint" class="hint">Starting camera…</div>
    </div>

    <div id="styles" class="row styles hidden">
      <button data-s="cartoon" class="on">Cartoon</button>
      <button data-s="pop">Pop art</button>
      <button data-s="sketch">Sketch</button>
    </div>

    <div id="liveRow" class="row">
      <button id="snapBtn" class="big">📸 Take selfie</button>
      <button id="camBtn" class="blue hidden">Enable camera</button>
      <label class="btn pink hidden" id="upLabel">Use photo instead<input id="file" type="file" accept="image/*" capture="user" hidden></label>
    </div>

    <div id="resRow" class="row hidden">
      <button id="retakeBtn" class="pink">↺ Retake</button>
      <button id="waBtn" class="green big">Send via WhatsApp</button>
      <button id="dlBtn" class="blue">Save image</button>
    </div>
    <p id="msg" class="msg"></p>
  </section>
  <footer>Your photo is processed only in your browser and is never uploaded.</footer>
</main>

<script>
(function(){
  var W=480,H=600;
  var $=function(i){return document.getElementById(i)};
  var video=$('video'),out=$('out'),hint=$('hint'),msg=$('msg');
  var snap=document.createElement('canvas');snap.width=W;snap.height=H;
  var style='cartoon',stream=null;

  function show(live){
    $('liveRow').classList.toggle('hidden',!live);
    $('resRow').classList.toggle('hidden',live);
    $('styles').classList.toggle('hidden',live);
    out.classList.toggle('hidden',live);
    video.classList.toggle('hidden',!live);
  }

  function startCam(){
    msg.textContent='';
    hint.textContent='Starting camera…';hint.classList.remove('hidden');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return camFail();}
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false})
      .then(function(s){stream=s;video.srcObject=s;video.play();hint.classList.add('hidden');$('camBtn').classList.add('hidden');$('snapBtn').classList.remove('hidden');})
      .catch(camFail);
  }
  function camFail(){
    hint.textContent='Camera unavailable. Allow access or choose a photo.';
    $('snapBtn').classList.add('hidden');$('camBtn').classList.remove('hidden');$('upLabel').classList.remove('hidden');
  }

  function cover(src,sw,sh,mirror){
    var c=snap.getContext('2d'),r=Math.max(W/sw,H/sh),dw=sw*r,dh=sh*r;
    c.save();if(mirror){c.translate(W,0);c.scale(-1,1);}
    c.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);c.restore();
  }

  function blur(src,w,h,r){
    var tmp=new Uint8ClampedArray(src.length),o=new Uint8ClampedArray(src.length),n=2*r+1,x,y,k,c,s;
    for(y=0;y<h;y++)for(x=0;x<w;x++)for(c=0;c<3;c++){s=0;
      for(k=-r;k<=r;k++){s+=src[(y*w+Math.min(w-1,Math.max(0,x+k)))*4+c];}
      tmp[(y*w+x)*4+c]=s/n;}
    for(y=0;y<h;y++)for(x=0;x<w;x++){for(c=0;c<3;c++){s=0;
      for(k=-r;k<=r;k++){s+=tmp[(Math.min(h-1,Math.max(0,y+k))*w+x)*4+c];}
      o[(y*w+x)*4+c]=s/n;}o[(y*w+x)*4+3]=255;}
    return o;
  }

  var PAL=[[91,61,245],[255,79,154],[255,154,31],[255,225,77]];
  var INK=[42,22,80];

  function render(){
    out.width=W;out.height=H;
    var ctx=out.getContext('2d'),img=snap.getContext('2d').getImageData(0,0,W,H),d=img.data;
    var b=blur(blur(d,W,H,2),W,H,2);
    var lum=new Float32Array(W*H),i,x,y;
    for(i=0;i<W*H;i++)lum[i]=.299*b[i*4]+.587*b[i*4+1]+.114*b[i*4+2];
    var res=ctx.createImageData(W,H),o=res.data;
    for(y=0;y<H;y++)for(x=0;x<W;x++){
      i=y*W+x;var e=0;
      if(x>0&&y>0&&x<W-1&&y<H-1){
        var gx=-lum[i-W-1]-2*lum[i-1]-lum[i+W-1]+lum[i-W+1]+2*lum[i+1]+lum[i+W+1];
        var gy=-lum[i-W-1]-2*lum[i-W]-lum[i-W+1]+lum[i+W-1]+2*lum[i+W]+lum[i+W+1];
        e=Math.sqrt(gx*gx+gy*gy);
      }
      var r=b[i*4],g=b[i*4+1],bl=b[i*4+2],R,G,B,L=lum[i];
      if(style==='cartoon'){
        var a=(r+g+bl)/3;r=a+(r-a)*1.5;g=a+(g-a)*1.5;bl=a+(bl-a)*1.5;
        var q=function(v){v=Math.max(0,Math.min(255,v));return Math.round(v/255*4)/4*255};
        R=q(r);G=q(g);B=q(bl);
        if(e>90){R=INK[0];G=INK[1];B=INK[2];}
      }else if(style==='pop'){
        var p=PAL[Math.min(3,Math.floor(L/256*4))];R=p[0];G=p[1];B=p[2];
        if(e>80){R=INK[0];G=INK[1];B=INK[2];}
      }else{
        var t=Math.min(1,e/110)+(Math.round((1-L/255)*3)/3)*.22;t=Math.min(1,t);
        R=255+(INK[0]-255)*t;G=250+(INK[1]-250)*t;B=240+(INK[2]-240)*t;
      }
      var j=i*4;o[j]=R;o[j+1]=G;o[j+2]=B;o[j+3]=255;
    }
    ctx.putImageData(res,0,0);
  }

  $('snapBtn').onclick=function(){
    cover(video,video.videoWidth||W,video.videoHeight||H,true);
    render();show(false);msg.textContent='';
  };
  $('file').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var im=new Image();im.onload=function(){cover(im,im.width,im.height,false);render();show(false);hint.classList.add('hidden');};
    im.src=URL.createObjectURL(f);
  };
  $('camBtn').onclick=startCam;
  $('retakeBtn').onclick=function(){show(true);msg.textContent='';if(!stream)startCam();};

  document.querySelectorAll('#styles button').forEach(function(btn){
    btn.onclick=function(){
      style=btn.dataset.s;
      document.querySelectorAll('#styles button').forEach(function(x){x.classList.toggle('on',x===btn)});
      render();
    };
  });

  function blob(cb){out.toBlob(cb,'image/png');}
  function download(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='selfapp-illustration.png';
    document.body.appendChild(a);a.click();a.remove();
  }
  $('dlBtn').onclick=function(){blob(function(b){download(b);msg.textContent='Image saved.';});};

  $('waBtn').onclick=function(){
    blob(function(b){
      var file=new File([b],'selfapp-illustration.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],text:'Check out my selfie illustration! 🎨'})
          .catch(function(){msg.textContent='Sharing was cancelled.';});
      }else{
        download(b);
        msg.textContent='Image saved. Attach it in the WhatsApp chat that just opened.';
        window.open('https://wa.me/?text='+encodeURIComponent('Check out my selfie illustration! 🎨'),'_blank');
      }
    });
  };

  show(true);startCam();
})();
</script>
</body>
</html>
